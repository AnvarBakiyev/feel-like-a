<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script>window.CAFE_SITE = true;</script></head><body><title>Месяц кофейни</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one evening = one column of the owner's notebook: window on the shop, then tomorrow, then decisions, then one button to close the evening */
:root{
  --bg:#eceeea; --panel:#ffffff; --fg:#1d1a17; --muted:#615a53; --line:#d5d9d3;
  --espresso:#4a2f22; --awning:#1f6f68; --awning-soft:#dcefec;
  --ghost:#6d4bb0; --ghost-soft:#ece6f7; --ok:#22744a; --ok-soft:#e0f1e6; --bad:#b03a2e; --bad-soft:#f7e1de; --warn:#94600a; --warn-soft:#f8eed8;
  --wall:#e6e0d6; --floor:#cbbba8; --wood:#97663f; --milk:#fbfbf6; --sky:#cfe0ea; --skin:#c99a74; --guest:#6b7f8e; --wall2:#d6cdbf; --floor2:#b09c85; --wood2:#74492a; --wood3:#bd8a55;
  --display:"Bricolage Grotesque","Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
  --sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121514; --panel:#1b1f1e; --fg:#ebe7e2; --muted:#a39b93; --line:#2d3331;
  --espresso:#e2c3ad; --awning:#5cc0b5; --awning-soft:#16302d;
  --ghost:#b39ae8; --ghost-soft:#261f37; --ok:#6fcf98; --ok-soft:#15301f; --bad:#f0897c; --bad-soft:#3a1d19; --warn:#e9b54a; --warn-soft:#352812;
  --wall:#262421; --floor:#3b332c; --wood:#7a5338; --milk:#dcdcd3; --sky:#1d2a33; --skin:#b48660; --guest:#8fa3b2; --wall2:#312d29; --floor2:#4d4238; --wood2:#573a26; --wood3:#9a6c4c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121514; --panel:#1b1f1e; --fg:#ebe7e2; --muted:#a39b93; --line:#2d3331;
  --espresso:#e2c3ad; --awning:#5cc0b5; --awning-soft:#16302d;
  --ghost:#b39ae8; --ghost-soft:#261f37; --ok:#6fcf98; --ok-soft:#15301f; --bad:#f0897c; --bad-soft:#3a1d19; --warn:#e9b54a; --warn-soft:#352812;
  --wall:#262421; --floor:#3b332c; --wood:#7a5338; --milk:#dcdcd3; --sky:#1d2a33; --skin:#b48660; --guest:#8fa3b2; --wall2:#312d29; --floor2:#4d4238; --wood2:#573a26; --wood3:#9a6c4c; color-scheme:dark}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding-block:18px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header.top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.brand{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.01em;color:var(--espresso);background:none;border:0;padding:0;cursor:pointer}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,7vw,54px);line-height:.98;margin:0;letter-spacing:-.02em;color:var(--espresso);text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.15;margin:0;text-wrap:balance}
h3{font-size:16px;margin:0;font-weight:700}
p{margin:0;max-width:66ch}
.muted{color:var(--muted)} .small{font-size:14px} .note{font-size:13.5px;color:var(--muted)}
.mono,.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.eyebrow{font-size:13px;color:var(--muted);font-weight:700}
button,.btn{font:inherit;font-size:15px;padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;min-height:36px}
button:hover{border-color:var(--muted)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--awning);outline-offset:2px}
button.primary{background:var(--awning);border-color:var(--awning);color:var(--panel);font-weight:700}
button.on,button[aria-pressed="true"]{border-color:var(--awning);background:var(--awning-soft);font-weight:600}
button.link{border:0;background:none;padding:0;min-height:0;color:var(--awning);text-decoration:underline;text-underline-offset:3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:32px;padding:5px 10px;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
input[type=number]{font:inherit;font-family:var(--mono);width:5.2em;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)}
select{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)}
.step{display:inline-flex;align-items:center;gap:4px}
.step button{min-width:34px;padding:4px 0;font-family:var(--mono)}
.step .v{min-width:2.2em;text-align:center;font-family:var(--mono);font-weight:600}
.rej{border-left:3px solid var(--bad);background:var(--bad-soft);padding:6px 10px;border-radius:0 6px 6px 0;font-size:14.5px}
.okmsg{border-left:3px solid var(--ok);background:var(--ok-soft);padding:6px 10px;border-radius:0 6px 6px 0;font-size:14.5px}
.warnmsg{border-left:3px solid var(--warn);background:var(--warn-soft);padding:6px 10px;border-radius:0 6px 6px 0;font-size:14.5px}
.ghostbox{border-left:3px solid var(--ghost);background:var(--ghost-soft);padding:8px 12px;border-radius:0 8px 8px 0}
.pill{display:inline-block;font-size:12.5px;font-weight:700;padding:1px 8px;border-radius:99px;border:1px solid currentColor}
.pill.ok{color:var(--ok)} .pill.bad{color:var(--bad)} .pill.warn{color:var(--warn)} .pill.ghost{color:var(--ghost)} .pill.mut{color:var(--muted)}
.statbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
.stat .k{font-size:13px;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat.ghost{border-color:var(--ghost)} .stat.ghost .v{color:var(--ghost)}
.tbl{overflow-x:auto} table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap}
.windowbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.windowbox svg{display:block;width:100%;height:auto}
.windowbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.rprog{height:4px;background:var(--line);position:relative}
.rprog i{position:absolute;left:0;top:0;bottom:0;background:var(--espresso);width:0}
.rpbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 12px}
.rpbar .clock{font-family:var(--mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.rpbar .c{font-size:12px;color:var(--muted);font-weight:600}
.rpbar .c b{font-family:var(--mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--fg)}
.rpbar .c.q b{color:var(--bad)}
.rpbar .sp{flex:1 1 auto}
.fc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fc .d{border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0}
.fc .d.tom{border-color:var(--awning);background:var(--awning-soft)}
.fc .d{display:grid;gap:2px}
.fc .n{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.fc .nt{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:2px}
@media (max-width:620px){
  .fc{grid-template-columns:minmax(0,1fr);gap:6px}
  .fc .d{grid-template-columns:minmax(0,1fr) auto;gap:1px 12px;align-items:center;padding:8px 10px}
  .fc .hd{grid-column:1;grid-row:1}
  .fc .rg{grid-column:1;grid-row:2}
  .fc .n{grid-column:2;grid-row:1/3;text-align:right;font-size:22px}
  .fc .nt{grid-column:1/-1;grid-row:3}
}
.card{border:1px solid var(--warn);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.card .opts{display:flex;flex-wrap:wrap;gap:6px}
.supp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding-block:8px;border-bottom:1px dashed var(--line)}
.supp:last-child{border-bottom:0}
.qtys{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;grid-column:1/-1}
.qtys label{display:inline-flex;gap:6px;align-items:center;font-size:14.5px}
.nl{flex:1 0 100%;display:flex;flex-wrap:wrap;gap:3px 10px;align-items:center;margin:-2px 0 2px}
.nl .bar{position:relative;display:block;flex:0 0 110px;height:8px;border-radius:3px;background:var(--line);overflow:hidden}
.nl .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.nl .bar u{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);opacity:.7}
.nl .t{font-size:12px;color:var(--muted)}
.nl .t b{color:var(--fg);font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.nl .t.ok b,.nl .t.ok{color:var(--ok)}
.nl .t.bad b,.nl .t.bad{color:var(--bad)}
.dp3{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:6px 10px;align-items:center}
.closebar{position:sticky;bottom:0;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;z-index:5}
.combo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.opt{display:flex;flex-direction:column;gap:6px}
.lesson{display:flex;flex-direction:column;gap:12px}
.chart svg{display:block;width:100%;height:auto}
details>summary{cursor:pointer;font-weight:700;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"+ ";font-family:var(--mono);color:var(--awning)}
details[open]>summary::before{content:"− "}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .35s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}}

/* --- доработка интерфейса: шапка-дуэль, две колонки, полосы --- */
#main{display:flex;flex-direction:column;gap:14px}
.wrap.wide{max-width:1180px}
.cols{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
.cols>div{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:1040px){.cols{grid-template-columns:minmax(0,420px) minmax(0,1fr)}
  .cols>.colL{position:sticky;top:12px}}
.hero{display:grid;grid-template-columns:1fr;gap:16px;align-items:center}
@media (min-width:760px){.hero{grid-template-columns:.8fr 1.2fr}}
.duel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px 12px;align-items:center}
.duel .k{font-size:13px;color:var(--muted);font-weight:600}
.duel .v{font-family:var(--mono);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.duel .r{text-align:right}
.duel .r .v{color:var(--ghost)}
.duel .gap{font-family:var(--display);font-weight:800;font-size:14px;padding:3px 12px;border-radius:99px;white-space:nowrap}
.duel .gap.ok{background:var(--ok-soft);color:var(--ok)}
.duel .gap.bad{background:var(--ghost-soft);color:var(--ghost)}
.duel .gap.mut{background:var(--bg);color:var(--muted)}
.duel .bar{grid-column:1/-1;height:7px;border-radius:99px;background:var(--line);position:relative}
.duel .bar i{position:absolute;top:0;bottom:0;border-radius:99px}
.duel .bar b{position:absolute;top:-3px;bottom:-3px;left:calc(50% - 1px);width:2px;background:var(--muted);opacity:.6}
.track{display:flex;gap:2px;align-items:flex-end;height:14px;grid-column:1/-1}
.track i{flex:1 1 0;height:6px;border-radius:2px;background:var(--line)}
.track i.win{background:var(--ok)}
.track i.lose{background:var(--ghost)}
.track i.now{height:14px;background:var(--espresso)}
.hud{padding:10px 12px 2px;display:flex;flex-direction:column;gap:8px}
.hudtop{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline}
.hud .clock{font-family:var(--mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.hm small{font-size:11.5px;color:var(--muted);font-weight:600;margin-right:6px}
.hm b{font-family:var(--mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.hm.ok b{color:var(--ok)}
.hm.bad b{color:var(--bad)}
.hstock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 12px}
.hs{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 6px;font-size:11.5px;align-items:baseline}
.hs .k{color:var(--muted);font-weight:600}
.hs .v{font-family:var(--mono);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.hs .bar{grid-column:1/-1;height:7px;border-radius:99px;background:var(--line);overflow:hidden;position:relative;display:block}
.hs .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--awning)}
.hs.low .bar i{background:var(--warn)}
.hs.out .bar i{background:var(--bad)}
.hs.out .v{color:var(--bad)}
.hprob{display:flex;flex-wrap:wrap;gap:5px;min-height:24px;align-items:center}
@media (max-width:560px){.hstock{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sit .lg{display:none}
.rpP .mk{display:none}
.rpP.dec .mk{display:inline}
.rpC.drop .bx{display:none}
.dance{animation:dance .46s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes dance{from{transform:rotate(-9deg)}to{transform:rotate(9deg) translateY(-3px)}}
.nts text{animation:fl 1.6s linear infinite}
.nts text:nth-child(2){animation-delay:.8s}
@keyframes fl{from{opacity:.9;transform:translateY(0)}to{opacity:0;transform:translateY(-14px)}}
.rpS.hop{animation:hop .42s ease-in-out infinite alternate}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.dance,.nts text,.rpS.hop{animation:none}}
.steam path{animation:steam 2.6s ease-in-out infinite;opacity:0}
.steam path:nth-child(2){animation-delay:.9s}
.steam path:nth-child(3){animation-delay:1.7s}
@keyframes steam{0%{opacity:0;transform:translateY(3px)}40%{opacity:.6}100%{opacity:0;transform:translateY(-7px)}}
.rain line{animation:rain .6s linear infinite}
@keyframes rain{from{transform:translate(3px,-9px)}to{transform:translate(-3px,9px)}}
.snow circle{animation:snow 4s linear infinite}
@keyframes snow{from{transform:translateY(-12px)}to{transform:translateY(70px)}}
@media (prefers-reduced-motion:reduce){.steam path{animation:none;opacity:.4}.rain line,.snow circle{animation:none}}
.ecard{padding:0}
.ecard>details>summary{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:12px 14px;cursor:pointer;list-style:none}
.ecard summary::-webkit-details-marker{display:none}
.ecard>details>summary::before,.ecard>details[open]>summary::before{content:none}
.ecard .et{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.15}
.ecard .et::before{content:"\25B8";color:var(--muted);margin-right:6px;font-size:14px}
.ecard details[open] .et::before{content:"\25BE"}
.ecard .es{grid-column:1;font-size:13.5px;font-weight:400;color:var(--muted);min-width:0;line-height:1.35}
.ecard summary .pill{grid-column:2;grid-row:1/3;align-self:center;white-space:nowrap}
.ecard .eb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.daystage{display:flex;flex-direction:column;gap:14px;max-width:760px;margin:0 auto;width:100%}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.dayhead h1{margin:0}
.reveal{display:flex;flex-direction:column;gap:14px;animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.bigday{font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,48px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.race{display:grid;gap:7px}
.duel .race{grid-column:1/-1}
.lane{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.lane .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane .nm small{font-family:var(--mono);color:var(--muted);font-weight:600;margin-right:4px}
.lane .tr{position:relative;height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.lane .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.lane .sc{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.lane.me .nm{color:var(--espresso)}
.says{display:grid;gap:10px}
.says .s{border-left:3px solid var(--line);padding:1px 0 1px 10px}
.says .s b{display:block;font-size:13px}
.says .s span{font-size:13.5px;color:var(--muted);line-height:1.4}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
@media (prefers-reduced-motion:reduce){.reveal{animation:none}.lane .tr i{transition:none}}
@media (max-width:560px){.lane{grid-template-columns:minmax(0,92px) minmax(0,1fr) auto;gap:8px;font-size:12px}}
.stand{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.stand .ch{display:inline-flex;gap:5px;align-items:center;font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 9px;white-space:nowrap}
.stand .ch b{font-family:var(--mono);font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}
.stand .ch.me{background:var(--espresso);border-color:var(--espresso);color:var(--panel)}
.stand .ch.me b{color:var(--panel)}
.stand .ch.ext b{color:var(--ghost)}
.who{display:grid;gap:10px}
.who .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline}
.who .r .n{font-weight:700}
.who .r .s{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.who .r .d{grid-column:1/-1;font-size:13px;color:var(--muted);line-height:1.35}
.who .r.me .n{color:var(--espresso)}
.cell{display:block;min-width:0}
.capbar{position:relative;display:block;max-width:150px;height:9px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:3px}
.capbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.capbar u{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);opacity:.75}
.supp.off{opacity:.5}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(76px,1fr));gap:6px 10px;padding:0 12px 10px}
.mini>div{min-width:0}
.mini .k{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.2}

<script>// Месяц кофейни: перенос sim/sim.py строка в строку. Тест совпадения: web/parity.mjs.
// Город (city_ny.json) передаётся аргументом: страница кладёт его в себя, файлов не читает.
(function (root) {
"use strict";
const DRINKS = ["latte", "cold_brew", "drip", "tea"];
const DP_N = 3;
const WD_RU = ["пн", "вт", "ср", "чт", "пт", "сб", "вс"];
const WD_EN = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const SUP_RU = { dairy: "Молочный поставщик", roaster: "Обжарщик", bakery: "Пекарня" };
const SUP_EN = { dairy: "The dairy", roaster: "The roaster", bakery: "The bakery" };
const ITEM_RU = { latte: "латте", cold_brew: "колд-брю", drip: "фильтр-кофе", tea: "чай", croissant: "круассан" };
const DP_RU = ["утро", "день", "вечер"];
const DP_EN = ["morning", "midday", "evening"];

// ---------- переносимые основы ----------
const rnd = (x) => Math.floor(x + 0.5);
const cents = (x) => Math.floor(x * 100 + 0.5) / 100;
function fnv(s) {
  let h = 2166136261 >>> 0;
  const b = new TextEncoder().encode(s);
  for (const ch of b) { h ^= ch; h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
class Rng {
  constructor(seed) { this.a = seed >>> 0; }
  u() {
    this.a = (this.a + 0x6D2B79F5) >>> 0;
    let t = this.a;
    t = Math.imul(t ^ (t >>> 15), t | 1) >>> 0;
    t = (t ^ ((t + (Math.imul(t ^ (t >>> 7), t | 61) >>> 0)) >>> 0)) >>> 0;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  int(lo, hi) { return lo + Math.floor(this.u() * (hi - lo + 1)); }
  pick_w(w) {
    let s = 0; for (const x of w) s += x;
    const x = this.u() * s; let acc = 0;
    for (let i = 0; i < w.length; i++) { acc += w[i]; if (x < acc) return i; }
    return w.length - 1;
  }
}
const clamp = (x, lo, hi) => (x < lo ? lo : x > hi ? hi : x);
const sum = (a) => { let s = 0; for (const x of a) s += x; return s; };
function split_lr(n, shares) {
  const tot = sum(shares);
  const raw = shares.map((s) => (n * s) / tot);
  const base = raw.map((r) => Math.floor(r));
  const rest = n - sum(base);
  const order = shares.map((_, i) => i).sort((i, j) => (-(raw[i] - base[i])) - (-(raw[j] - base[j])) || i - j);
  for (const i of order.slice(0, rest)) base[i] += 1;
  return base;
}
const days_in_month = (y, m) => [31, (y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0)) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1];
function weekday(y, m, d) {
  const t = [0, 3, 2, 5, 0, 3, 5, 1, 4, 6, 2, 4];
  const yy = m < 3 ? y - 1 : y;
  const w = (yy + Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) + t[m - 1] + d) % 7;
  return (w + 6) % 7;
}
const pad = (n, k) => String(n).padStart(k, "0");
const f2 = (x) => x.toFixed(2);
// str() Python для чисел в текстах отказов: целое float печатается с ".0" только если пришло дробным; у нас решения целые
const pstr = (x) => String(x);
const rej = (field, code, ru, en) => ({ field, code, ru, en });
const isInt = (x) => Number.isInteger(x);
const isNum = (x) => typeof x === "number" && isFinite(x);
const isObj = (x) => x !== null && typeof x === "object" && !Array.isArray(x);
// истинность как в Python: пустой список и пустой объект ложны
const truthy = (x) => Array.isArray(x) ? x.length > 0 : isObj(x) ? Object.keys(x).length > 0 : !!x;
const or = (x, d) => (truthy(x) ? x : d);
const form = (field, ru, en) => rej(field, "form", "Неверная форма поля «" + field + "»: " + ru + ".", "Wrong form of '" + field + "': " + en + ".");
const EMPTY_OK = () => ({ orders: {}, prices: {}, hire: 0, fire: 0, buy: [], choices: {} });
const clone = (x) => JSON.parse(JSON.stringify(x));
const pyround = (x, n) => { const k = Math.pow(10, n); return Math.round(x * k) / k; };

// ---------- мир ----------
function make_world(seed, street, money, scenario, C) {
  const sc = C.scenarios[scenario];
  const [y, m, d0] = sc.start;
  const n = C.days;
  const R = (label) => new Rng(fnv(String(seed) + ":" + label));
  const days = [];
  const wd0 = weekday(y, m, d0);
  const wx = C.weather[sc.weather];
  const dim = days_in_month(y, m);
  const rw = R("weather");
  for (let i = 0; i < n; i++) {
    const dd = d0 + i;
    const date = pad(y, 4) + "-" + pad(m, 2) + "-" + pad(dd, 2);
    const u = rw.u();
    const p_snow = wx.snow_days / dim, p_rain = wx.rain_days / dim;
    const w = u < p_snow ? "snow" : u < p_snow + p_rain ? "rain" : "clear";
    days.push({ date, wd: (wd0 + i) % 7, weather: w, holiday: date in C.holidays ? C.holidays[date] : 1.0 });
  }
  const rn = R("noise");
  const noise = [];
  for (let i = 0; i < n; i++) { const r = []; for (let j = 0; j < DP_N; j++) r.push(1 + C.noise * (2 * rn.u() - 1)); noise.push(r); }
  const re = R("events");
  const used = new Set();
  const events = [];
  const range = (lo, hi) => { const a = []; for (let d = lo; d <= hi; d++) a.push(d); return a; };
  function free_day(lo, hi, pred = () => true) {
    let cand = range(lo, hi).filter((d) => !used.has(d) && pred(d));
    if (!cand.length) { cand = range(lo, hi).filter((d) => pred(d)); if (!cand.length) cand = range(lo, hi); }
    const d = cand[re.int(0, cand.length - 1)];
    used.add(d);
    return d;
  }
  const E = C.events;
  const dairy_days = C.suppliers.dairy.days;
  sc.events.forEach((kind, k) => {
    const ev = { id: kind + "_" + k, kind };
    if (kind === "blogger") { ev.day = free_day(3, 20); ev.show = ev.day - 2; ev.hidden = { boost: E.blogger.outcomes[re.pick_w(E.blogger.weights)] }; }
    else if (kind === "repair") { ev.day = free_day(5, 20); ev.show = ev.day - E.repair.notice; ev.hidden = { recover: E.repair.sign_recover[re.int(0, 2)] }; }
    else if (kind === "inspection") { ev.day = free_day(4, 27); ev.show = ev.day - E.inspection.notice; ev.hidden = { u: re.u() }; }
    else if (kind === "breakdown") { ev.day = free_day(2, 27); ev.show = ev.day + 1; }
    else if (kind === "sick") { ev.day = free_day(1, 27); ev.show = ev.day; }
    else if (kind === "dairy_up") { ev.day = free_day(5, 20); ev.show = ev.day - E.dairy_up.notice; }
    else if (kind === "catering") { ev.day = free_day(2, 27, (d) => days[d].wd < 5); ev.show = ev.day; }
    else if (kind === "fair") { ev.day = free_day(7, 27, (d) => days[d].wd === 5); ev.show = ev.day - E.fair.notice; }
    else if (kind === "no_show") { ev.day = free_day(2, 27, (d) => dairy_days.includes(days[d].wd)); ev.show = null; }
    else if (kind === "blizzard") { ev.day = free_day(8, 24); ev.show = ev.day - E.blizzard.notice; ev.hidden = { keep: E.blizzard.severity[re.int(0, 2)] }; days[ev.day].weather = "blizzard"; }
    else if (kind === "competitor") { ev.day = E.competitor.open_day; used.add(ev.day); ev.show = ev.day - 2; ev.hidden = { s: E.competitor.strength[re.int(0, 2)] }; }
    events.push(ev);
  });
  events.sort((a, b) => a.day - b.day || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
  const ri = R("invest");
  const hidden_inv = { marketing_lift: C.investments.marketing.lift[ri.int(0, 2)] };
  return { hidden_inv, seed, street, money, scenario, days, noise, events };
}

const OPTIONS = {
  blogger: ["accept", "decline"], repair: ["sign", "none"], inspection: ["clean", "none"],
  breakdown: ["fast", "slow"], sick: ["agency", "short"], dairy_up: ["ok"], catering: ["accept", "decline"],
  fair: ["ok"], blizzard: ["open", "close"], competitor: ["loyalty", "promo", "none"], complaint: ["coupons", "reply", "ignore"],
};
const card_options = (kind) => OPTIONS[kind].slice();
const DEFAULT = { blogger: "decline", repair: "none", inspection: "none", breakdown: "slow", sick: "short", dairy_up: "ok",
  catering: "decline", fair: "ok", blizzard: "open", competitor: "none", complaint: "ignore", no_show: "none" };

// ---------- игра ----------
class Game {
  constructor(seed, street, money, scenario, C) {
    this.C = C;
    this.W = make_world(seed, street, money, scenario, C);
    this.t = 0;
    const st = C.streets[street];
    this.base = st.guests;
    this.rent_day = st.rent_month / C.days;
    this.cash = C.money[money];
    this.loan = 0.0;
    this.rep = C.reputation.start;
    this.prices = {};
    for (const k of DRINKS.concat(["croissant"])) this.prices[k] = C.menu[k].price;
    this.discounts = [];
    const S = C.staff;
    this.staff = [];
    for (let i = 0; i < S.start_baristas; i++) this.staff.push({ id: "b" + (i + 1), role: "barista", start: 0 });
    for (let i = 0; i < S.start_leads; i++) this.staff.push({ id: "l" + (i + 1), role: "lead", start: 0 });
    this.next_id = S.start_baristas + 1;
    this.schedule = {};
    for (let w = 0; w < 7; w++) this.schedule[String(w)] = { barista: [2, 2, 1], lead: [1, 0, 0] };
    const g = this.base;
    const lat = C.menu.latte;
    const milk_day = g * lat.share * lat.milk_l;
    const beans_day = g * sum(DRINKS.map((k) => C.menu[k].share * C.menu[k].beans_g));
    const sd = C.start_stock_days;
    this.milk = [[cents(milk_day * sd.milk), 2]];
    this.beans_g = rnd(beans_day * sd.beans);
    this.cups = rnd(g * sd.cups);
    this.croissant = 0;
    this.orders = {};
    this.choices = {};
    this.cards_extra = [];
    this.grade_b_from = null;
    this.week_hours = { barista: 0.0, lead: 0.0 };
    this.totals = {};
    for (const k of ["revenue", "purchases", "refunds", "wages", "rent", "fixed", "card_fees", "event_costs", "agency", "investments"]) this.totals[k] = 0.0;
    this.counts = { stockout_guests: 0, queue_guests: 0, guests: 0, demand: 0, written_off_milk_l: 0.0, written_off_croissant: 0 };
    this.journal = [];
    this.last_report = null;
    this.pending_rejections = [];
    this.pending_decisions = [];
    this.bought = {};
    this.clean_paid = new Set();
  }
  done() { return this.t >= this.C.days; }
  ev(kind) { return this.W.events.filter((e) => e.kind === kind); }
  choice(e) { return e.id in this.choices ? this.choices[e.id] : DEFAULT[e.kind]; }
  milk_price(day) {
    let p = this.C.suppliers.dairy.items.milk.price;
    for (const e of this.ev("dairy_up")) if (day >= e.day) p = cents(p * (1 + this.C.events.dairy_up.pct));
    return p;
  }
  has(inv, day) { return inv in this.bought && day >= this.bought[inv]; }
  headcount(role, day, include_pending = false) { return this.staff.filter((s) => s.role === role && (include_pending || s.start <= day)).length; }
  sick_out(day) { return this.ev("sick").filter((e) => e.day <= day && day <= e.day + this.C.events.sick.days - 1).length; }
  eff_price(item, dp) {
    let p = this.prices[item];
    for (const d of this.discounts) if (d.item === item && d.dayparts.includes(dp)) p = cents(p * (1 - d.pct / 100.0));
    return p;
  }
  cost_of(item, day) {
    const C = this.C;
    if (item === "croissant") return C.suppliers.bakery.items.croissant.price;
    const m = C.menu[item], beans = C.suppliers.roaster.items.beans, cups = C.suppliers.roaster.items.cups, milk = C.suppliers.dairy.items.milk;
    return cents(m.beans_g * beans.price / beans.grams + m.milk_l * this.milk_price(day) / milk.liters + m.cup * cups.price / cups.count + m.other);
  }
  demand_mult(day, hidden) {
    const C = this.C, W = this.W, D = W.days[day];
    let m = C.weekday_mult[D.wd] * D.holiday;
    const notes = []; let extra = 0.0;
    const w = D.weather;
    if (w !== "blizzard") m *= C.weather_mult[w];
    for (const e of W.events) {
      const k = e.kind, E = C.events[k] || {};
      if (k === "fair" && day === e.day) { m *= E.mult; notes.push("fair"); }
      else if (k === "repair" && e.day <= day && day < e.day + E.days) {
        let loss = 1 - E.mult;
        if (this.choice(e) === "sign") {
          if (hidden) loss *= 1 - e.hidden.recover;
          else { const r = E.sign_recover; loss *= 1 - sum(r) / r.length; extra += 0.08; }
        }
        m *= 1 - loss; notes.push("repair");
      } else if (k === "blogger" && this.choice(e) === "accept" && e.day < day && day <= e.day + E.days) {
        if (hidden) m *= 1 + e.hidden.boost; else extra += 0.2;
        notes.push("blogger");
      } else if (k === "blizzard" && day === e.day) {
        if (hidden) m *= e.hidden.keep; else { const sv = E.severity; m *= sum(sv) / sv.length; extra += 0.2; }
        notes.push("blizzard");
      } else if (k === "competitor" && day >= e.day) {
        let s = hidden ? e.hidden.s : sum(E.strength) / E.strength.length;
        if (!hidden) extra += 0.08;
        if (this.choice(e) === "promo" && day < e.day + E.promo_days) s *= 0.5;
        const pidx = this.price_index(1);
        const f = clamp(1 + 1.5 * (pidx - 1) - 2 * (this.rep - 1), 0.5, 1.5);
        m *= 1 - s * f; notes.push("competitor");
      }
    }
    if ("marketing" in this.bought) {
      const I = C.investments.marketing, d0 = this.bought.marketing;
      if (d0 <= day && day < d0 + I.days) {
        if (hidden) m *= 1 + W.hidden_inv.marketing_lift;
        else { m *= 1 + sum(I.lift) / I.lift.length; extra += 0.06; }
        notes.push("marketing");
      }
    }
    if (this.grade_b_from !== null && day >= this.grade_b_from) { m *= C.events.inspection.b_mult; notes.push("grade_b"); }
    return [m * this.rep, notes, extra];
  }
  price_index(dp) {
    const M = this.C.menu;
    const num = sum(DRINKS.map((k) => M[k].share * this.eff_price(k, dp)));
    const den = sum(DRINKS.map((k) => M[k].share * M[k].price));
    return num / den;
  }
  expected_guests(day, hidden) {
    const C = this.C;
    const [m, notes, extra] = this.demand_mult(day, hidden);
    const out = [];
    for (let dp = 0; dp < DP_N; dp++) {
      const pi = this.price_index(dp);
      const pm = Math.pow(pi, pi > 1 ? C.elasticity_drinks.up : C.elasticity_drinks.down[dp]);
      out.push(this.base * C.hours.share[dp] * m * pm);
    }
    return [out, notes, extra];
  }
  closed(day) { return this.W.events.some((e) => e.kind === "blizzard" && e.day === day && this.choice(e) === "close"); }
  open_cards() {
    const t = this.t, ev_ = t - 1;
    const cards = [];
    for (const e of this.W.events.concat(this.cards_extra)) {
      if (e.show === null || e.show === undefined) continue;
      const deadline = "deadline" in e ? e.deadline : (e.kind === "breakdown" ? e.day : e.day - 1);
      if (e.show - 1 <= ev_ && ev_ <= deadline) {
        const c = { id: e.id, kind: e.kind, day: e.day, options: card_options(e.kind),
          chosen: e.id in this.choices ? this.choices[e.id] : null, default: DEFAULT[e.kind], decide_by_evening_of: deadline };
        if (e.kind === "breakdown") c.day = e.day + 1;
        cards.push(c);
      }
    }
    return cards;
  }
  observe() {
    const C = this.C, t = this.t;
    const fc = [];
    for (let d = t; d < Math.min(t + 3, C.days); d++) {
      const [g, notes, extra] = this.expected_guests(d, false);
      const band = C.noise + extra;
      const D = this.W.days[d];
      fc.push({ day: d, date: D.date, wd: D.wd, weather: D.weather, notes,
        guests: g.map((x) => rnd(x)), low: g.map((x) => rnd(x * (1 - band))), high: g.map((x) => rnd(x * (1 + band))),
        closed_if_chosen: this.closed(d) });
    }
    const nxt = t < C.days ? this.W.days[t] : null;
    const sup = {};
    for (const [s, S] of Object.entries(C.suppliers)) {
      const items = {};
      for (const [it, I] of Object.entries(S.items)) items[it] = it !== "milk" ? I.price : this.milk_price(t);
      sup[s] = { days: S.days, delivers_tomorrow: nxt !== null && S.days.includes(nxt.wd),
        min_order: "min_order" in S ? S.min_order : null, min_qty: "min_qty" in S ? S.min_qty : null, prices: items };
    }
    const costs = {};
    for (const k of DRINKS.concat(["croissant"])) costs[k] = this.cost_of(k, t);
    const inv = {};
    for (const [k, v] of Object.entries(C.investments)) inv[k] = { cost: v.cost, bought_from_day: k in this.bought ? this.bought[k] : null };
    return {
      day: t, date: nxt ? nxt.date : null, wd: nxt ? nxt.wd : null, days_total: C.days,
      cash: cents(this.cash), loan: cents(this.loan), reputation: pyround(this.rep, 3),
      stock: { milk_l: this.milk.map(([a, b]) => [cents(a), b]), beans_lb: cents(this.beans_g / C.suppliers.roaster.items.beans.grams),
        cups: this.cups, croissant: this.croissant },
      staff: this.staff.map((s) => Object.assign({}, s)), schedule: clone(this.schedule),
      prices: Object.assign({}, this.prices), discounts: clone(this.discounts), costs,
      suppliers: sup, forecast: fc, cards: this.open_cards(), grade: this.grade_b_from !== null && this.grade_b_from <= t ? "B" : "A",
      investments: inv, yesterday: this.last_report, totals: Object.fromEntries(Object.entries(this.totals).map(([k, v]) => [k, cents(v)])),
      counts: Object.assign({}, this.counts),
    };
  }
  check(dec) {
    const C = this.C, t = this.t;
    const out = [];
    if (t >= C.days) return [[rej("day", "over", "Месяц закончился.", "The month is over.")], null];
    if (!isObj(dec)) return [[form("decision", "нужен объект JSON", "a JSON object is required")], EMPTY_OK()];
    const D = this.W.days[t], wd = D.wd;
    let cash = this.cash;
    const ok = {};
    let orders = or(dec.orders, {});
    if (!isObj(orders)) { out.push(form("orders", "нужен объект {поставщик: {позиция: количество}}", "an object {supplier: {item: qty}} is required")); orders = {}; }
    const ok_orders = {};
    for (const [s, items0] of Object.entries(orders)) {
      if (truthy(items0) && !isObj(items0)) { out.push(form("orders." + s, "нужен объект {позиция: количество}", "an object {item: qty} is required")); continue; }
      if (!(s in C.suppliers)) { out.push(rej("orders." + s, "no_supplier", "Нет поставщика «" + s + "».", "No supplier '" + s + "'.")); continue; }
      const S = C.suppliers[s];
      const items = {};

function replay(seed, settings, decisions, C) {

ence.","Stocking up before a big Saturday. Evening capacity sits idle, so testing a 10% evening latte discount.","The discount lifted the evening forecast ~10%, so extending it to midday where capacity is idle. Big Saturday plus inspection day: capacity covers the top of th","Calmer Sunday, two baristas suffice in the evening. Skipping the second machine: $3500 does not pay back when a barista-daypart buys 48 drinks for $80.","Quieter Monday; capacity covers the forecast top. Milk and beans still suffice, big orders go on the roaster and dairy delivery days.","The $120 sign against a ~$2500 loss over seven days. Roaster delivers tomorrow then only Friday, so 40 lb of beans and 1000 cups.","No agency needed: seven baristas on staff, one sick, and no daypart needs more than three. Fresh milk ordered for days 15-18.","First day under scaffolding; capacity covers the top of a wide range. Both dairy and roaster deliver tomorrow, which is when I stock up for the fair.","Last day before the fair: stock all three suppliers while milk is still at the old price. Running out on fair day costs more than spoiled milk.","Fair day: 14 barista-dayparts cost about $1100 against $3400-4100 of guests. Capacity set above the top of the range, 220 croissants.","Back to the normal shift after the fair; the forecast top fits the capacity exactly. Milk and beans last until the Monday and Tuesday deliveries.","Accepting catering with a fourth morning barista so no guest is turned away. Accepting the blogger: average +12% for five days is worth ~$1200 against $60 plus ","Marketing has run out and traffic is lower: two baristas plus the lead cover the morning. Beans and cups stocked until Friday.","The shoot halves the morning counter, so five baristas keep effective capacity at 132 against a top of 126. Fresh milk for the post-review days.","Scaffolding gone, and the post-review range is wide. Morning and midday covered with slack; tomorrow the real review effect shows and I tune the rest of the wee","The review landed well. Third barista for the evening and 150 croissants: spoilage costs $1.50 while a lost guest costs about $6. Stocked from all three supplie","Post-review traffic runs at the top of the range. Saturday capacity set to 216/192/144; yesterday midday came within two of the cap.","Quieter Sunday but traffic runs high. Keeping three in the evening since evenings have stayed above 100 guests.","Last day of the review effect. Fresh milk ordered to carry the month out; beans and cups go on the Tuesday roaster delivery.","Review effect over, narrow forecast range. Capacity matches the top exactly. Cups were down to 144, so 2000 cups and 50 lb of beans carry the month out; milk is","Without marketing or the review, traffic runs below mid: 115 in the morning against a 168 cap. Dropping the third morning barista. Milk, beans and cups already ","Yesterday confirmed the math: two guests lost for $10 where a third shift would have cost $80. Same shift, and no new orders beyond croissants so nothing is lef","Busier Friday: the third morning barista returns, since 11-21 lost guests cost far more than the $80 shift. Beans and milk cover the last two days exactly."]}},"calm_quiet_high":{"qwen":{"daily":[-6959.56,-7699.47,-7651.83,-8068.85,-8426.4,-8952.38,-9752.08,-11159.67,-12419.49,-13070.81,-15915.92,-18105.51,-18817.52,-20372.22,-21653.0,-22491.88,-22762.83,-25507.87,-27230.73,-29008.04,-30151.13,-31488.22,-33484.23,-35226.8,-38777.87,-40616.78,-42414.25,-44301.33,-45598.98,-48340.36],"score":-48340.36,"parts":{"revenue":14327.75,"purchases":-27330.0,"leftover_stock":23885.74,"wages":-35122.2,"rent_fixed":-11429.87,"card_fees":-676.68,"event_costs":-880.0,"investments":-0.0,"leftover_equipment":0.0,"stockout_penalty":-9459.0,"queue_penalty":-45.0,"loan_penalty":-1611.1},"model":"openrouter:qwen/qwen3.5-9b@DeepInfra,Parasail","fallbacks":0,"why_ru":["Молоко и обжарщик не едут завтра, круассаны заказываю минимум.","Увеличиваю заказ молока до минимума п на по две закрывает даже верх диапазона, круассанов беру по верхней трети.","Молоко беру сегодня по старой цене — с дня 17 оно дороже на 8 процентов. Зерно и стаканы под субботнюю ярмарку: на 340 гостей нужно 12 фунтов зерна за день.","Ярмарка: до 377 гостей, утром и днём нужно по три бариста, иначе очередь съест по $10 с гостя. Вечером хватает двух, круассанов 130.","Ярмарка дала 340 гостей без очереди. Воскресенье с ремонтом тише, смена по две, круассанов 76 под прогноз 212.","Кейтеринг даёт около $219 маржи, но съедает 60 мест утренней смены — ставлю третьего бариста утром, чтобы гости не ушли. Вечером дождливого понедельника хватает","Вечером приход держится у середины прогноза, 48 мест одного бариста хватает — экономлю $71 против риска потерять двух гостей. Зерна осталось 6,5 фунта, беру до ","Обзор меняет поток в среднем на плюс 12 процентов пять дней — это около $745 маржи против $60 завтрака и одного бариста. Стойка работает вполовину, поэтому утро","Прогноз широкий: 157-277, отдача обзора пока не видна. Смена по две держит даже верх диапазона, круассанов 88 по уровню обслуживания 81 процент.","Зерно и стаканы на весь остаток месяца сразу: остатки зачтутся по себестоимости, значит запас бесплатен, а срыв привоза исключён. Молоко 151 л закрывает дни 22-","Обзор даёт плюс 20 процентов к середине прогноза: вчера днём уже не хватило мест и кончились круассаны. Утром и днём по три бариста, круассанов 115.","Воскресенье спокойнее: даже с поправкой на обзор утро упирается в 112 гостей против 120 мест, хватает двух. Круассанов 98 по замеренной доле 35 процентов.","Последнюю партию молока беру сегодня, а не в среду: партия годна до дня 31 и закрывает все оставшиеся дни, а срыв привоза в среду стоил бы дороже лишней порчи.","Обзор отработал, прогноз снова узкий. Зерна на четыре дня не хватало 0,2 фунта, добираю минимальным заказом — остаток зачтётся по себестоимости.","Запасов хватает на все три оставшихся дня, докупать нечего. Смена по две под прогноз 222, круассанов /* ---------- соперники: призрак Extella и четыре счётных игрока ---------- */
var MODELS = ["extella", "qwen", "opus"];   // соперники — только модели
var MCOLOR = {extella: "var(--ghost)", qwen: "var(--bad)", opus: "var(--ok)"};
function rivalData(k){
  if (k === "extella") return ghost();
  return ((DATA.models || {})[key()] || {})[k] || null;
}
function rivalName(k){ return t("r_" + k); }
function modelsHere(){ return MODELS.filter(function(k){ return !!rivalData(k); }); }
/* счёт каждого на конец дня tday; tday 0 — все по нулям */
function standings(tday, myScore, keys){
  var rows = [{k: "me", name: t("you"), score: tday ? myScore : 0, me: true}];
  (keys || modelsHere()).forEach(function(k){ var d = rivalData(k);
    if (d) rows.push({k: k, name: rivalName(k), score: tday ? d.daily[tday - 1] : 0}); });
  rows.sort(function(a, b){ return b.score - a.score; });
  rows.forEach(function(r, i){ r.place = i + 1; });
  return rows;
}
/* дорожки: у каждого своя, длина полосы = счёт. Кто ушёл втрое ниже остальных,
   масштаб не задаёт: его полоса у левого края, а число красное. */
function raceHTML(rows, prev){
  var order = ["me"].concat(MODELS), byK = {}, byP = {};
  rows.forEach(function(r){ byK[r.k] = r; }); (prev || []).forEach(function(r){ byP[r.k] = r; });
  var base = rows.filter(function(r){ return r.me || r.k === "extella"; }).map(function(r){ return r.score; });
  var loB = Math.min.apply(null, base.concat([0])), vals = [];
  rows.forEach(function(r){ if (r.score >= loB * 3 - 1) { vals.push(r.score); if (byP[r.k]) vals.push(byP[r.k].score); } });
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), span = Math.max(1, hi - lo);
  var w = function(v){ return v < lo ? 3 : Math.max(3, Math.min(100, 8 + 92 * (v - lo) / span)); };
  return '<div class="race">' + order.filter(function(k){ return byK[k]; }).map(function(k){ var r = byK[k], out = r.score < lo;
    var col = r.me ? "var(--awning)" : (MCOLOR[k] || "var(--muted)"), w1 = w(r.score), w0 = byP[k] ? w(byP[k].score) : w1;
    var short = r.me ? r.name : ({extella: "Extella", qwen: "Qwen 9B", opus: "Opus 5"}[k] || r.name);
    return '<div class="lane'+(r.me ? " me" : "")+'"><span class="nm" title="'+esc(r.name)+'"><small>'+r.place+'</small>'+esc(short)+'</span>' +
      '<span class="tr"><i data-w="'+w1.toFixed(1)+'" style="width:'+(prev ? w0 : w1).toFixed(1)+'%;background:'+col+'"></i></span>' +
      '<span class="sc"'+(out ? ' style="color:var(--bad)"' : '')+'>'+money(r.score)+'</span></div>'; }).join("") + '</div>';
}
function countUp(el, v){
  if (!el) return; var t0 = 0;
  (function f(ts){ if (!t0) t0 = ts; var p = Math.min(1, (ts - t0) / 700), e = 1 - Math.pow(1 - p, 3);
    el.textContent = money(v * e, true); if (p < 1) requestAnimationFrame(f); })(performance.now());
}

function dayStart(skip){
  var D = dayCtx; if (!D) return;
  rpStart(D.rep, $("daybox"), dayReveal, true);
  if (!RP) { dayReveal(); return; }

function dayReveal(){
  var D = dayCtx, el = $("day-result"); if (!el || !D) return;
  var sk = $("day-skip"); if (sk) sk.hidden = true;
  var L = ledger[ledger.length - 1], rep = D.rep, bd = [];
  if (!rep.closed && rep.queue_guests + rep.stockout_guests === 0) bd.push(['ok', t("b_clean")]);
  if (ledger.length > 2 && L.pro >= Math.max.apply(null, ledger.map(function(x){ return x.pro; })) - 1e-9) bd.push(['ok', t("b_best")]);
  if (D.prev) { var meP = D.prev.filter(function(r){ return r.me; })[0], meN = D.rows.filter(function(r){ return r.me; })[0];
    D.rows.forEach(function(r){ if (r.me) return; var p = D.prev.filter(function(x){ return x.k === r.k; })[0]; if (!p) return;
      if (meP.score < p.score && meN.score >= r.score) bd.push(['ok', t("b_over") + " " + r.name]);
      if (meP.score >= p.score && meN.score < r.score) bd.push(['bad', t("b_lost") + " " + r.name]); }); }
  var me = D.rows.filter(function(r){ return r.me; })[0], gh = ghost();
  var says = modelsHere().map(function(k){ var d = rivalData(k), w = (d["why_" + LANG] || [])[D.tday] || "";
    return w ? '<div class="s" style="border-left-color:'+(MCOLOR[k] || "var(--line)")+'"><b>'+esc(rivalName(k))+'</b><span>'+esc(w)+'</span></div>' : ""; }).join("");
  el.innerHTML = '<div class="reveal">' +
    '<section class="panel"><div class="row" style="justify-content:space-between;align-items:flex-end;gap:12px"><div><div class="eyebrow">'+esc(t("day_profit"))+'</div>' +
      '<div class="bigday" id="day-big" style="color:'+(L.pro >= 0 ? 'var(--ok)' : 'var(--bad)')+'">'+money(0, true)+'</div></div>' +
      '<div class="small muted" style="text-align:right">'+esc(t("revenue"))+' <span class="mono">'+money(L.rev)+'</span><br>'+esc(t("spent"))+' <span class="mono">'+money(-(L.buy + L.wag + L.oth), true)+'</span></div></div>' +

    '<div class="row"><button type="button" class="primary" id="day-next">'+esc(G.t >= C.days ? t("to_end") : t("to_eve") + " " + dayN(G.t))+'</button></div></div>';

/* ---------- проигрыш дня: раскладка целиком из by_dp отчёта ---------- */
var RP = null, RP_DUR = 12000;

function rpPlan(rep){
  var H = C.hours, span = H.close - H.open, toks = [], unit = Math.max(1, Math.round(rep.demand / 46)), si = 0, n2 = 0, D = [356, 158];
  rep.by_dp.forEach(function(R, dp){
    var hd = H.dayparts[dp], t0 = (hd[0] - H.open) / span, t1 = (hd[1] - H.open) / span;
    var sold = 0; Object.keys(R.sold).forEach(function(k){ sold += R.sold[k]; });
    var kinds = [["ok", sold], ["emp", Math.max(0, R.served - sold)], ["q", Math.max(0, R.demand - R.served)]];
    var ns = kinds.map(function(x){ return Math.round(x[1] / unit); }), n = ns[0] + ns[1] + ns[2];
    if (!n) return;
    var left = ns.slice();
    for (var i = 0; i < n; i++) {
      var bi = -1, bv = -1;
      for (var k2 = 0; k2 < 3; k2++) { if (!left[k2]) continue; var v = left[k2] / (n - i); if (v > bv) { bv = v; bi = k2; } }
      left[bi]--;
      var kind = kinds[bi][0], lane = ((toks.length * 37) % 5) - 2, Y = 231 + lane * 1.4, E = [338, Y], CP = [180, Y - 3], pts, fr, sit = [], dec, life;
      if (kind === "ok") { var seat = SEATS[(si++) % SEATS.length];
        // каждый третий после столика идёт к кассе второй раз: в модели это круассан к напитку
        if (R.croissant > 0 && (n2++) % 3 === 0) { pts = [D, E, CP, CP, seat, seat, CP, CP, seat, seat, E, D]; fr = [0, .05, .26, .34, .42, .56, .64, .70, .78, .90, .96, 1]; sit = [[.42, .56], [.78, .90]]; dec = .34; life = 3900; }
        else { pts = [D, E, CP, CP, seat, seat, E, D]; fr = [0, .07, .38, .50, .60, .84, .94, 1]; sit = [[.60, .84]]; dec = .50; life = 2700; } }
      else if (kind === "emp") { pts = [D, E, CP, CP, E, D]; fr = [0, .08, .45, .58, .92, 1]; dec = .52; life = 2100; }
      else { var QP = [262 + lane * 5, Y]; pts = [D, E, QP, QP, E, D]; fr = [0, .1, .40, .62, .9, 1]; dec = .62; life = 1900; }
      toks.push({t: t0 + (i + 0.5) / n * (t1 - t0), kind: kind, dp: dp, g: kinds[bi][1] / Math.max(1, ns[bi]), life: life, pts: pts, fr: fr, sit: sit, dec: dec});
    }
  });
  toks.sort(function(a, b){ return a.t - b.t; });
  // курьеры: что заказано вчера вечером и доехало сегодня утром
  var dl = lastDeliv && lastDeliv.day === rep.day ? lastDeliv : {ok: [], fail: []};
  var cour = dl.ok.map(function(s, i){ var bx = 58 + i * 26; return {s: s, t: .004 + i * .032, life: 2500, bx: bx, pts: [D, [338, 235], [bx + 12, 236], [bx + 12, 236], [338, 235], D], fr: [0, .08, .5, .62, .94, 1]}; });
  // танцор выходит в ту часть дня, где не ушёл ни один гость
  var happy = rep.by_dp.map(function(R){ var sold = 0; Object.keys(R.sold).forEach(function(k){ sold += R.sold[k]; }); return R.demand > 0 && sold >= R.demand; });
  var M = C.menu, lbg = C.suppliers.roaster.items.beans.grams, use = rep.by_dp.map(function(R){ var u = {milk: 0, beans: 0, cups: 0, cro: R.croissant || 0, sold: 0, dem: R.demand};
    Object.keys(R.sold).forEach(function(k){ var n = R.sold[k]; u.milk += n * (M[k].milk_l || 0); u.beans += n * (M[k].beans_g || 0) / lbg; u.cups += n; u.sold += n; });
    // круассаны кончаются раньше конца части дня, если их не хватило
    u.croShare = (R.croissant_missing > 0 && R.croissant + R.croissant_missing > 0) ? R.croissant / (R.croissant + R.croissant_missing) : 1;
    u.q = Math.max(0, R.demand - R.served); u.so = Math.max(0, R.served - u.sold) + (R.croissant_missing || 0); return u; });
  var end = {milk: rep.stock.milk_l + (rep.milk_written_off_l || 0), beans: rep.stock.beans_lb, cups: rep.stock.cups, cro: rep.stock.croissant}, start = {}, soldAll = 0;
  ["milk", "beans", "cups", "cro"].forEach(function(k){ start[k] = end[k] + use.reduce(function(a, u){ return a + u[k]; }, 0); });
  use.forEach(function(u){ soldAll += u.sold; });
  return {toks: toks, unit: unit, maxLife: 3900, cour: cour, fail: dl.fail, happy: happy, use: use, start: start, soldAll: soldAll};
}

function rpPose(tk, u){
  var pts = tk.pts, fr = tk.fr, p = null;
  for (var i = 1; i < pts.length; i++) if (u <= fr[i]) { var a = (u - fr[i-1]) / Math.max(1e-9, fr[i] - fr[i-1]);
    p = {x: pts[i-1][0] + (pts[i][0] - pts[i-1][0]) * a, y: pts[i-1][1] + (pts[i][1] - pts[i-1][1]) * a}; break; }
  if (!p) { var l = pts[pts.length - 1]; p = {x: l[0], y: l[1]}; }
  (tk.sit || []).forEach(function(r){ if (u > r[0] && u <= r[1]) p.sit = true; });
  if (u > .93) p.op = Math.max(0, 1 - (u - .93) * 12);
  return p;
}

function rpStart(rep, box, onDone, bare){
  rep = rep || (draft && draft.obs ? draft.obs.yesterday : null);
  rpStop();
  if (!rep || !rep.by_dp || !rep.by_dp.length) return;
  box = box || document.querySelector(".windowbox");
  if (!box) return;
  var pl = rpPlan(rep);
  box.innerHTML = rpScene(rep, pl) + rpBar(pl, bare);
  RP = {rep: rep, pl: pl, t0: 0, dp: -1, c: [0, 0, 0, 0], onDone: onDone || null,
    els: [].slice.call(box.querySelectorAll(".rpP")), staff: [].slice.call(box.querySelectorAll(".rpS")),
    nums: [].slice.call(box.querySelectorAll(".rpbar .c b")), clock: box.querySelector(".clock"),
    prog: box.querySelector(".rprog i"), dpn: box.querySelector(".rpN"),
    rev: box.querySelector(".hrev"), pen: box.querySelector(".hpen"), prob: box.querySelector(".hprob"), probS: "",
    hs: [].slice.call(box.querySelectorAll(".hs")),
    cour: [].slice.call(box.querySelectorAll(".rpC")), boxes: [].slice.call(box.querySelectorAll(".rpB")), dancer: box.querySelector(".rpD")};
  RP.snd = !!onDone && !FAST;
  if (RP.snd) { sfx("bell"); ambOn(); }
  // для проверки кадра без анимации: ?rpf=0.4 ставит сцену на 40 % дня и замирает
  var dbg = /[?&]rpf=([0-9.]+)/.exec(location.search);
  if (dbg) { RP.t0 = 1; rpFrame(1 + (+dbg[1]) * RP_DUR); if (RP && RP.raf) cancelAnimationFrame(RP.raf); return; }
  RP.raf = requestAnimationFrame(rpFrame);
  RP.timer = setTimeout(rpFinish, RP_DUR + pl.maxLife + 1500);   // страховка, если кадры не идут
}

function rpStop(){ ambOff(); if (RP) { if (RP.raf) cancelAnimationFrame(RP.raf); if (RP.timer) clearTimeout(RP.timer); } RP = null; }

function rpFrame(ts){
  if (!RP) return;
  if (!RP.t0) RP.t0 = ts;
  var el = (ts - RP.t0), p = Math.min(1, el / RP_DUR), pl = RP.pl, H = C.hours;
  // часы и полоса
  var hh = H.open + p * (H.close - H.open), mm = Math.floor((hh % 1) * 60);
  RP.clock.textContent = Math.floor(hh) + ":" + (mm < 10 ? "0" : "") + mm;
  RP.prog.style.width = (p * 100).toFixed(1) + "%";
  // смена текущей части дня
  var dp = Math.min(2, Math.floor(p * 3 - 1e-9));
  if (dp < 0) dp = 0;
  if (dp !== RP.dp) { RP.dp = dp;
    RP.staff.forEach(function(g, i){ g.style.display = i === dp ? "" : "none"; });
    RP.dpn.textContent = t(["morning", "midday", "evening_dp"][dp]);
    if (RP.dancer) RP.dancer.style.display = pl.happy[dp] ? "" : "none";
    if (RP.snd) sfx("steam"); }
  // курьеры: приносят заказ утром и ставят на поддон
  for (var ci = 0; ci < pl.cour.length; ci++) {
    var ck = pl.cour[ci], cg = RP.cour[ci], cu = (el - ck.t * RP_DUR) / ck.life;
    if (cu >= .56 && !ck.dn) { ck.dn = 1; RP.boxes[ci].style.display = ""; if (RP.snd) sfx("thud"); }
    if (cu < 0 || cu > 1) { if (cg.style.display !== "none") cg.style.display = "none"; continue; }
    var cp = rpPose(ck, cu);
    cg.style.display = ""; cg.setAttribute("class", cu >= .56 ? "rpC drop" : "rpC");
    cg.setAttribute("transform", "translate(" + cp.x.toFixed(1) + "," + cp.y.toFixed(1) + ")");
    if (cp.op != null) cg.setAttribute("opacity", cp.op.toFixed(2)); else cg.removeAttribute("opacity");
  }
  // гости
  for (var i = 0; i < pl.toks.length; i++) {
    var tk = pl.toks[i], g = RP.els[i], u = (el - tk.t * RP_DUR) / tk.life;
    if (u < 0 || u > 1) { if (g.style.display !== "none") g.style.display = "none"; continue; }
    if (!tk.sp) { tk.sp = 1; RP.c[0] += tk.g; }
    if (u >= tk.dec && !tk.dn) { tk.dn = 1; RP.c[tk.kind === "ok" ? 1 : tk.kind === "q" ? 2 : 3] += tk.g;
      if (RP.snd) sfx(tk.kind === "ok" ? "serve" : tk.kind === "q" ? "queue" : "empty"); }
    var ps = rpPose(tk, u);
    g.style.display = "";
    g.setAttribute("class", "rpP" + (ps.sit ? " sit" : "") + (tk.dn ? " dec" : ""));
    g.setAttribute("transform", "translate(" + ps.x.toFixed(1) + "," + ps.y.toFixed(1) + ")");
    if (ps.op != null) g.setAttribute("opacity", ps.op.toFixed(2)); else g.removeAttribute("opacity");
  }
  rpHud(p);
  if (el < RP_DUR + pl.maxLife) { RP.raf = requestAnimationFrame(rpFrame); return; }
  rpFinish();
}
/* панель под сценой на долю дня p. Итоги дня в ней точные (из отчёта шага), а ход внутри
   части дня равномерный: поминутной раскладки в модели нет. */
function rpHud(p){
  var pl = RP.pl, rep = RP.rep, cum = {milk: 0, beans: 0, cups: 0, cro: 0, sold: 0, dem: 0}, chips = [], nm = ["morning", "midday", "evening_dp"], qAll = 0, soAll = 0;
  pl.use.forEach(function(u, d){ var f = Math.max(0, Math.min(1, (p - d / 3) * 3)); if (f <= 0) return;
    cum.dem += u.dem * f; cum.milk += u.milk * f; cum.beans += u.beans * f; cum.cups += u.cups * f; cum.sold += u.sold * f; cum.cro += u.cro * Math.min(1, f / Math.max(.05, u.croShare));
    var q = Math.round(u.q * f), so = Math.round(u.so * f); qAll += q; soAll += so;
    if (q) chips.push(['bad', t(nm[d]) + ": " + t("queue") + " " + q]);
    if (so) chips.push(['warn', t(nm[d]) + ": " + t("stockout") + " " + so]); });
  RP.rev.textContent = money(pl.soldAll ? rep.revenue * cum.sold / pl.soldAll : 0);
  // нижняя строка из того же расчёта, что и панель: иначе одно и то же число расходится
  [cum.dem, cum.sold, qAll, soAll].forEach(function(v, j){ RP.nums[j].textContent = num(Math.round(v)); });
  RP.pen.textContent = money(-(qAll * C.penalty_queue + soAll * C.penalty_stockout));
  RP.hs.forEach(function(el){ var k = el.dataset.k, st = pl.start[k], now = Math.max(0, st - cum[k]), fr = st > 0 ? now / st : 0;
    el.className = "hs" + (now < .5 ? " out" : fr < .15 ? " low" : "");
    el.querySelector(".v").textContent = now < .5 ? t("hud_out") : num(Math.round(now));
    el.querySelector(".bar i").style.width = (fr * 100).toFixed(1) + "%"; });
  pl.fail.forEach(function(x){ chips.unshift(['bad', t("no_deliv_h") + ": " + (T[LANG].sup[x] || x)]); });
  if (rep.events.indexOf("no_espresso") >= 0) chips.unshift(['bad', LANG==="ru"?"машина не работает":"machine down"]);
  var s = chips.length ? chips.map(function(c){ return '<span class="pill '+c[0]+'">'+esc(c[1])+'</span>'; }).join("") : '<span class="pill ok">'+esc(t("hud_ok"))+'</span>';
  if (s !== RP.probS) { RP.probS = s; RP.prob.innerHTML = s; }
}
/* конец проигрыша. Вызывается и из кадра, и напрямую: в фоновой вкладке кадры не
   приходят, и без прямого вызова день не закончился бы никогда. */
function rpFinish(){
  if (!RP || RP.fin) return;
  RP.fin = true; ambOff();
  if (RP.raf) cancelAnimationFrame(RP.raf);
  if (RP.timer) clearTimeout(RP.timer);
  var H = C.hours;
  RP.clock.textContent = H.close + ":00"; RP.prog.style.width = "100%";
  RP.staff.forEach(function(g, i){ g.style.display = i === 2 ? "" : "none"; });
  RP.dpn.textContent = t("evening_dp");
  rpHud(1);
  RP.rev.textContent = money(RP.rep.revenue);
  RP.pen.textContent = money(-(RP.rep.queue_guests * C.penalty_queue + RP.rep.stockout_guests * C.penalty_stockout));
  RP.cour.forEach(function(g){ g.style.display = "none"; }); RP.boxes.forEach(function(g){ g.style.display = ""; });
  if (RP.dancer) RP.dancer.style.display = RP.pl.happy[2] ? "" : "none";
  if (!RP.rep.closed && RP.rep.queue_guests + RP.rep.stockout_guests === 0) RP.staff[2].setAttribute("class", "rpS hop");
  // точные числа отчёта, а не сумма округлений
  var rep = RP.rep, sold = 0;
  rep.by_dp.forEach(function(R){ Object.keys(R.sold).forEach(function(k2){ sold += R.sold[k2]; }); });
  [rep.demand, sold, rep.queue_guests, rep.stockout_guests].forEach(function(v, j){ RP.nums[j].textContent = num(v); });
  RP.els.forEach(function(g){ g.style.display = "none"; });
  RP.raf = 0;
  var pb = document.getElementById("rp-play"), cb = document.getElementById("rp-close");
  if (pb) pb.hidden = false;
  if (cb) cb.textContent = t("rp_close");
  if (RP.onDone) { var fn = RP.onDone; RP.onDone = null; fn(); }
}

function chartSVG(lines){
  var W = 640, H = 240, L = 58, R = 12, Tp = 12, B = 30, all = [], base = [];
  lines.forEach(function(l){ all = all.concat(l.data); if (l.base) base = base.concat(l.data); });
  // линия, которая уходит втрое ниже остальных, не задаёт масштаб: иначе остальные
  // слипаются в одну черту. Такая линия упирается в нижний край и подписана числом.
  var loAll = Math.min.apply(null, all.concat([0])), loBase = base.length ? Math.min.apply(null, base.concat([0])) : loAll;
  var clip = base.length && loAll < loBase * 3 - 1;
  if (clip) { all = base.concat(lines.filter(function(l){ return !l.base && Math.min.apply(null, l.data) >= loBase * 3 - 1; }).reduce(function(a, l){ return a.concat(l.data); }, [])); }
  var lo = Math.min.apply(null, all.concat([0])), hi = Math.max.apply(null, all.concat([0])), step = niceStep((hi - lo) / 4);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  var x = function(i){ return L + (W - L - R) * i / 29; }, y = function(v){ return Tp + (H - Tp - B) * (hi - v) / (hi - lo); };
  var s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(t("chart_h"))+'">';
  for (var v = lo; v <= hi + 1e-9; v += step) s += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--mono)">'+money(v)+'</text>';
  s += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="var(--muted)" stroke-width="1"/>';
  [1,10,20,30].forEach(function(d){ s += '<text x="'+x(d-1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--mono)">'+d+'</text>'; });
  var yc = function(v){ return Math.max(Tp, Math.min(H - B, y(v))); };
  lines.forEach(function(l){ var out = Math.min.apply(null, l.data) < lo - 1e-9;
    s += '<polyline fill="none" stroke="'+l.color+'" stroke-width="'+(l.w||2)+'"'+(l.dash || out ? ' stroke-dasharray="4 4"' : '')+' points="'+l.data.map(function(v,i){ return x(i).toFixed(1)+','+yc(v).toFixed(1); }).join(" ")+'"/>' +
      '<circle cx="'+x(l.data.length-1)+'" cy="'+yc(l.data[l.data.length-1])+'" r="3.5" fill="'+l.color+'"/>' +
      (out ? '<text x="'+(x(l.data.length-1)-6)+'" y="'+(yc(l.data[l.data.length-1])-7)+'" text-anchor="end" font-size="11" font-family="var(--mono)" fill="'+l.color+'">'+money(l.data[l.data.length-1])+'</text>' : ''); });
  return s + '</svg>';
}

  try { DB.collection("scores").onSnapshot(function(snap){ dbState = "on"; rows = snap.docs.map(function(d){ return {id: d.id, data: d.data()}; }); if (screen === "board") renderBoard(); }, function(){ dbState = "off"; if (screen === "board") renderBoard(); }); } catch (e) { dbState = "off"; }
})();
async function offerSave(){
  if (!DB || !USER || screen !== "end") return;
  var me; try { me = await USER.id(); } catch (e) { return; } if (!me) return;
  var b = $("save"); if (!b) return; b.hidden = false;
  var ag = $("again"); if (ag) ag.classList.remove("primary");
  b.onclick = async function(){
    b.disabled = true; var was = b.textContent; b.textContent = t("saving");
    try {
      var sc = G.score().score, gh = ghost().score, ref = DB.collection("scores").doc(me), cur = await ref.get(), data = cur.exists ? cur.data() : {best: {}};
      var best = data.best || {}, prev = best[key()];
      if (!prev || sc > prev.score) best[key()] = {score: sc, extella: gh, beat: sc > gh, seed: DATA.seed, at: new Date().toISOString(), log: DLOG};
      await ref.set({best: best}); saveState = t("saved"); $("savemsg").textContent = saveState; b.hidden = true;
    } catch (e) { $("savemsg").textContent = t("save_fail"); }
    finally { b.disabled = false; b.textContent = was; }
  };
}
async function renderBoard(){
  var el = $("board"); if (!el) return;
  var h = '<section class="stack"><h1>'+esc(t("board_h"))+'</h1>';
  if (dbState === "loading") { el.innerHTML = h + '<p class="muted">'+esc(t("loading"))+'</p></section>'; return; }
  if (!DB || dbState === "off" || !rows) { el.innerHTML = h + '<p class="muted">'+esc(t("board_off"))+'</p><button type="button" id="home2">'+esc(t("other"))+'</button></section>'; return; }
  var prof = {}; try { if (rows.length && USER) prof = await USER.profiles(rows.map(function(r){ return r.id; })); } catch (e) {}
  if (!rows.length) h += '<p class="muted">'+esc(t("board_empty"))+'</p>';
  Object.keys(DATA.ghosts).forEach(function(k){
    var list = rows.filter(function(r){ return r.data.best && r.data.best[k]; }).map(function(r){ return {id: r.id, b: r.data.best[k]}; }).sort(function(a,b){ return b.b.score - a.b.score; });
    if (!list.length) return; var p = k.split("_");
    h += '<h2>'+esc(t("sc_"+p[0]))+' · '+esc(t("st_"+p[1]))+' · '+esc(t("mo_"+p[2]))+'</h2><div class="tbl"><table><thead><tr><th>'+esc(t("name"))+'</th><th class="n">'+esc(t("best"))+'</th><th class="n">Extella</th><th>'+esc(t("vs"))+'</th></tr></thead><tbody>' +
      list.map(function(r){ var nm = (prof[r.id] && prof[r.id].name) || t("someone"); return '<tr><td>'+esc(nm)+'</td><td class="n mono">'+money(r.b.score)+'</td><td class="n mono">'+money(r.b.extella)+'</td><td>'+(r.b.beat?'<span class="pill ok">'+esc(t("beat"))+'</span>':'<span class="muted">'+esc(t("nobeat"))+'</span>')+'</td></tr>'; }).join("") + '</tbody></table></div>';
  });
  el.innerHTML = h + '<p class="note">'+esc(t("verify"))+'</p><button type="button" id="home2">'+esc(t("other"))+'</button></section>';
}

/* ---------- события ---------- */
function startGame(){ G = new S.Game(DATA.seed, pick.st, pick.mo, pick.sc, C); DLOG = []; hist = []; ledger = []; levels = {dairy:"normal", roaster:"normal", bakery:"normal"}; lastDay = null; dpView = 0; draft = newDraft(); screen = "play"; render(); window.scrollTo(0, 0); }
document.addEventListener("click", function(e){
  var b = e.target.closest("button"); if (!b) return;
  if (b.id === "snd") { SND.on = !SND.on; try { localStorage.setItem("cafe_snd", SND.on ? "1" : "0"); } catch (x0) {} if (SND.on) { sndInit(); sfx("click"); } else ambOff(); b.setAttribute("aria-pressed", SND.on); return; }
  sndInit(); if (b.id !== "close-ev" && b.id !== "day-next") sfx("click");
  if (b.id === "lang-ru" || b.id === "lang-en") { LANG = b.id.slice(5); try { localStorage.setItem(SITE ? "robot_lang" : "cafe_lang", LANG); } catch (x) {} render(); return; }
  if (b.id === "th-light" || b.id === "th-dark") { var v = b.id.slice(3), cur = document.documentElement.getAttribute("data-theme"); if (cur === v) { document.documentElement.removeAttribute("data-theme"); v = ""; } else document.documentElement.setAttribute("data-theme", v); try { if (v) localStorage.setItem("cafe_theme", v); else localStorage.removeItem("cafe_theme"); } catch (x) {} render(); return; }
  if (b.id === "home" || b.id === "other" || b.id === "home2") { screen = "start"; render(); return; }
  if (b.id === "go" || b.id === "again") { startGame(); return; }
  if (b.id === "go-lessons") { screen = "lesson"; lessonN = 0; lessonState = {}; render(); return; }
  if (b.id === "go-board") { screen = "board"; render(); return; }
  if (screen === "start" && b.dataset.pick) { var pp = b.dataset.pick.split(":"); pick[pp[0]] = pp[1]; try { localStorage.setItem("cafe_pick", JSON.stringify(pick)); } catch (x) {} render(); return; }
  if (screen === "lesson") { if (b.id === "l-next") { lessonN++; render(); window.scrollTo(0,0); return; } if (b.id === "l-play") { startGame(); return; } lessonClick(e); return; }
  if (screen === "day") {
    if (b.id === "day-skip") { rpFinish(); return; }
    if (b.id === "day-fast") { FAST = !FAST; try { localStorage.setItem("cafe_fast", FAST ? "1" : "0"); } catch (e2) {} b.setAttribute("aria-pressed", FAST); if (FAST) rpFinish(); return; }
    if (b.id === "day-next") { screen = G.t >= C.days ? "end" : "play"; render(); window.scrollTo(0, 0);
      if (screen === "end") sfx(standings(C.days, G.score().score)[0].me ? "win" : "end"); else sfx("click"); return; }
    return;
  }
  if (screen !== "play") return;
  if (b.id === "rp-play") { rpStart(); return; }
  if (b.id === "rp-close") { var sy = window.scrollY; rpStop(); render(); window.scrollTo(0, sy); return; }
  if (b.id === "close-ev") { closeEvening(); return; }
  if (b.id === "show-rej") { var r0 = document.querySelector("#main section .rej"); if (r0) r0.scrollIntoView({block: "center"}); return; }
  var y = window.scrollY;
  if (b.dataset.dp) dpView = +b.dataset.dp;
  else if (b.dataset.card) { var c = b.dataset.card, i = c.lastIndexOf(":"); draft.choices[c.slice(0, i)] = c.slice(i + 1); }
  else if (b.dataset.lv) { var l = b.dataset.lv.split(":"); levels[l[0]] = l[1]; draft.qty[l[0]] = suggest(draft.obs, l[0], l[1]); }
  else if (b.dataset.st) { var s = b.dataset.st.split(":"), k = s[0], dv = +s[1];
    if (k[0] === "b" && k.length === 2) draft.sched[+k[1]] = Math.max(0, Math.min(6, draft.sched[+k[1]] + dv));
    else if (k[0] === "l" && k.length === 2) draft.leads[+k[1]] = Math.max(0, Math.min(1, draft.leads[+k[1]] + dv));
    else if (k === "hire") draft.hire = Math.max(0, Math.min(3, draft.hire + dv));
    else if (k === "fire") draft.fire = Math.max(0, draft.fire + dv); }
  else if (b.dataset.pr) { var q = b.dataset.pr.split(":"); draft.prices[q[0]] = Math.round((draft.prices[q[0]] + 0.25 * (+q[1])) * 100) / 100; }
  else if (b.dataset.disc) { draft.disc = +b.dataset.disc; if (draft.disc && !draft.dparts.length) draft.dparts = [2]; }
  else if (b.dataset.dp2) { var dpn = +b.dataset.dp2, ix2 = draft.dparts.indexOf(dpn);
    if (ix2 >= 0) { if (draft.dparts.length > 1) draft.dparts.splice(ix2, 1); } else draft.dparts.push(dpn); }
  else if (b.dataset.buy) { var kb = b.dataset.buy, ix = draft.buy.indexOf(kb); if (ix >= 0) draft.buy.splice(ix, 1); else draft.buy.push(kb); }
  else return;
  render(); window.scrollTo(0, y);
});
document.addEventListener("input", function(e){
  var el = e.target; if (screen !== "play" || !el.dataset || !el.dataset.q || !draft) return;
  var p0 = el.dataset.q.split(":"), v0 = parseInt(el.value, 10); draft.qty[p0[0]][p0[1]] = isNaN(v0) || v0 < 0 ? 0 : v0;
  refreshNeeds();
});
document.addEventListener("change", function(e){
  var el = e.target; if (screen !== "play" || !el.dataset || !el.dataset.q) return;
  var p = el.dataset.q.split(":"), v = parseInt(el.value, 10); draft.qty[p[0]][p[1]] = isNaN(v) || v < 0 ? 0 : v;
  var y = window.scrollY, id = el.id; render(); window.scrollTo(0, y); var n = $(id); if (n) n.focus();
});
document.addEventListener("toggle", function(e){ if (!e.target) return;
  if (e.target.id === "more") moreOpen = e.target.open;
  if (e.target.id === "daylog") logOpen = e.target.open;
  if (e.target.id === "ec-cards") ecOpen.cards = e.target.open;
  if (e.target.id === "ec-orders") ecOpen.orders = e.target.open;
  if (e.target.id === "ec-staff") ecOpen.staff = e.target.open; }, true);
render();
})();
</script>
