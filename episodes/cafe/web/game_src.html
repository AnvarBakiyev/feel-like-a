<title>Месяц кофейни</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one evening = one column of the owner's notebook: window on the shop, then tomorrow, then decisions, then one button to close the evening */
:root{
  --bg:#eceeea; --panel:#ffffff; --fg:#1d1a17; --muted:#615a53; --line:#d5d9d3;
  --espresso:#4a2f22; --awning:#1f6f68; --awning-soft:#dcefec;
  --ghost:#6d4bb0; --ghost-soft:#ece6f7; --ok:#22744a; --ok-soft:#e0f1e6; --bad:#b03a2e; --bad-soft:#f7e1de; --warn:#94600a; --warn-soft:#f8eed8;
  --wall:#e6e0d6; --floor:#cbbba8; --wood:#97663f; --milk:#fbfbf6; --sky:#cfe0ea; --skin:#c99a74; --guest:#6b7f8e; --wall2:#d6cdbf; --floor2:#b09c85; --wood2:#74492a; --wood3:#bd8a55;
  --display:"Bricolage Grotesque","Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
  --sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121514; --panel:#1b1f1e; --fg:#ebe7e2; --muted:#a39b93; --line:#2d3331;
  --espresso:#e2c3ad; --awning:#5cc0b5; --awning-soft:#16302d;
  --ghost:#b39ae8; --ghost-soft:#261f37; --ok:#6fcf98; --ok-soft:#15301f; --bad:#f0897c; --bad-soft:#3a1d19; --warn:#e9b54a; --warn-soft:#352812;
  --wall:#262421; --floor:#3b332c; --wood:#7a5338; --milk:#dcdcd3; --sky:#1d2a33; --skin:#b48660; --guest:#8fa3b2; --wall2:#312d29; --floor2:#4d4238; --wood2:#573a26; --wood3:#9a6c4c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121514; --panel:#1b1f1e; --fg:#ebe7e2; --muted:#a39b93; --line:#2d3331;
  --espresso:#e2c3ad; --awning:#5cc0b5; --awning-soft:#16302d;
  --ghost:#b39ae8; --ghost-soft:#261f37; --ok:#6fcf98; --ok-soft:#15301f; --bad:#f0897c; --bad-soft:#3a1d19; --warn:#e9b54a; --warn-soft:#352812;
  --wall:#262421; --floor:#3b332c; --wood:#7a5338; --milk:#dcdcd3; --sky:#1d2a33; --skin:#b48660; --guest:#8fa3b2; --wall2:#312d29; --floor2:#4d4238; --wood2:#573a26; --wood3:#9a6c4c; color-scheme:dark}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding-block:18px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header.top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.brand{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.01em;color:var(--espresso);background:none;border:0;padding:0;cursor:pointer}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,7vw,54px);line-height:.98;margin:0;letter-spacing:-.02em;color:var(--espresso);text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.15;margin:0;text-wrap:balance}
h3{font-size:16px;margin:0;font-weight:700}
p{margin:0;max-width:66ch}
.muted{color:var(--muted)} .small{font-size:14px} .note{font-size:13.5px;color:var(--muted)}
.mono,.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.eyebrow{font-size:13px;color:var(--muted);font-weight:700}
button,.btn{font:inherit;font-size:15px;padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;min-height:36px}
button:hover{border-color:var(--muted)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--awning);outline-offset:2px}
button.primary{background:var(--awning);border-color:var(--awning);color:var(--panel);font-weight:700}
button.on,button[aria-pressed="true"]{border-color:var(--awning);background:var(--awning-soft);font-weight:600}
button.link{border:0;background:none;padding:0;min-height:0;color:var(--awning);text-decoration:underline;text-underline-offset:3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:32px;padding:5px 10px;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
input[type=number]{font:inherit;font-family:var(--mono);width:5.2em;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)}
select{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)}
.step{display:inline-flex;align-items:center;gap:4px}
.step button{min-width:34px;padding:4px 0;font-family:var(--mono)}
.step .v{min-width:2.2em;text-align:center;font-family:var(--mono);font-weight:600}
.rej{border-left:3px solid var(--bad);background:var(--bad-soft);padding:6px 10px;border-radius:0 6px 6px 0;font-size:14.5px}
.okmsg{border-left:3px solid var(--ok);background:var(--ok-soft);padding:6px 10px;border-radius:0 6px 6px 0;font-size:14.5px}
.warnmsg{border-left:3px solid var(--warn);background:var(--warn-soft);padding:6px 10px;border-radius:0 6px 6px 0;font-size:14.5px}
.ghostbox{border-left:3px solid var(--ghost);background:var(--ghost-soft);padding:8px 12px;border-radius:0 8px 8px 0}
.pill{display:inline-block;font-size:12.5px;font-weight:700;padding:1px 8px;border-radius:99px;border:1px solid currentColor}
.pill.ok{color:var(--ok)} .pill.bad{color:var(--bad)} .pill.warn{color:var(--warn)} .pill.ghost{color:var(--ghost)} .pill.mut{color:var(--muted)}
.statbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
.stat .k{font-size:13px;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat.ghost{border-color:var(--ghost)} .stat.ghost .v{color:var(--ghost)}
.tbl{overflow-x:auto} table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap}
.windowbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.windowbox svg{display:block;width:100%;height:auto}
.windowbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.rprog{height:4px;background:var(--line);position:relative}
.rprog i{position:absolute;left:0;top:0;bottom:0;background:var(--espresso);width:0}
.rpbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 12px}
.rpbar .clock{font-family:var(--mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.rpbar .c{font-size:12px;color:var(--muted);font-weight:600}
.rpbar .c b{font-family:var(--mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--fg)}
.rpbar .c.q b{color:var(--bad)}
.rpbar .sp{flex:1 1 auto}
.fc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fc .d{border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0}
.fc .d.tom{border-color:var(--awning);background:var(--awning-soft)}
.fc .d{display:grid;gap:2px}
.fc .n{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.fc .nt{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:2px}
@media (max-width:620px){
  .fc{grid-template-columns:minmax(0,1fr);gap:6px}
  .fc .d{grid-template-columns:minmax(0,1fr) auto;gap:1px 12px;align-items:center;padding:8px 10px}
  .fc .hd{grid-column:1;grid-row:1}
  .fc .rg{grid-column:1;grid-row:2}
  .fc .n{grid-column:2;grid-row:1/3;text-align:right;font-size:22px}
  .fc .nt{grid-column:1/-1;grid-row:3}
}
.card{border:1px solid var(--warn);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.card .opts{display:flex;flex-wrap:wrap;gap:6px}
.supp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding-block:8px;border-bottom:1px dashed var(--line)}
.supp:last-child{border-bottom:0}
.qtys{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;grid-column:1/-1}
.qtys label{display:inline-flex;gap:6px;align-items:center;font-size:14.5px}
.nl{flex:1 0 100%;display:flex;flex-wrap:wrap;gap:3px 10px;align-items:center;margin:-2px 0 2px}
.nl .bar{position:relative;display:block;flex:0 0 110px;height:8px;border-radius:3px;background:var(--line);overflow:hidden}
.nl .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.nl .bar u{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);opacity:.7}
.nl .t{font-size:12px;color:var(--muted)}
.nl .t b{color:var(--fg);font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.nl .t.ok b,.nl .t.ok{color:var(--ok)}
.nl .t.bad b,.nl .t.bad{color:var(--bad)}
.dp3{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:6px 10px;align-items:center}
.closebar{position:sticky;bottom:0;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;z-index:5}
.combo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.opt{display:flex;flex-direction:column;gap:6px}
.lesson{display:flex;flex-direction:column;gap:12px}
.chart svg{display:block;width:100%;height:auto}
details>summary{cursor:pointer;font-weight:700;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"+ ";font-family:var(--mono);color:var(--awning)}
details[open]>summary::before{content:"− "}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .35s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}}

/* --- доработка интерфейса: шапка-дуэль, две колонки, полосы --- */
#main{display:flex;flex-direction:column;gap:14px}
.wrap.wide{max-width:1180px}
.cols{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
.cols>div{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:1040px){.cols{grid-template-columns:minmax(0,420px) minmax(0,1fr)}
  .cols>.colL{position:sticky;top:12px}}
.hero{display:grid;grid-template-columns:1fr;gap:16px;align-items:center}
@media (min-width:760px){.hero{grid-template-columns:.8fr 1.2fr}}
.duel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px 12px;align-items:center}
.duel .k{font-size:13px;color:var(--muted);font-weight:600}
.duel .v{font-family:var(--mono);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.duel .r{text-align:right}
.duel .r .v{color:var(--ghost)}
.duel .gap{font-family:var(--display);font-weight:800;font-size:14px;padding:3px 12px;border-radius:99px;white-space:nowrap}
.duel .gap.ok{background:var(--ok-soft);color:var(--ok)}
.duel .gap.bad{background:var(--ghost-soft);color:var(--ghost)}
.duel .gap.mut{background:var(--bg);color:var(--muted)}
.duel .bar{grid-column:1/-1;height:7px;border-radius:99px;background:var(--line);position:relative}
.duel .bar i{position:absolute;top:0;bottom:0;border-radius:99px}
.duel .bar b{position:absolute;top:-3px;bottom:-3px;left:calc(50% - 1px);width:2px;background:var(--muted);opacity:.6}
.track{display:flex;gap:2px;align-items:flex-end;height:14px;grid-column:1/-1}
.track i{flex:1 1 0;height:6px;border-radius:2px;background:var(--line)}
.track i.win{background:var(--ok)}
.track i.lose{background:var(--ghost)}
.track i.now{height:14px;background:var(--espresso)}
.hud{padding:10px 12px 2px;display:flex;flex-direction:column;gap:8px}
.hudtop{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline}
.hud .clock{font-family:var(--mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.hm small{font-size:11.5px;color:var(--muted);font-weight:600;margin-right:6px}
.hm b{font-family:var(--mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.hm.ok b{color:var(--ok)}
.hm.bad b{color:var(--bad)}
.hstock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 12px}
.hs{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 6px;font-size:11.5px;align-items:baseline}
.hs .k{color:var(--muted);font-weight:600}
.hs .v{font-family:var(--mono);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.hs .bar{grid-column:1/-1;height:7px;border-radius:99px;background:var(--line);overflow:hidden;position:relative;display:block}
.hs .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--awning)}
.hs.low .bar i{background:var(--warn)}
.hs.out .bar i{background:var(--bad)}
.hs.out .v{color:var(--bad)}
.hprob{display:flex;flex-wrap:wrap;gap:5px;min-height:24px;align-items:center}
@media (max-width:560px){.hstock{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sit .lg{display:none}
.rpP .mk{display:none}
.rpP.dec .mk{display:inline}
.rpC.drop .bx{display:none}
.dance{animation:dance .46s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes dance{from{transform:rotate(-9deg)}to{transform:rotate(9deg) translateY(-3px)}}
.nts text{animation:fl 1.6s linear infinite}
.nts text:nth-child(2){animation-delay:.8s}
@keyframes fl{from{opacity:.9;transform:translateY(0)}to{opacity:0;transform:translateY(-14px)}}
.rpS.hop{animation:hop .42s ease-in-out infinite alternate}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.dance,.nts text,.rpS.hop{animation:none}}
.steam path{animation:steam 2.6s ease-in-out infinite;opacity:0}
.steam path:nth-child(2){animation-delay:.9s}
.steam path:nth-child(3){animation-delay:1.7s}
@keyframes steam{0%{opacity:0;transform:translateY(3px)}40%{opacity:.6}100%{opacity:0;transform:translateY(-7px)}}
.rain line{animation:rain .6s linear infinite}
@keyframes rain{from{transform:translate(3px,-9px)}to{transform:translate(-3px,9px)}}
.snow circle{animation:snow 4s linear infinite}
@keyframes snow{from{transform:translateY(-12px)}to{transform:translateY(70px)}}
@media (prefers-reduced-motion:reduce){.steam path{animation:none;opacity:.4}.rain line,.snow circle{animation:none}}
.ecard{padding:0}
.ecard>details>summary{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:12px 14px;cursor:pointer;list-style:none}
.ecard summary::-webkit-details-marker{display:none}
.ecard>details>summary::before,.ecard>details[open]>summary::before{content:none}
.ecard .et{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.15}
.ecard .et::before{content:"\25B8";color:var(--muted);margin-right:6px;font-size:14px}
.ecard details[open] .et::before{content:"\25BE"}
.ecard .es{grid-column:1;font-size:13.5px;font-weight:400;color:var(--muted);min-width:0;line-height:1.35}
.ecard summary .pill{grid-column:2;grid-row:1/3;align-self:center;white-space:nowrap}
.ecard .eb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.daystage{display:flex;flex-direction:column;gap:14px;max-width:760px;margin:0 auto;width:100%}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.dayhead h1{margin:0}
.reveal{display:flex;flex-direction:column;gap:14px;animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.bigday{font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,48px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.race{display:grid;gap:7px}
.duel .race{grid-column:1/-1}
.lane{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.lane .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane .nm small{font-family:var(--mono);color:var(--muted);font-weight:600;margin-right:4px}
.lane .tr{position:relative;height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.lane .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.lane .sc{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.lane.me .nm{color:var(--espresso)}
.says{display:grid;gap:10px}
.says .s{border-left:3px solid var(--line);padding:1px 0 1px 10px}
.says .s b{display:block;font-size:13px}
.says .s span{font-size:13.5px;color:var(--muted);line-height:1.4}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
@media (prefers-reduced-motion:reduce){.reveal{animation:none}.lane .tr i{transition:none}}
@media (max-width:560px){.lane{grid-template-columns:minmax(0,92px) minmax(0,1fr) auto;gap:8px;font-size:12px}}
.stand{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.stand .ch{display:inline-flex;gap:5px;align-items:center;font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 9px;white-space:nowrap}
.stand .ch b{font-family:var(--mono);font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}
.stand .ch.me{background:var(--espresso);border-color:var(--espresso);color:var(--panel)}
.stand .ch.me b{color:var(--panel)}
.stand .ch.ext b{color:var(--ghost)}
.who{display:grid;gap:10px}
.who .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline}
.who .r .n{font-weight:700}
.who .r .s{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.who .r .d{grid-column:1/-1;font-size:13px;color:var(--muted);line-height:1.35}
.who .r.me .n{color:var(--espresso)}
.cell{display:block;min-width:0}
.capbar{position:relative;display:block;max-width:150px;height:9px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:3px}
.capbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.capbar u{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);opacity:.75}
.supp.off{opacity:.5}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(76px,1fr));gap:6px 10px;padding:0 12px 10px}
.mini>div{min-width:0}
.mini .k{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.2}
.mini .v{font-family:var(--mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.dayres{border-left-width:4px;border-left-style:solid}

  var base = rows.filter(function(r){ return r.me || r.k === "extella"; }).map(function(r){ return r.score; });

  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), span = Math.max(1, hi - lo);
  var w = function(v){ return v < lo ? 3 : Math.max(3, Math.min(100, 8 + 92 * (v - lo) / span)); };
  return '<div class="race">' + order.filter(function(k){ return byK[k]; }).map(function(k){ var r = byK[k], out = r.score < lo;
    var col = r.me ? "var(--awning)" : (MCOLOR[k] || "var(--muted)"), w1 = w(r.score), w0 = byP[k] ? w(byP[k].score) : w1;

      '<span class="sc"'+(out ? ' style="color:var(--bad)"' : '')+'>'+money(r.score)+'</span></div>'; }).join("") + '</div>';

function countUp(el, v){

/* ---------- проигрыш дня: раскладка целиком из by_dp отчёта ---------- */
var RP = null, RP_DUR = 12000;

function rpPlan(rep){
  var H = C.hours, span = H.close - H.open, toks = [], unit = Math.max(1, Math.round(rep.demand / 46)), si = 0, n2 = 0, D = [356, 158];
  rep.by_dp.forEach(function(R, dp){
    var hd = H.dayparts[dp], t0 = (hd[0] - H.open) / span, t1 = (hd[1] - H.open) / span;
    var sold = 0; Object.keys(R.sold).forEach(function(k){ sold += R.sold[k]; });
    var kinds = [["ok", sold], ["emp", Math.max(0, R.served - sold)], ["q", Math.max(0, R.demand - R.served)]];
    var ns = kinds.map(function(x){ return Math.round(x[1] / unit); }), n = ns[0] + ns[1] + ns[2];
    if (!n) return;
    var left = ns.slice();
    for (var i = 0; i < n; i++) {
      var bi = -1, bv = -1;
      for (var k2 = 0; k2 < 3; k2++) { if (!left[k2]) continue; var v = left[k2] / (n - i); if (v > bv) { bv = v; bi = k2; } }
      left[bi]--;
      var kind = kinds[bi][0], lane = ((toks.length * 37) % 5) - 2, Y = 231 + lane * 1.4, E = [338, Y], CP = [180, Y - 3], pts, fr, sit = [], dec, life;
      if (kind === "ok") { var seat = SEATS[(si++) % SEATS.length];
        // каждый третий после столика идёт к кассе второй раз: в модели это круассан к напитку
        if (R.croissant > 0 && (n2++) % 3 === 0) { pts = [D, E, CP, CP, seat, seat, CP, CP, seat, seat, E, D]; fr = [0, .05, .26, .34, .42, .56, .64, .70, .78, .90, .96, 1]; sit = [[.42, .56], [.78, .90]]; dec = .34; life = 3900; }
        else { pts = [D, E, CP, CP, seat, seat, E, D]; fr = [0, .07, .38, .50, .60, .84, .94, 1]; sit = [[.60, .84]]; dec = .50; life = 2700; } }
      else if (kind === "emp") { pts = [D, E, CP, CP, E, D]; fr = [0, .08, .45, .58, .92, 1]; dec = .52; life = 2100; }
      else { var QP = [262 + lane * 5, Y]; pts = [D, E, QP, QP, E, D]; fr = [0, .1, .40, .62, .9, 1]; dec = .62; life = 1900; }
      toks.push({t: t0 + (i + 0.5) / n * (t1 - t0), kind: kind, dp: dp, g: kinds[bi][1] / Math.max(1, ns[bi]), life: life, pts: pts, fr: fr, sit: sit, dec: dec});
    }
  });
  toks.sort(function(a, b){ return a.t - b.t; });
  // курьеры: что заказано вчера вечером и доехало сегодня утром
  var dl = lastDeliv && lastDeliv.day === rep.day ? lastDeliv : {ok: [], fail: []};
  var cour = dl.ok.map(function(s, i){ var bx = 58 + i * 26; return {s: s, t: .004 + i * .032, life: 2500, bx: bx, pts: [D, [338, 235], [bx + 12, 236], [bx + 12, 236], [338, 235], D], fr: [0, .08, .5, .62, .94, 1]}; });
  // танцор выходит в ту часть дня, где не ушёл ни один гость
  var happy = rep.by_dp.map(function(R){ var sold = 0; Object.keys(R.sold).forEach(function(k){ sold += R.sold[k]; }); return R.demand > 0 && sold >= R.demand; });
  var M = C.menu, lbg = C.suppliers.roaster.items.beans.grams, use = rep.by_dp.map(function(R){ var u = {milk: 0, beans: 0, cups: 0, cro: R.croissant || 0, sold: 0, dem: R.demand};
    Object.keys(R.sold).forEach(function(k){ var n = R.sold[k]; u.milk += n * (M[k].milk_l || 0); u.beans += n * (M[k].beans_g || 0) / lbg; u.cups += n; u.sold += n; });
    // круассаны кончаются раньше конца части дня, если их не хватило
    u.croShare = (R.croissant_missing > 0 && R.croissant + R.croissant_missing > 0) ? R.croissant / (R.croissant + R.croissant_missing) : 1;
    u.q = Math.max(0, R.demand - R.served); u.so = Math.max(0, R.served - u.sold) + (R.croissant_missing || 0); return u; });
  var end = {milk: rep.stock.milk_l + (rep.milk_written_off_l || 0), beans: rep.stock.beans_lb, cups: rep.stock.cups, cro: rep.stock.croissant}, start = {}, soldAll = 0;
  ["milk", "beans", "cups", "cro"].forEach(function(k){ start[k] = end[k] + use.reduce(function(a, u){ return a + u[k]; }, 0); });
  use.forEach(function(u){ soldAll += u.sold; });
  return {toks: toks, unit: unit, maxLife: 3900, cour: cour, fail: dl.fail, happy: happy, use: use, start: start, soldAll: soldAll};

function rpPose(tk, u){
  var pts = tk.pts, fr = tk.fr, p = null;
  for (var i = 1; i < pts.length; i++) if (u <= fr[i]) { var a = (u - fr[i-1]) / Math.max(1e-9, fr[i] - fr[i-1]);
    p = {x: pts[i-1][0] + (pts[i][0] - pts[i-1][0]) * a, y: pts[i-1][1] + (pts[i][1] - pts[i-1][1]) * a}; break; }
  if (!p) { var l = pts[pts.length - 1]; p = {x: l[0], y: l[1]}; }
  (tk.sit || []).forEach(function(r){ if (u > r[0] && u <= r[1]) p.sit = true; });
  if (u > .93) p.op = Math.max(0, 1 - (u - .93) * 12);
  return p;
}

function rpStop(){ ambOff(); if (RP) { if (RP.raf) cancelAnimationFrame(RP.raf); if (RP.timer) clearTimeout(RP.timer); } RP = null; }

function rpFrame(ts){
  if (!RP) return;
  if (!RP.t0) RP.t0 = ts;
  var el = (ts - RP.t0), p = Math.min(1, el / RP_DUR), pl = RP.pl, H = C.hours;
  // часы и полоса
  var hh = H.open + p * (H.close - H.open), mm = Math.floor((hh % 1) * 60);
  RP.clock.textContent = Math.floor(hh) + ":" + (mm < 10 ? "0" : "") + mm;
  RP.prog.style.width = (p * 100).toFixed(1) + "%";
  // смена текущей части дня
  var dp = Math.min(2, Math.floor(p * 3 - 1e-9));
  if (dp < 0) dp = 0;
  if (dp !== RP.dp) { RP.dp = dp;
    RP.staff.forEach(function(g, i){ g.style.display = i === dp ? "" : "none"; });
    RP.dpn.textContent = t(["morning", "midday", "evening_dp"][dp]);
    if (RP.dancer) RP.dancer.style.display = pl.happy[dp] ? "" : "none";
    if (RP.snd) sfx("steam"); }
  // курьеры: приносят заказ утром и ставят на поддон
  for (var ci = 0; ci < pl.cour.length; ci++) {
    var ck = pl.cour[ci], cg = RP.cour[ci], cu = (el - ck.t * RP_DUR) / ck.life;
    if (cu >= .56 && !ck.dn) { ck.dn = 1; RP.boxes[ci].style.display = ""; if (RP.snd) sfx("thud"); }
    if (cu < 0 || cu > 1) { if (cg.style.display !== "none") cg.style.display = "none"; continue; }
    var cp = rpPose(ck, cu);
    cg.style.display = ""; cg.setAttribute("class", cu >= .56 ? "rpC drop" : "rpC");
    cg.setAttribute("transform", "translate(" + cp.x.toFixed(1) + "," + cp.y.toFixed(1) + ")");
    if (cp.op != null) cg.setAttribute("opacity", cp.op.toFixed(2)); else cg.removeAttribute("opacity");
  }
  // гости
  for (var i = 0; i < pl.toks.length; i++) {
    var tk = pl.toks[i], g = RP.els[i], u = (el - tk.t * RP_DUR) / tk.life;
    if (u < 0 || u > 1) { if (g.style.display !== "none") g.style.display = "none"; continue; }
    if (!tk.sp) { tk.sp = 1; RP.c[0] += tk.g; }
    if (u >= tk.dec && !tk.dn) { tk.dn = 1; RP.c[tk.kind === "ok" ? 1 : tk.kind === "q" ? 2 : 3] += tk.g;
      if (RP.snd) sfx(tk.kind === "ok" ? "serve" : tk.kind === "q" ? "queue" : "empty"); }
    var ps = rpPose(tk, u);
    g.style.display = "";
    g.setAttribute("class", "rpP" + (ps.sit ? " sit" : "") + (tk.dn ? " dec" : ""));
    g.setAttribute("transform", "translate(" + ps.x.toFixed(1) + "," + ps.y.toFixed(1) + ")");
    if (ps.op != null) g.setAttribute("opacity", ps.op.toFixed(2)); else g.removeAttribute("opacity");
  }
  rpHud(p);
  if (el < RP_DUR + pl.maxLife) { RP.raf = requestAnimationFrame(rpFrame); return; }
  rpFinish();
}
/* панель под сценой на долю дня p. Итоги дня в ней точные (из отчёта шага), а ход внутри
   части дня равномерный: поминутной раскладки в модели нет. */
function rpHud(p){
  var pl = RP.pl, rep = RP.rep, cum = {milk: 0, beans: 0, cups: 0, cro: 0, sold: 0, dem: 0}, chips = [], nm = ["morning", "midday", "evening_dp"], qAll = 0, soAll = 0;
  pl.use.forEach(function(u, d){ var f = Math.max(0, Math.min(1, (p - d / 3) * 3)); if (f <= 0) return;
    cum.dem += u.dem * f; cum.milk += u.milk * f; cum.beans += u.beans * f; cum.cups += u.cups * f; cum.sold += u.sold * f; cum.cro += u.cro * Math.min(1, f / Math.max(.05, u.croShare));
    var q = Math.round(u.q * f), so = Math.round(u.so * f); qAll += q; soAll += so;
    if (q) chips.push(['bad', t(nm[d]) + ": " + t("queue") + " " + q]);
    if (so) chips.push(['warn', t(nm[d]) + ": " + t("stockout") + " " + so]); });
  RP.rev.textContent = money(pl.soldAll ? rep.revenue * cum.sold / pl.soldAll : 0);
  // нижняя строка из того же расчёта, что и панель: иначе одно и то же число расходится
  [cum.dem, cum.sold, qAll, soAll].forEach(function(v, j){ RP.nums[j].textContent = num(Math.round(v)); });
  RP.pen.textContent = money(-(qAll * C.penalty_queue + soAll * C.penalty_stockout));
  RP.hs.forEach(function(el){ var k = el.dataset.k, st = pl.start[k], now = Math.max(0, st - cum[k]), fr = st > 0 ? now / st : 0;
    el.className = "hs" + (now < .5 ? " out" : fr < .15 ? " low" : "");
    el.querySelector(".v").textContent = now < .5 ? t("hud_out") : num(Math.round(now));
    el.querySelector(".bar i").style.width = (fr * 100).toFixed(1) + "%"; });
  pl.fail.forEach(function(x){ chips.unshift(['bad', t("no_deliv_h") + ": " + (T[LANG].sup[x] || x)]); });
  if (rep.events.indexOf("no_espresso") >= 0) chips.unshift(['bad', LANG==="ru"?"машина не работает":"machine down"]);
  var s = chips.length ? chips.map(function(c){ return '<span class="pill '+c[0]+'">'+esc(c[1])+'</span>'; }).join("") : '<span class="pill ok">'+esc(t("hud_ok"))+'</span>';
  if (s !== RP.probS) { RP.probS = s; RP.prob.innerHTML = s; }
}
/* конец проигрыша. Вызывается и из кадра, и напрямую: в фоновой вкладке кадры не
   приходят, и без прямого вызова день не закончился бы никогда. */
function rpFinish(){
  if (!RP || RP.fin) return;
  RP.fin = true; ambOff();
  if (RP.raf) cancelAnimationFrame(RP.raf);
  if (RP.timer) clearTimeout(RP.timer);
  var H = C.hours;
  RP.clock.textContent = H.close + ":00"; RP.prog.style.width = "100%";
  RP.staff.forEach(function(g, i){ g.style.display = i === 2 ? "" : "none"; });
  RP.dpn.textContent = t("evening_dp");
  rpHud(1);
  RP.rev.textContent = money(RP.rep.revenue);
  RP.pen.textContent = money(-(RP.rep.queue_guests * C.penalty_queue + RP.rep.stockout_guests * C.penalty_stockout));
  RP.cour.forEach(function(g){ g.style.display = "none"; }); RP.boxes.forEach(function(g){ g.style.display = ""; });
  if (RP.dancer) RP.dancer.style.display = RP.pl.happy[2] ? "" : "none";
  if (!RP.rep.closed && RP.rep.queue_guests + RP.rep.stockout_guests === 0) RP.staff[2].setAttribute("class", "rpS hop");
  // точные числа отчёта, а не сумма округлений
  var rep = RP.rep, sold = 0;
  rep.by_dp.forEach(function(R){ Object.keys(R.sold).forEach(function(k2){ sold += R.sold[k2]; }); });
  [rep.demand, sold, rep.queue_guests, rep.stockout_guests].forEach(function(v, j){ RP.nums[j].textContent = num(v); });
  RP.els.forEach(function(g){ g.style.display = "none"; });
  RP.raf = 0;
  var pb = document.getElementById("rp-play"), cb = document.getElementById("rp-close");
  if (pb) pb.hidden = false;
  if (cb) cb.textContent = t("rp_close");
  if (RP.onDone) { var fn = RP.onDone; RP.onDone = null; fn(); }
}

    if (k[0] === "b" && k.length === 2) draft.sched[+k[1]] = Math.max(0, Math.min(6, draft.sched[+k[1]] + dv));
    else if (k[0] === "l" && k.length === 2) draft.leads[+k[1]] = Math.max(0, Math.min(1, draft.leads[+k[1]] + dv));
    else if (k === "hire") draft.hire = Math.max(0, Math.min(3, draft.hire + dv));
    else if (k === "fire") draft.fire = Math.max(0, draft.fire + dv); }
  else if (b.dataset.pr) { var q = b.dataset.pr.split(":"); draft.prices[q[0]] = Math.round((draft.prices[q[0]] + 0.25 * (+q[1])) * 100) / 100; }
  else if (b.dataset.disc) { draft.disc = +b.dataset.disc; if (draft.disc && !draft.dparts.length) draft.dparts = [2]; }
  else if (b.dataset.dp2) { var dpn = +b.dataset.dp2, ix2 = draft.dparts.indexOf(dpn);
    if (ix2 >= 0) { if (draft.dparts.length > 1) draft.dparts.splice(ix2, 1); } else draft.dparts.push(dpn); }
  else if (b.dataset.buy) { var kb = b.dataset.buy, ix = draft.buy.indexOf(kb); if (ix >= 0) draft.buy.splice(ix, 1); else draft.buy.push(kb); }
  else return;
  render(); window.scrollTo(0, y);
});
document.addEventListener("input", function(e){
  var el = e.target; if (screen !== "play" || !el.dataset || !el.dataset.q || !draft) return;
  var p0 = el.dataset.q.split(":"), v0 = parseInt(el.value, 10); draft.qty[p0[0]][p0[1]] = isNaN(v0) || v0 < 0 ? 0 : v0;
  refreshNeeds();
});

  var el = e.target; if (screen !== "play" || !el.dataset || !el.dataset.q) return;

});
