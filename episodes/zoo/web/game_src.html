<title>Месяц зоопарка</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Podkova:wght@500;600;700;800&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Зоопарк как путеводитель у входа: живая карта в центре, жёлтые указатели вместо кнопок,
   таблички на дереве вместо подписей. Остальное тихое, чтобы карта оставалась главной. */
:root{
  --bg:#e6efdd; --panel:#fffdf5; --panel2:#f4f1e2; --fg:#1d2a22; --muted:#5b6a5f; --line:#cfd8c4;
  --sign:#f2c230; --sign-fg:#33260f; --wood:#7a5533; --leaf:#1f7a4d; --leaf-soft:#dcefe2;
  --ghost:#6d4bb0; --ghost-soft:#ece6f7; --ok:#1f7a4d; --ok-soft:#dcefe2; --bad:#c23b2b; --bad-soft:#f8e1dc; --warn:#96610a; --warn-soft:#f9edd2;
  --water:#39a9c4; --frame:#213a2e;
  --display:"Podkova",Georgia,"Times New Roman",serif;
  --sans:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1d17; --panel:#17291f; --panel2:#1d3327; --fg:#e9efe6; --muted:#9db0a2; --line:#2c4436;
  --sign:#f2c230; --sign-fg:#2a1f0b; --wood:#c9a273; --leaf:#59c38d; --leaf-soft:#173527;
  --ghost:#b9a2ee; --ghost-soft:#261f3a; --ok:#6fd09a; --ok-soft:#173527; --bad:#f08b7c; --bad-soft:#3d1d18; --warn:#edba55; --warn-soft:#382a12;
  --frame:#0a1510; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1d17; --panel:#17291f; --panel2:#1d3327; --fg:#e9efe6; --muted:#9db0a2; --line:#2c4436;
  --sign:#f2c230; --sign-fg:#2a1f0b; --wood:#c9a273; --leaf:#59c38d; --leaf-soft:#173527;
  --ghost:#b9a2ee; --ghost-soft:#261f3a; --ok:#6fd09a; --ok-soft:#173527; --bad:#f08b7c; --bad-soft:#3d1d18; --warn:#edba55; --warn-soft:#382a12;
  --frame:#0a1510; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding-block:14px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header.top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.brand{font-family:var(--display);font-weight:800;font-size:22px;color:var(--sign-fg);background:var(--sign);border:2px solid var(--wood);border-radius:10px;padding:3px 14px 5px;cursor:pointer;min-height:0;transform:rotate(-1.2deg)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,6.2vw,64px);line-height:.98;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.15;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:18px;margin:0}
p{margin:0;max-width:64ch}
.muted{color:var(--muted)} .small{font-size:14px} .note{font-size:13.5px;color:var(--muted)}
.n{font-variant-numeric:tabular-nums}
.big{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
button{font:inherit;font-size:15px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;min-height:38px}
button:hover:not(:disabled){border-color:var(--muted)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
/* жёлтый указатель: главное действие экрана, одно */
button.go{font-family:var(--display);font-weight:800;font-size:20px;background:var(--sign);color:var(--sign-fg);border:2px solid var(--wood);border-radius:12px;padding:8px 22px 10px;min-height:50px;box-shadow:0 3px 0 var(--wood)}
button.go:hover:not(:disabled){border-color:var(--wood);transform:translateY(-1px);box-shadow:0 4px 0 var(--wood)}
button.go:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--wood)}
button.on,button[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft);font-weight:600}
button.link{border:0;background:none;padding:0;min-height:0;color:var(--leaf);text-decoration:underline;text-underline-offset:3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:34px;padding:5px 10px;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.step{display:inline-flex;align-items:center;gap:4px}
.step button{min-width:38px;min-height:38px;padding:0;font-weight:700;font-size:18px;border-radius:50%}
.step .v{min-width:2.6em;text-align:center;font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.rej{border-left:4px solid var(--bad);background:var(--bad-soft);padding:7px 11px;border-radius:0 8px 8px 0;font-size:14.5px}
.okmsg{border-left:4px solid var(--ok);background:var(--ok-soft);padding:7px 11px;border-radius:0 8px 8px 0;font-size:14.5px}
.warnmsg{border-left:4px solid var(--warn);background:var(--warn-soft);padding:7px 11px;border-radius:0 8px 8px 0;font-size:14.5px}
.pill{display:inline-block;font-size:12.5px;font-weight:700;padding:1px 9px;border-radius:99px;border:1.5px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.bad{color:var(--bad)} .pill.warn{color:var(--warn)} .pill.ghost{color:var(--ghost)}
table{border-collapse:collapse;width:100%;font-size:14.5px} .tbl{overflow-x:auto}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600} td.n,th.n{text-align:right;white-space:nowrap}

/* карта */
.stage{position:relative;border-radius:22px;background:var(--frame);border:3px solid var(--frame);box-shadow:0 10px 30px rgba(20,40,30,.18)}
.stage canvas{display:block;width:100%;height:auto;border-radius:19px}
.plaque{position:absolute;transform:translate(6px,6px);font-family:var(--display);font-weight:700;font-size:13.5px;line-height:1.1;color:#33260f;background:#fff6dc;border:1.5px solid #7a5533;border-radius:8px;padding:3px 8px 4px;min-height:0;display:flex;gap:6px;align-items:center;box-shadow:0 2px 0 rgba(60,40,20,.35);white-space:nowrap}
.plaque:hover:not(:disabled){border-color:#33260f;background:#fff}
.plaque .kp{font-family:var(--sans);font-weight:700;font-size:12px;background:#1f7a4d;color:#fff;border-radius:99px;padding:1px 7px}
.plaque.low{background:#ffe3b0;border-color:#96610a} .plaque.bad{background:#ffd9d2;border-color:#c23b2b}
.plaque.low .kp{background:#96610a} .plaque.bad .kp{background:#c23b2b}
.pop{position:absolute;z-index:4;width:min(264px,calc(100% - 16px));background:var(--panel);color:var(--fg);border:2px solid var(--wood);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 12px 30px rgba(10,30,20,.35)}
.pop .line{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chipbar{position:absolute;left:8px;right:8px;bottom:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;align-items:flex-end;pointer-events:none}
.chip{pointer-events:auto;font-size:13px;font-weight:600;background:rgba(15,29,23,.78);color:#f3f6ef;border-radius:99px;padding:4px 11px;backdrop-filter:blur(4px)}
.clock{font-family:var(--display);font-weight:800;font-size:22px;background:#fff6dc;color:#33260f;border:2px solid #7a5533;border-radius:10px;padding:1px 12px 3px}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);max-width:calc(100% - 24px);background:#fff6dc;color:#33260f;border:2px solid #7a5533;border-radius:12px;padding:6px 14px;font-weight:600;font-size:14.5px;text-align:center;box-shadow:0 6px 18px rgba(10,30,20,.3)}

/* игра: карта слева, стол управляющего справа */
.play{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:1040px){.play{grid-template-columns:minmax(0,1.22fr) minmax(360px,.78fr)}.play .left{position:sticky;top:12px}}
.left,.desk{display:flex;flex-direction:column;gap:12px;min-width:0}
.hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 11px;min-width:0}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--display);font-weight:700;font-size:21px;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.15}
.stat.ghost{border-color:var(--ghost)} .stat.ghost .v{color:var(--ghost)}
.ribbon{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:2px}
.ribbon i{display:block;height:14px;border-radius:3px;background:var(--line)}
.ribbon i.we{background:color-mix(in srgb,var(--line) 60%,var(--muted))}
.ribbon i.up{background:var(--ok)} .ribbon i.dn{background:var(--bad)} .ribbon i.now{background:var(--sign);outline:2px solid var(--wood);outline-offset:1px}
.fc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fc .d{border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0;display:flex;flex-direction:column;gap:2px;background:var(--panel)}
.fc .d.tom{border:2px solid var(--wood);background:var(--panel2)}
.fc svg{width:30px;height:30px}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.meter b{display:block;height:100%;border-radius:99px;background:var(--leaf)}
.meter.over b{background:var(--bad)}
.meter::after{content:"";position:absolute;left:66.6%;top:-2px;bottom:-2px;width:2px;background:var(--fg);opacity:.55}
/* решения вечера: плитки, раскрыта одна */
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tile>button.head{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:0;border-radius:0;background:none;padding:10px 12px;min-height:54px}
.tile .ico{width:36px;height:36px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;color:var(--wood)}
.tile .ico svg{width:24px;height:24px}
.tile .ttl{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.1}
.tile .sum{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.open{border:2px solid var(--wood)}
.tile .body{padding:4px 12px 14px;display:flex;flex-direction:column;gap:10px}
.tile.att{border-color:var(--warn)} .tile.err{border-color:var(--bad)}
.shift{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 10px;align-items:center}
.shift .hh{font-size:13px;color:var(--muted);font-weight:600;text-align:center}
.shift .nm.hot{color:var(--leaf);font-weight:700}
.shift .cell{display:flex;align-items:center;gap:6px;justify-content:center}
.shift .cell::before{content:attr(data-h);font-size:12.5px;color:var(--muted);display:none}
@media (max-width:560px){.shift{grid-template-columns:1fr 1fr;gap:4px 8px}.shift .hh,.shift .corner{display:none}.shift .nm{grid-column:1/-1;margin-top:8px}.shift .cell{justify-content:flex-start}.shift .cell::before{display:inline}
  .hud{grid-template-columns:repeat(3,minmax(0,1fr))}.stat .v{font-size:18px}.step button{min-width:34px;min-height:34px}}
input[type=range]{width:100%;accent-color:var(--leaf);height:30px}
.gauge{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.supp{padding-block:8px;border-bottom:1px dashed var(--line);display:flex;flex-direction:column;gap:6px}
.supp:last-of-type{border-bottom:0}
.qtys{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.qtys label{display:inline-flex;gap:6px;align-items:center;font-size:14.5px}
.ticket{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.stub{font-family:var(--display);font-weight:800;font-size:26px;background:var(--sign);color:var(--sign-fg);border-radius:10px;padding:6px 16px 8px;border:2px dashed var(--wood);transform:rotate(-2deg)}
.ecard{background:var(--panel);border:2px solid var(--warn);border-radius:14px;padding:12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 12px}
.ecard .pic{width:46px;height:46px;border-radius:12px;background:var(--warn-soft);display:grid;place-items:center;color:var(--warn)}
.ecard .pic svg{width:30px;height:30px}
.ecard .opts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.ghostbox{border-left:4px solid var(--ghost);background:var(--ghost-soft);padding:9px 12px;border-radius:0 12px 12px 0}
.closebar{position:sticky;bottom:0;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 78%,transparent);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;z-index:5}
/* первый экран */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:center}
@media (min-width:1040px){.hero{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)}}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
.opt{display:flex;flex-direction:column;gap:6px}
.opt .lab{font-family:var(--display);font-weight:700;font-size:16px;color:var(--wood)}
.choice{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;text-align:left;padding:8px 10px;border-radius:12px;min-height:56px}
.choice svg{width:34px;height:34px;color:var(--wood)}
.choice.on{border:2px solid var(--wood);background:var(--panel2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.chart svg{display:block;width:100%;height:auto}
.dayres{border:2px solid var(--wood)}
.stand{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:6px 10px;align-items:center;font-size:14.5px}
.stand .pl{font-family:var(--display);font-weight:800;font-size:17px;width:1.3em;text-align:center}
.stand .nm{min-width:0} .stand .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stand .bar{height:6px;border-radius:99px;background:var(--line);margin-top:3px;overflow:hidden} .stand .bar i{display:block;height:100%;border-radius:99px}
.stand .me b{color:var(--leaf)} .stand .gap{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.pnl td,.pnl th{padding:5px 6px;font-size:14px}
.bump{animation:bump .5s ease-out}@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.18)}100%{transform:scale(1)}}
#snd[aria-pressed="false"]{opacity:.55;text-decoration:line-through}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:no-preference){.pop,.toast{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(6px)}to{transform:none}}.toast{animation-name:popc}@keyframes popc{from{transform:translate(-50%,-8px)}to{transform:translate(-50%,0)}}}
</style>

<div class="wrap" id="app">
  <header class="top">
    <button class="brand" id="home" type="button">Месяц зоопарка</button>
    <div class="row">
      <div class="seg" role="group" aria-label="Language"><button type="button" id="lang-ru">RU</button><button type="button" id="lang-en">EN</button></div>
      <button type="button" id="snd" aria-label="Sound" style="min-height:34px;padding:5px 10px;font-size:14px">♪</button>
      <div class="seg" role="group" aria-label="Theme"><button type="button" id="th-light" aria-label="Light theme">☀</button><button type="button" id="th-dark" aria-label="Dark theme">☾</button></div>
    </div>
  </header>
  <main id="main"><p class="muted">Загружаю зоопарк…</p></main>
</div>

/* ---------- черновик вечера ---------- */
function suggestRow(obs){
  var prev = obs.schedule[String(obs.wd)], mn = obs.min_tomorrow, r = {keepers: {}, cashiers: [1, 1], kiosk: [1, 1], shows: prev.shows || 0};
  SECT.forEach(function(s){ r.keepers[s] = [Math.max(prev.keepers[s][0], mn[s][0]), Math.max(prev.keepers[s][1], mn[s][1])]; });
  r.keepers.cats[0] = Math.max(2, r.keepers.cats[0]);
  r.keepers.pool[0] = Math.max(1, r.keepers.pool[0]);
  r.keepers.pool[1] = Math.max(1, r.keepers.pool[1]);
  r.keepers.yard = [Math.max(1, r.keepers.yard[0]), Math.max(1, r.keepers.yard[1])];
  var f = obs.forecast[0];
  for (var h = 0; h < 2; h++) {
    r.cashiers[h] = Math.max(1, Math.min(8, Math.ceil(f.high[h] * 0.75 / (W.gate_per_cashier_hour * W.halves.hours[h]))));
    r.kiosk[h] = Math.max(0, Math.min(8, Math.ceil(f.high[h] * 0.7 / (W.kiosk_per_worker_hour * W.halves.hours[h]))));
  }
  for (var k = 0; k < r.shows; k++) r.keepers.pool[k] = Math.max(r.keepers.pool[k], W.shows.pool_keepers_needed);
  return legalizeRow(r, obs, mn);
}
function availKeepers(obs){
  var n = 0; obs.staff.forEach(function(x){ if (x.start <= obs.day) n++; });
  return n - obs.sick_tomorrow;
}
function legalizeRow(r, obs, mn){
  // смена должна проходить Проверку: сперва убираем лишнее сверх минимума ухода, потом по правилам
  mn = mn || obs.min_tomorrow;
  var avail = availKeepers(obs);
  SECT.forEach(function(sx){ r.keepers[sx] = [Math.min(6, r.keepers[sx][0]), Math.min(6, r.keepers[sx][1])]; });
  r.keepers.pool[0] = Math.max(1, r.keepers.pool[0]); r.keepers.pool[1] = Math.max(1, r.keepers.pool[1]);
  r.keepers.yard = [Math.max(1, r.keepers.yard[0]), Math.max(1, r.keepers.yard[1])];
  r.keepers.cats[0] = Math.max(2, r.keepers.cats[0]);
  r.cashiers = [Math.max(1, r.cashiers[0]), Math.max(1, r.cashiers[1])];
  for (var hh = 0; hh < 2; hh++) {
    for (var guard = 0; guard < 40; guard++) {
      var used = 0; SECT.forEach(function(sx){ used += r.keepers[sx][hh]; });
      if (used <= avail) break;
      var floorOf = function(sx, care){
        var f = care ? mn[sx][hh] : (sx === "pool" || sx === "yard" ? 1 : 0);
        if (sx === "cats" && hh === 0) f = 2;                                  // вольер барсов убирают вдвоём
        if (sx === "pool" && hh < r.shows) f = Math.max(f, W.shows.pool_keepers_needed);
        return f;
      };
      var pickWorst = function(care){
        var best = null, gain = 0;
        SECT.forEach(function(sx){ var over = r.keepers[sx][hh] - floorOf(sx, care); if (over > gain) { gain = over; best = sx; } });
        return best;
      };
      var best = pickWorst(true) || pickWorst(false);                          // сперва лишнее сверх минимума ухода, потом по правилам
      if (!best) { if (r.shows > 0) { r.shows--; continue; } break; }
      r.keepers[best][hh]--;
    }
  }
  return r;
}
function newDraft(){
  var obs = G.observe(), nd = obs.need_kg_per_day, st = obs.stock;
  var have = {fish: st.freezer.fish + st.thawed_for_tomorrow.fish, meat: st.freezer.meat + st.thawed_for_tomorrow.meat};
  return {obs: obs, row: suggestRow(obs),
          thaw: {fish: Math.round(Math.min(nd.fish, have.fish) * 10) / 10, meat: Math.round(Math.min(nd.meat, have.meat) * 10) / 10},
          qty: {}, price: obs.price, free_wed: obs.free_wed, hire: 0, vet: false, choices: {}};
}
function fillOrder(){
  var obs = draft.obs, nd = obs.need_kg_per_day, st = obs.stock, q = {};
  if (obs.suppliers.frozen.delivers_tomorrow) {
    var gap = 1; for (var k = 1; k <= 7; k++) if (obs.suppliers.frozen.days.indexOf((obs.wd + k) % 7) >= 0) { gap = k; break; }
    var it = {};
    ["fish", "meat"].forEach(function(f){
      var hv = st.freezer[f] + st.thawed_for_tomorrow[f] - nd[f], want = nd[f] * (gap + 3) - hv;
      if (want > 0) it[f] = 10 * Math.ceil(want / 10);
    });
    var tot = 0; Object.keys(it).forEach(function(f){ tot += it[f] * obs.suppliers.frozen.prices_kg[f]; });
    while (tot < obs.suppliers.frozen.min_order) { it.fish = (it.fish || 0) + 10; tot += 10 * obs.suppliers.frozen.prices_kg.fish; }
    var room = st.freezer_kg - (st.freezer.fish + st.freezer.meat + st.thawed_for_tomorrow.fish + st.thawed_for_tomorrow.meat - draft.thaw.fish - draft.thaw.meat);
    while (it.fish > 10 && it.fish + (it.meat || 0) > room) it.fish -= 10;
    q.frozen = it;
  }
  if (obs.suppliers.hay.delivers_tomorrow && st.hay < nd.hay * 11) q.hay = {hay: 500};
  var usable = 0; st.produce.forEach(function(x){ if (x[1] >= obs.day) usable += x[0]; });
  if (obs.suppliers.produce.delivers_tomorrow && usable < nd.produce * 1.6) q.produce = {produce: Math.max(obs.suppliers.produce.min_kg, Math.ceil(nd.produce * 2.1 - usable))};
  draft.qty = q;
}
function buildDec(){
  var obs = draft.obs, sch = clone(obs.schedule);
  // остальные дни недели остаются от прошлых вечеров: приводим их к законному виду, иначе Проверка отказывает за день, которого игрок не видит
  for (var w = 0; w < 7; w++) if (w !== obs.wd) sch[String(w)] = legalizeRow(sch[String(w)], obs, null);
  sch[String(obs.wd)] = clone(draft.row);
  var dec = {schedule: sch, thaw: {fish: draft.thaw.fish, meat: draft.thaw.meat}, price: draft.price, free_wed: !!draft.free_wed};
  var orders = {};
  Object.keys(draft.qty).forEach(function(s){
    var it = {}; Object.keys(draft.qty[s]).forEach(function(i){ if (draft.qty[s][i] > 0) it[i] = draft.qty[s][i]; });
    if (Object.keys(it).length) orders[s] = it;
  });
  if (Object.keys(orders).length) dec.orders = orders;
  if (draft.hire) dec.hire = draft.hire;
  if (draft.vet) dec.vet_visit = true;
  if (Object.keys(draft.choices).length) dec.choices = clone(draft.choices);
  return dec;
}
function orderTotal(){
  var obs = draft.obs, tot = 0;
  Object.keys(draft.qty).forEach(function(s){ Object.keys(draft.qty[s]).forEach(function(i){ tot += (draft.qty[s][i] || 0) * obs.suppliers[s].prices_kg[i]; }); });
  return tot;
}
function rejections(){ var r = G.check(buildDec()); return r[0] || []; }
function rejFor(prefix, list){ return list.filter(function(r){ return r.field === prefix || r.field.indexOf(prefix + ".") === 0; }); }
function rejHTML(list){ return list.map(function(r){ return '<div class="rej">' + esc(r[LANG]) + '</div>'; }).join(""); }

      var g = ghost(), ref = DB.collection("scores").doc(me), cur = await ref.get(), data = cur.exists ? cur.data() : {best: {}};
      var best = data.best || {}, prev = best[key()];
      if (!prev || chk.score > prev.score) best[key()] = {score: chk.score, extella: g ? g.score : null, beat: g ? chk.score > g.score : null, seed: DATA.seed, at: new Date().toISOString(), log: DLOG};
      await ref.set({best: best});
      saveState = t("saved"); $("savemsg").textContent = saveState; b.hidden = true;
    } catch (e) { $("savemsg").textContent = t("save_fail"); }
    finally { b.disabled = false; b.textContent = was; }
  };
}
async function renderBoard(){
  var el = $("board"); if (!el) return;
  var h = '<section class="stack"><h1>'+esc(t("board_h"))+'</h1>';
  if (dbState === "loading") { el.innerHTML = h + '<p class="muted">'+esc(t("loading"))+'</p></section>'; return; }
  if (!DB || dbState === "off" || !rows) { el.innerHTML = h + '<p class="muted">'+esc(t("board_off"))+'</p><button type="button" id="home2">'+esc(t("other"))+'</button></section>'; return; }
  var prof = {}; try { if (rows.length && USER) prof = await USER.profiles(rows.map(function(r){ return r.id; })); } catch (e) {}
  if (!rows.length) h += '<p class="muted">'+esc(t("board_empty"))+'</p>';
  Object.keys(DATA.ghosts).forEach(function(k){
    var list = rows.filter(function(r){ return r.data.best && r.data.best[k]; }).map(function(r){ return {id: r.id, b: r.data.best[k]}; }).sort(function(a, b){ return b.b.score - a.b.score; });
    if (!list.length) return;
    var p = k.split("_");
    h += '<h2>'+esc(t("sc_" + p[0]))+' · '+esc(t("st_" + p[1]))+' · '+esc(t("tm_" + p[2]))+'</h2><div class="tbl"><table><thead><tr><th>'+esc(t("name"))+'</th><th class="n">'+esc(t("best"))+'</th><th class="n">Extella</th><th>'+esc(t("vs"))+'</th></tr></thead><tbody>' +
      list.map(function(r){ var nm = (prof[r.id] && prof[r.id].name) || t("someone");
        return '<tr><td>'+esc(nm)+'</td><td class="n mono">'+money(r.b.score)+'</td><td class="n mono">'+(r.b.extella == null ? "—" : money(r.b.extella))+'</td><td>'+(r.b.beat ? '<span class="pill ok">'+esc(t("beat"))+'</span>' : '<span class="muted">'+esc(t("nobeat"))+'</span>')+'</td></tr>'; }).join("") +
      '</tbody></table></div>';
  });
  el.innerHTML = h + '<p class="note">'+esc(t("verify"))+'</p><button type="button" id="home2">'+esc(t("other"))+'</button></section>';
}

/* ---------- отрисовка и события ---------- */
function render(){
  var m = $("main"), keep = null, ae = document.activeElement;
  if (ae && ae.dataset) keep = ae.dataset.st ? '[data-st="' + ae.dataset.st + '"]' : ae.dataset.tile ? '[data-tile="' + ae.dataset.tile + '"]' : ae.id ? "#" + ae.id : null;
  $("home").textContent = t("brand");
  document.title = t("brand");
  ["ru", "en"].forEach(function(l){ $("lang-" + l).setAttribute("aria-pressed", String(LANG === l)); });
  $("snd").setAttribute("aria-pressed", String(AU.isOn())); $("snd").title = LANG === "ru" ? "Звук" : "Sound";
  if (CV.parentNode) CV.parentNode.removeChild(CV);
  if (screen === "start") m.innerHTML = startHTML();
  else if (screen === "lesson") m.innerHTML = lessonHTML();
  else if (screen === "play") m.innerHTML = playHTML();
  else if (screen === "end") m.innerHTML = endHTML();
  else if (screen === "board") { m.innerHTML = '<div id="board"><p class="muted">'+esc(t("loading"))+'</p></div>'; renderBoard(); }
  mountScene();
  if (SC) {
    if (screen === "start") { SC.setScenario(pick.sc); SC.setIdle({weather: pick.sc === "heat" ? "hot" : "clear", keepers: {pool: [4, 3], cats: [2, 1], birds: [2, 1], yard: [2, 2], tropic: [1, 1]}, cashiers: [2, 2], kiosk: [2, 2], shows: 2, cubs: pick.sc === "spring"}); }
    else if (screen === "play" && !film) { SC.focus = pop; SC.setEvening(eveningState()); }
  }
  if (screen === "play") renderOverlay();
  setAmbience();
  if (keep) { try { var el = document.querySelector(keep); if (el && !el.disabled) el.focus({preventScroll: true}); } catch (e) {} }
}
function startGame(){
  try { localStorage.setItem("zoo_played", "1"); } catch (e) {}
  G = new S.Game(DATA.seed, pick.pl, pick.tm, pick.sc, W);
  DLOG = []; dailyCache = []; lastDay = null; saveState = ""; film = null; pop = null;
  draft = newDraft(); openTile = firstAttention(); screen = "play";
  if (SC) SC.setScenario(pick.sc);
  render(); window.scrollTo(0, 0);
}
function bump(id, dir){
  var p = id.split(":");
  if (screen === "lesson") {
    if (p[0] === "L1k") { lesson.l1.keepers[p[1]][+p[2]] = Math.max(0, Math.min(6, lesson.l1.keepers[p[1]][+p[2]] + dir)); return true; }
    if (p[0] === "L1c") { lesson.l1.cashiers[+p[1]] = Math.max(0, Math.min(8, lesson.l1.cashiers[+p[1]] + dir)); return true; }
    if (p[0] === "L1q") { lesson.l1.kiosk[+p[1]] = Math.max(0, Math.min(8, lesson.l1.kiosk[+p[1]] + dir)); return true; }
    if (p[0] === "L1s") { lesson.l1.shows = Math.max(0, Math.min(W.shows.max, lesson.l1.shows + dir)); return true; }
    if (p[0] === "L2f") { lesson.l2 = Math.max(0, Math.min(60, lesson.l2 + dir * 2)); lesson.l2done = null; return true; }
    return false;
  }
  if (p[0] === "k") { draft.row.keepers[p[1]][+p[2]] = Math.max(0, Math.min(6, draft.row.keepers[p[1]][+p[2]] + dir)); return true; }
  if (p[0] === "c") { draft.row.cashiers[+p[1]] = Math.max(0, Math.min(8, draft.row.cashiers[+p[1]] + dir)); return true; }
  if (p[0] === "q") { draft.row.kiosk[+p[1]] = Math.max(0, Math.min(8, draft.row.kiosk[+p[1]] + dir)); return true; }
  if (p[0] === "s") { draft.row.shows = Math.max(0, Math.min(W.shows.max, draft.row.shows + dir)); return true; }
  if (p[0] === "tf") { draft.thaw.fish = Math.max(0, Math.round((draft.thaw.fish + dir * 2) * 10) / 10); return true; }
  if (p[0] === "tm") { draft.thaw.meat = Math.max(0, Math.round((draft.thaw.meat + dir * 0.5) * 10) / 10); return true; }
  if (p[0] === "o") { var s = p[1], it = p[2], st = +p[3];
    draft.qty[s] = draft.qty[s] || {}; draft.qty[s][it] = Math.max(0, (draft.qty[s][it] || 0) + dir * st); return true; }
  if (p[0] === "pr") { var lo = W.prices.adult * W.prices.bounds[0], hi = W.prices.adult * W.prices.bounds[1];
    draft.price = Math.min(hi, Math.max(lo, Math.round((draft.price + dir * 0.5) * 100) / 100)); return true; }
  if (p[0] === "hi") { draft.hire = Math.max(0, Math.min(3, draft.hire + dir)); return true; }
  return false;
}

document.addEventListener("input", function(e){
  var el = e.target; if (!draft || !el || el.type !== "range") return;
  if (el.id === "rg-fish") { draft.thaw.fish = Math.round(+el.value * 10) / 10; $("rv-fish").textContent = kg(draft.thaw.fish); }
  else if (el.id === "rg-meat") { draft.thaw.meat = Math.round(+el.value * 10) / 10; $("rv-meat").textContent = kg(draft.thaw.meat); }
  else if (el.id === "rg-price") { draft.price = Math.round(+el.value * 100) / 100; $("rv-price").textContent = money2(draft.price); }
  if (SC) SC.setEvening(eveningState());
});
document.addEventListener("change", function(e){ if (e.target && e.target.type === "range" && screen === "play") { render(); var el = $(e.target.id); if (el) el.focus({preventScroll: true}); } });
document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && pop) { pop = null; render(); return; }
  if (e.key !== "Enter" || screen !== "play" || e.target.closest("button, summary, input")) return;
  var b = $("close-ev"); if (b && !b.disabled) { e.preventDefault(); b.click(); }
});
document.addEventListener("click", function(e){
  var b = e.target.closest("button"); if (!b) return;
  if (b.id === "snd") { AU.toggle(); b.setAttribute("aria-pressed", String(AU.isOn())); if (AU.isOn()) AU.pop(); return; }
  if (b.dataset.st || b.dataset.tile || b.dataset.ch || b.dataset.tg || b.dataset.pick) AU.click();
  if (b.dataset.pop && b.dataset.pop !== "close") AU.pop();
  if (b.id === "lang-ru" || b.id === "lang-en") { LANG = b.id.slice(5); try { localStorage.setItem(SITE ? "robot_lang" : "zoo_lang", LANG); } catch (x) {} render(); return; }
  if (b.id === "th-light" || b.id === "th-dark") {
    var v = b.id.slice(3), cur = document.documentElement.getAttribute("data-theme");
    if (cur === v) { document.documentElement.removeAttribute("data-theme"); v = ""; } else document.documentElement.setAttribute("data-theme", v);
    try { if (v) localStorage.setItem("zoo_theme", v); else localStorage.removeItem("zoo_theme"); } catch (x) {}
    return;
  }
  if (b.id === "home" || b.id === "other" || b.id === "home2") { if (SC) SC.skipDay(); film = null; screen = "start"; render(); return; }
  if (b.dataset.pick) { var q = b.dataset.pick.split(":"); pick[q[0]] = q[1]; try { localStorage.setItem("zoo_pick", JSON.stringify(pick)); } catch (x) {} render(); return; }
  if (b.id === "go-play") { startGame(); return; }
  if (b.id === "go-lesson") { lesson = {step: 1, l1: null, l2: null, l2done: null, l3: null, l3done: false}; screen = "lesson"; render(); return; }
  if (b.id === "go-board") { screen = "board"; render(); return; }
  if (b.id === "skip-l") { screen = "start"; render(); return; }
  if (b.id === "l-next") { lesson.step++; render(); return; }
  if (b.id === "l-run") { runLesson2(); render(); return; }
  if (b.id === "l-again") { if (lesson.step === 2) lesson.l2done = null; else lesson.l3done = false; render(); return; }
  if (b.id === "l-show") { lesson.l3done = true; render(); return; }
  if (b.id === "l-done") { screen = "start"; render(); return; }
  if (b.dataset.l3) { lesson.l3 = b.dataset.l3; lesson.l3done = false; render(); return; }
  if (b.dataset.pop) { pop = b.dataset.pop === "close" || b.dataset.pop === pop ? null : b.dataset.pop; if (pop && pop !== "gate" && pop !== "kiosk") openTile = "shift"; render(); return; }
  if (b.dataset.tile) { openTile = openTile === b.dataset.tile ? null : b.dataset.tile; render(); return; }
  if (b.id === "stand-tg") { standOpen = !standOpen; try { localStorage.setItem("zoo_stand", standOpen ? "1" : "0"); } catch (x) {} render(); return; }
  if (b.dataset.cmp) { cmpWith = b.dataset.cmp; render(); return; }
  if (b.dataset.st) { var i = b.dataset.st.lastIndexOf(":"), id = b.dataset.st.slice(0, i), dir = +b.dataset.st.slice(i + 1);
    if (bump(id, dir)) render(); return; }
  if (b.dataset.ch) { var c = b.dataset.ch.split(":"); draft.choices[c[0]] = c[1]; render(); return; }
  if (b.dataset.tg) { draft[b.dataset.tg] = !draft[b.dataset.tg]; render(); return; }
  if (b.id === "thaw-norm") { var o = draft.obs, st = o.stock; draft.thaw = {fish: Math.round(Math.min(o.need_kg_per_day.fish, st.freezer.fish + st.thawed_for_tomorrow.fish) * 10) / 10, meat: Math.round(Math.min(o.need_kg_per_day.meat, st.freezer.meat + st.thawed_for_tomorrow.meat) * 10) / 10}; render(); return; }
  if (b.id === "price-base") { draft.price = W.prices.adult; render(); return; }
  if (b.id === "ord-fill") { fillOrder(); render(); return; }
  if (b.id === "ord-clear") { draft.qty = {}; render(); return; }
  if (b.id === "close-ev") { closeEvening(); return; }
  if (b.id === "skip-day") { if (SC) SC.skipDay(); return; }
  if (b.id === "again") { startGame(); return; }
});
render();
})();
