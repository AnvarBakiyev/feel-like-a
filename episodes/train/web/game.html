<title>Кабина машиниста</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: route-book column for lessons; the cab is one instrument panel: window on top, gauges in a row, one lever */
:root{
  --bg:#eef0f3; --panel:#ffffff; --fg:#151a21; --muted:#5a6472; --line:#d6dbe2;
  --signal:#a86f00; --signal-soft:#faf0d8; --limit:#b8322f; --limit-soft:#f8e2e1; --track:#2f5d8a; --track-soft:#e1eaf4;
  --ok:#1f7a4d; --ok-soft:#e1f2e8; --ghost:#7a4fb0; --ghost-soft:#efe7f8;
  --sky:#dfe8f1; --ground:#c9d3c1; --rail:#3a4250;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1318; --panel:#181e26; --fg:#e4e8ee; --muted:#97a2b0; --line:#29323d;
  --signal:#f2b33d; --signal-soft:#382b10; --limit:#f08783; --limit-soft:#3a1d1c; --track:#8ab4e0; --track-soft:#1c2a39;
  --ok:#6fd09c; --ok-soft:#163224; --ghost:#b99ae6; --ghost-soft:#2a2238;
  --sky:#16212d; --ground:#26302a; --rail:#aab4c2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1318; --panel:#181e26; --fg:#e4e8ee; --muted:#97a2b0; --line:#29323d;
  --signal:#f2b33d; --signal-soft:#382b10; --limit:#f08783; --limit-soft:#3a1d1c; --track:#8ab4e0; --track-soft:#1c2a39;
  --ok:#6fd09c; --ok-soft:#163224; --ghost:#b99ae6; --ghost-soft:#2a2238;
  --sky:#16212d; --ground:#26302a; --rail:#aab4c2; color-scheme:dark}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;justify-content:space-between}
h1{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;margin:0;letter-spacing:.01em}
h2{font-family:var(--display);font-weight:600;font-size:25px;line-height:1.1;margin:0;letter-spacing:.01em;text-wrap:balance}
h3{font-size:15px;margin:0;font-weight:600}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)} .note{font-size:13px;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
nav{display:flex;gap:6px;flex-wrap:wrap}
button,.btn{font:inherit;font-size:14px;padding:7px 12px;border-radius:5px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
button[aria-pressed="true"],button.on{border-color:var(--signal);background:var(--signal-soft)}
button.primary{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
button:disabled{opacity:.45;cursor:default}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px 14px}
.card .flag{font-family:var(--mono);font-size:12px;color:var(--muted)}
.lesson-tabs{display:flex;gap:6px;flex-wrap:wrap}
.lesson-tabs button{font-family:var(--display);font-size:17px;font-weight:600;padding:5px 12px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
label.sl{display:flex;justify-content:space-between;gap:8px;font-size:14px}
label.sl b{font-family:var(--mono);font-weight:600}
input[type=range]{width:100%;accent-color:var(--signal)}
.big{font-family:var(--display);font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:19px;color:var(--muted);font-weight:500}
.code{font-family:var(--mono);font-size:13px;background:var(--track-soft);border-radius:6px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}
.rej{border-left:3px solid var(--limit);background:var(--limit-soft);padding:8px 12px;border-radius:0 6px 6px 0;font-size:14px}
.ok{border-left:3px solid var(--ok);background:var(--ok-soft);padding:8px 12px;border-radius:0 6px 6px 0;font-size:14px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:13px}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:none}
/* кабина */
.cab{display:flex;flex-direction:column;gap:10px}
.window{width:100%;aspect-ratio:12/5;min-height:170px;max-height:300px;border-radius:6px 6px 0 0;border:1px solid var(--line);border-bottom:0;background:var(--sky);display:block}
.front{width:100%;aspect-ratio:16/7;min-height:190px;max-height:340px;display:block;border-radius:10px 10px 0 0;border:6px solid #2a323c;border-bottom:0;background:var(--sky)}
.desk{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 118px 150px;gap:12px;background:#232a33;color:#e6ebf1;border-radius:0 0 10px 10px;padding:12px;border:6px solid #2a323c;border-top:0}
@media (max-width:760px){.desk{grid-template-columns:minmax(0,1fr) 110px}.desk .dmi{grid-column:1/-1}.desk .btns{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}}
.dmi{width:100%;height:200px;display:block;border-radius:8px;border:2px solid #3a4552}
.info{display:flex;flex-direction:column;gap:8px;min-width:0;font-size:13px}
.info>div{display:flex;flex-direction:column;background:#1b2129;border-radius:6px;padding:6px 8px;min-width:0}
.info .k{color:#93a0b0;font-size:11px}
.info b{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.info span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:12px;color:#c3ccd7}
.desk .flags .flag-chip{background:#1b2129;color:#c3ccd7}
.desk .flags .flag-chip.gh{background:#2c2440;color:#c9b2ee}
.handle{display:flex;flex-direction:column;align-items:center;gap:6px}
.hlabel{font-size:11px;color:#93a0b0}
.hwrap{display:flex;gap:6px;align-items:stretch;height:190px}
.notches{display:flex;flex-direction:column;justify-content:space-between;font-family:var(--mono);font-size:11px;color:#93a0b0;text-align:right}
.vlever{writing-mode:vertical-lr;direction:rtl;width:42px;height:100%;accent-color:#f2b33d;cursor:grab}
.handle .now{font-family:var(--display);font-size:17px;font-weight:600;text-align:center;min-height:22px}
.btns{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.btns .hw{background:#1b2129;color:#e6ebf1;border:2px solid #4a5563;border-radius:8px;display:flex;gap:8px;align-items:center;justify-content:center;font-weight:600}
.btns .mush{background:#b8322f;color:#fff;border:4px solid #7a1f1d;border-radius:50%;width:92px;height:92px;align-self:center;font-weight:700;font-size:12px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.btns .mush:active{transform:translateY(2px)}
.lamps{display:flex;flex-direction:column;gap:6px;font-size:12px;color:#c3ccd7}
.lampbox{display:flex;gap:6px;align-items:center}
.lamp{display:inline-block;width:12px;height:12px;border-radius:50%;background:#3a4552;border:1px solid #11161c;flex:none}
.lamp.on{background:#f2b33d;box-shadow:0 0 8px #f2b33d}
.lamp.red{background:#f08783;box-shadow:0 0 8px #f08783}
.sep{flex:1}
.stars{font-family:var(--display);font-size:34px;letter-spacing:.08em;color:var(--signal)}
.cab .strip{border:0;border-left:6px solid #2a323c;border-right:6px solid #2a323c;border-radius:0;background:#1b2129}
.drill-card{display:flex;flex-direction:column;gap:10px}
.strip{width:100%;height:34px;display:block;border:1px solid var(--line);border-radius:0 0 6px 6px;background:var(--panel)}
.demo{width:100%;aspect-ratio:12/5;min-height:160px;max-height:280px;border-radius:6px 6px 0 0;border:1px solid var(--line);border-bottom:0;display:block;background:var(--sky)}
.gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:640px){.gauges{grid-template-columns:repeat(2,minmax(0,1fr))}}
.g{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.g .k{font-size:12px;color:var(--muted)}
.g .v{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.g .s{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.speedbar{height:14px;border-radius:3px;background:var(--track-soft);position:relative;overflow:hidden}
.speedbar .fill{position:absolute;inset:0 auto 0 0;background:var(--fg);opacity:.85}
.speedbar .perm{position:absolute;top:0;bottom:0;width:3px;background:var(--limit)}
.speedbar .lim{position:absolute;top:0;bottom:0;width:2px;background:var(--signal)}
.controls{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px}
@media (max-width:640px){.controls{grid-template-columns:1fr}}
.lever{display:flex;flex-direction:column;gap:6px}
.lever .scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-family:var(--mono)}
.lever .now{font-family:var(--display);font-size:22px;font-weight:600}
.flags{display:flex;gap:6px;flex-wrap:wrap}
.flag-chip{font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:3px;background:var(--track-soft);color:var(--muted)}
.flag-chip.hot{background:var(--limit-soft);color:var(--limit);font-weight:600}
.flag-chip.warn{background:var(--signal-soft);color:var(--signal);font-weight:600}
.flag-chip.gh{background:var(--ghost-soft);color:var(--ghost);font-weight:600}
.msg{min-height:22px;font-size:14px}
.chart{width:100%;height:auto;display:block}
svg text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.res-big{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--panel)}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
</style>

<div class="wrap">
<header>
  <div style="display:flex;flex-direction:column;gap:6px">
    <div class="note mono" id="eyebrow"></div>
    <h1 id="h1"></h1>
  </div>
  <div class="row">
    <nav aria-label="sections">
      <button type="button" id="nav-lessons"></button>
      <button type="button" id="nav-drive"></button>
      <button type="button" id="nav-board"></button>
    </nav>
    <button type="button" id="lang" aria-label="Language">EN</button>
  </div>
</header>

<section id="scr-lessons" class="panel">
  <div id="intro" style="display:flex;flex-direction:column;gap:10px"></div>
  <div class="lesson-tabs" id="ltabs"></div>
  <div id="lesson"></div>
</section>

<section id="scr-drive" class="panel" hidden>
  <div id="pick"></div>
  <div id="cab" class="cab" hidden>
    <div id="goalbar" class="ok" hidden></div>
    <div style="position:relative"><canvas id="front" class="front" aria-label="cab front window"></canvas>
      <button type="button" id="viewbtn" style="position:absolute;top:12px;right:12px;font-size:13px;padding:5px 10px;opacity:.92"></button></div>
    <canvas id="strip" class="strip" aria-hidden="true"></canvas>
    <div class="desk">
      <canvas id="dmi" class="dmi" aria-label="speed display"></canvas>
      <div class="info">
        <div><span class="k" id="k-clock"></span><b id="i-clock">10:00:00</b><span id="i-sched"></span></div>
        <div><span class="k" id="k-stop"></span><b id="i-dist">–</b><span id="i-stop"></span></div>
        <div><span class="k" id="k-pred"></span><b id="i-pred">–</b><span id="i-pred2"></span></div>
        <div class="flags" id="flags"></div>
      </div>
      <div class="handle">
        <div class="hlabel" id="k-lever"></div>
        <div class="hwrap">
          <div class="notches" aria-hidden="true"><span id="n-p">+100</span><span>+50</span><span id="n-0">0</span><span>−50</span><span id="n-b">−100</span></div>
          <input type="range" id="lever" class="vlever" min="-1" max="1" step="0.05" value="0" aria-label="controller">
        </div>
        <div class="now" id="lever-now"></div>
      </div>
      <div class="btns">
        <button type="button" id="b-sand" class="hw"><i class="lamp" id="l-sand"></i><span id="t-sand"></span></button>
        <button type="button" id="b-emerg" class="mush"><span id="t-emerg"></span></button>
        <div class="lamps"><span class="lampbox"><i class="lamp" id="l-slip"></i><span id="t-slip"></span></span><span class="lampbox"><i class="lamp" id="l-atp"></i><span id="t-atp"></span></span></div>
      </div>
    </div>
    <div class="msg" id="msg" role="status"></div>
    <div class="ok" id="hint" style="font-size:14px"></div>
    <div class="row">
      <button type="button" id="b-brake"></button><button type="button" id="b-coast"></button><button type="button" id="b-power"></button>
      <span class="sep"></span>
      <button type="button" id="sp-0"></button><button type="button" id="sp-10" class="on">×10</button><button type="button" id="sp-30">×30</button>
      <label class="row note"><input type="checkbox" id="hints" checked> <span id="hints-l"></span></label>
      <button type="button" id="quit"></button>
    </div>
    <div class="note" id="keys"></div>
  </div>
  <div id="result" hidden></div>
</section>

<section id="scr-board" class="panel" hidden>
  <div id="board"></div>
</section>
</div>

<script>// Эпизод «машинист»: симулятор рейса для браузера. Перенос ../sim.py строка в строку (тот же порядок операций),
// мир зерна берётся готовым из Python (DATA.worlds), чтобы генератор и округления совпадали. Тест: parity.mjs.
(function (root) {
  "use strict";
  var G = 9.81, DT = 0.5;
  var P = {
    late_free_s: 30, atp_service_over_kmh: 5, atp_emergency_over_kmh: 15, atp_decel_share: 0.8, stop_window_m: 50,
    sand_k: 1.25, sand_s: 600, slip_k: 0.85, slide_k: 0.7, pusher_cost: 100,
    score: { base: 1000, late_per_s: 2, energy_per_pct: 4, stop_per_m: 5, stop_free_m: 2, atp: 150, emergency: 400, missed_stop: 500, harsh_per_s: 1, harsh_ms2: 1.0 }
  };

  function clock(t) {
    t = Math.floor(t + 0.5);
    var h = 10 + Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
    return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }
  function rej(field, code, ru, en) { return { field: field, code: code, ru: ru, en: en }; }

  function Game(line, train, world) {
    this.L = line; this.T = train; this.W = world;
    this.line_id = line.id;
    this.seg = line.segments.slice().sort(function (a, b) { return a.from_km - b.from_km; });
    this.stations = line.stations.filter(function (s) { return !s.pass; });
    this.tt = line.timetable || null;
    this.t = 0.0; this.x = 1000.0 * this.stations[0].km; this.v = 0.0; this.a = 0.0;
    this.lever = 0.0; this.sand_on = false; this.sand_left = P.sand_s; this.pusher = false;
    this.departed = false; this.stop_idx = 1; this.at_station = true; this.dwell_until = null;
    this.atp = null; this.emerg = false; this.sig_seen = false;
    this.E_in = 0.0; this.E_back = 0.0; this.harsh_s = 0.0;
    this.counts = { atp: 0, emergency: 0, missed_stops: 0, slip_s: 0.0, slide_s: 0.0 };
    this.stops = []; this.journal = []; this.decisions = []; this.slip = false; this.slide = false;
    this.dep_time = (this.tt ? this.tt[0].dep_s : 0) + world.depart_delay_s;
  }
  var GP = Game.prototype;

  GP.at = function (x) {
    var km = x / 1000.0;
    for (var i = 0; i < this.seg.length; i++) { var s = this.seg[i]; if (s.from_km <= km && km < s.to_km) return s; }
    return this.seg[this.seg.length - 1];
  };
  GP.zones = function () {
    var z = [], i;
    for (i = 0; i < this.seg.length; i++) z.push([1000.0 * this.seg[i].from_km, 1000.0 * this.seg[i].to_km, this.seg[i].limit_kmh]);
    for (i = 0; i < this.W.temp.length; i++) z.push([1000.0 * this.W.temp[i].from_km, 1000.0 * this.W.temp[i].to_km, this.W.temp[i].limit_kmh]);
    var sg = this.W.signal;
    if (sg && this.signal_visible()) z.push([1000.0 * sg.km, 1000.0 * (sg.km + sg.length_km), sg.limit_kmh]);
    return z;
  };
  GP.signal_visible = function () {
    var sg = this.W.signal;
    if (!sg) return false;
    if (this.sig_seen) return true;
    var dist = 1000.0 * sg.km - this.x;
    var vt = sg.limit_kmh / 3.6;
    var need = (this.v * this.v - vt * vt) / (2 * this.brake_curve_decel(1000.0 * sg.km)) * 1.3 + 500.0;
    if (dist <= 1000.0 * sg.sight_km || dist <= need) this.sig_seen = true;
    return this.sig_seen;
  };
  GP.limit_now = function () {
    var lo = this.x - this.T.length_m, v = 1e9, z = this.zones();
    for (var i = 0; i < z.length; i++) if (z[i][1] > lo && z[i][0] <= this.x) v = Math.min(v, z[i][2]);
    return v / 3.6;
  };
  GP.brake_curve_decel = function (to_x) {
    if (to_x === undefined || to_x === null) to_x = this.x;
    var gmin = this.at(this.x).grade_permille;
    for (var i = 0; i < this.seg.length; i++) {
      var s = this.seg[i];
      if (1000.0 * s.to_km > this.x && 1000.0 * s.from_km < to_x && s.grade_permille < gmin) gmin = s.grade_permille;
    }
    var d = this.T.brake.service_ms2 * P.atp_decel_share + G * gmin / 1000.0;
    return d > 0.1 ? d : 0.1;
  };
  GP.permitted = function () {
    var lim = this.limit_now(), z = this.zones();
    for (var i = 0; i < z.length; i++) {
      var a = z[i][0], lk = z[i][2];
      if (a > this.x && a - this.x < 25000) {
        var vt = lk / 3.6;
        lim = Math.min(lim, Math.sqrt(vt * vt + 2 * this.brake_curve_decel(a) * (a - this.x)));
      }
    }
    var st = this.next_stop();
    if (st && !this.at_station) {
      var sx = 1000.0 * st.km;
      var dist = sx - this.x + P.stop_window_m;
      lim = Math.min(lim, Math.sqrt(2 * this.brake_curve_decel(sx) * Math.max(0.0, dist)) + 0.5);
    }
    return lim;
  };
  GP.next_stop = function () { return this.stop_idx < this.stations.length ? this.stations[this.stop_idx] : null; };
  GP.due = function () { return !this.departed ? this.dep_time : (this.dwell_until || 0.0); };
  GP.mass = function () { return this.T.mass_t + (this.pusher ? this.T.pusher.mass_t : 0); };
  GP.mu = function (v) {
    var k = this.W.adhesion_factor * (this.sand_on ? P.sand_k : 1.0);
    return (7.5 / (v * 3.6 + 44.0) + 0.161) * k;
  };
  GP.adh_force = function (v) {
    var pw = this.T.mass_t * this.T.powered_share + (this.pusher ? this.T.pusher.mass_t : 0);
    return this.mu(v) * pw * 1000.0 * G;
  };
  GP.tractive_max = function (v) {
    var T = this.T, f0 = T.start_tractive_kN * 1000.0, p = T.power_kW * 1000.0;
    if (this.pusher) { f0 += T.pusher.start_tractive_kN * 1000.0; p += T.pusher.power_kW * 1000.0; }

function brakeToStop(o, g, lever){
  var st = o.next_stop; if (!st || o.at_station) return lever;
  var sv = g.T.brake.service_ms2, gr = 9.81*Math.min(o.grade_permille, 0)/1000, v = o.v_kmh/3.6, dist = st.dist_m;

  if (v < 0.3 && dist > 2) lever = dist > 400 ? 0.6 : 0.35;
  return lever;
}
function mkDriver(coastAhead){
  var cap = 1;
  return function(o, g){
    cap = o.slip ? cap*0.97 : Math.min(1, cap+0.005);
    if (o.at_station) return o.t >= o.due_s ? {lever: cap} : null;
    var tgt = Math.min(o.permitted_kmh - 3, o.limit_kmh - 1), v = o.v_kmh, lever = Math.max(-1, Math.min(cap, (tgt - v)/4));

  };
}

  h += why.length ? '<ul style="margin:0;padding-left:20px;display:grid;gap:6px">'+why.slice(0,4).map(function(w){ return '<li><span style="color:'+(w.d>=0?'var(--ok)':'var(--limit)')+'">'+(w.d>=0?"+":"−")+nf(Math.abs(w.d))+'</span> '+esc(w.t)+'</li>'; }).join("")+'</ul>' : '<p class="muted">'+(U?"Почти поровну по всем частям счёта.":"Nearly even on every part of the score.")+'</p>';
  if (rows) h += '<div class="tbl"><table><thead><tr><th>'+(U?"станция":"station")+'</th><th style="text-align:right">'+(U?"ты к графику":"you vs timetable")+'</th><th style="text-align:right">Extella</th><th style="text-align:right">'+(U?"остановка":"stop")+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  return h;
}
function drawResultChart(g, gh){
  var W = 640, H = 240, Lm = 40, Rm = 10, Tm = 10, Bm = 26, k0 = g.stations[0].km, k1 = g.stations[g.stations.length-1].km, vm = g.T.vmax_kmh + 20;
  var X = function(k){ return Lm + (k-k0)/(k1-k0)*(W-Lm-Rm); }, Y = function(v){ return Tm + (1 - v/vm)*(H-Tm-Bm); };
  var s = '';
  [0, Math.round(vm/2/10)*10, g.T.vmax_kmh].forEach(function(v){ s += '<line x1="'+Lm+'" x2="'+(W-Rm)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(Lm-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'</text>'; });
  var step = (k1-k0) > 150 ? 50 : 20; for (var k = Math.ceil(k0/step)*step; k <= k1; k += step) s += '<text x="'+X(k)+'" y="'+(H-8)+'" text-anchor="middle">'+k+'</text>';
  var segs = g.seg.map(function(z){ return X(z.from_km)+','+Y(z.limit_kmh)+' '+X(z.to_km)+','+Y(z.limit_kmh); }).join(" ");
  s += '<polyline points="'+segs+'" fill="none" stroke="var(--signal)" stroke-width="1.5" stroke-dasharray="4 3"/>';
  RIV.forEach(function(r){ var d = rival(r.key, pick.lid, pick.seed); if (!d) return; s += '<polyline points="'+d.j.map(function(e){ return X(e[1])+','+Y(e[2]); }).join(" ")+'" fill="none" stroke="var('+r.col+')" stroke-width="'+(r.key==="extella"?2:1.5)+'" opacity="'+(r.key==="extella"?1:0.8)+'"/>'; });
  s += '<polyline points="'+g.journal.map(function(e){ return X(e.km)+','+Y(e.v); }).join(" ")+'" fill="none" stroke="var(--fg)" stroke-width="2"/>';
  $("rc").innerHTML = s;
}

/* ---------- лидерборд (общая база страницы) ---------- */
var DB = null, USER = null, rows = null, dbState = "loading";
setTimeout(function(){ if (dbState === "loading") { dbState = "off"; if (screen === "board") renderBoard(); } }, 10000);
(async function(){
  try { if (!window.claude || !window.claude.use) { dbState = "off"; return; } DB = await window.claude.use("db"); USER = await window.claude.use("user"); } catch (e) { DB = null; }
  if (!DB) { dbState = "off"; if (screen === "board") renderBoard(); return; }
  try { DB.collection("scores").onSnapshot(function(snap){ dbState = "on"; rows = snap.docs.map(function(d){ return {id: d.id, data: d.data()}; }); if (screen === "board") renderBoard(); }, function(){ dbState = "off"; if (screen === "board") renderBoard(); }); } catch (e) { dbState = "off"; }
})();
async function offerSave(score, beat, ex){
  if (!DB || !USER) return;
  var me; try { me = await USER.id(); } catch (e) { return; } if (!me) return;
  var b = $("savebtn"); if (!b) return; b.hidden = false;
  b.onclick = async function(){
    b.disabled = true;
    try {
      var ref = DB.collection("scores").doc(me), cur = await ref.get(), data = cur.exists ? cur.data() : {best: {}};
      var best = data.best || {}, prev = best[pick.lid];
      if (!prev || score > prev.score) best[pick.lid] = {score: Math.round(score*10)/10, seed: pick.seed, beat: beat, extella: ex, at: new Date().toISOString(), log: DLOG.slice(0, 20000)};
      await ref.set({best: best});
      $("savemsg").textContent = t("saved");
    } catch (e) { b.disabled = false; $("savemsg").textContent = (LANG==="ru"?"Не записалось: ":"Not saved: ") + (e && e.code || "error"); }
  };
}
async function renderBoard(){
  var el = $("board"), U = LANG === "ru";
  if (dbState === "loading") { el.innerHTML = '<h2>'+t("board_h")+'</h2><p class="muted">'+(U?"Загружаю результаты…":"Loading results…")+'</p>'; return; }
  if (!DB || dbState === "off" || !rows) { el.innerHTML = '<h2>'+t("board_h")+'</h2><p class="muted">'+t("board_off")+'</p>'; return; }
  var ids = rows.map(function(r){ return r.id; }), prof = {};
  try { if (ids.length && USER) prof = await USER.profiles(ids); } catch (e) {}
  var h = '<div style="display:flex;flex-direction:column;gap:14px"><h2>'+t("board_h")+'</h2>';
  if (!rows.length) h += '<p class="muted">'+t("board_empty")+'</p>';
  LIDS.forEach(function(l){
    var list = rows.filter(function(r){ return r.data.best && r.data.best[l]; }).map(function(r){ return {id: r.id, b: r.data.best[l]}; }).sort(function(a,b){ return b.b.score - a.b.score; });
    if (!list.length) return;
    h += '<h3>'+esc(LINE_NAME(l))+'</h3><div class="tbl"><table><thead><tr><th>'+t("name")+'</th><th style="text-align:right">'+t("best")+'</th><th style="text-align:right">Extella</th><th>'+t("vs")+'</th></tr></thead><tbody>';
    list.forEach(function(r){ var nm = (prof[r.id] && prof[r.id].name) || t("someone");
      h += '<tr><td>'+esc(nm)+' <span class="note">· '+(U?"рейс ":"run ")+r.b.seed+'</span></td><td class="n">'+nf(r.b.score)+'</td><td class="n">'+nf(r.b.extella)+'</td><td>'+(r.b.beat?'<span style="color:var(--ok)">'+(U?"обыграл":"beat it")+'</span>':'<span class="muted">'+(U?"нет":"no")+'</span>')+'</td></tr>'; });
    h += '</tbody></table></div>';
  });
  el.innerHTML = h + '</div>';
}
