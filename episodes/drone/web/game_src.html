<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Курьер дронов</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#eef0f3; --panel:#ffffff; --fg:#151a21; --muted:#5a6472; --line:#d6dbe2;
  --signal:#a86f00; --signal-soft:#faf0d8; --limit:#b8322f; --limit-soft:#f8e2e1; --track:#2f5d8a; --track-soft:#e1eaf4;
  --ok:#1f7a4d; --ok-soft:#e1f2e8; --ghost:#7a4fb0; --ghost-soft:#efe7f8;
  --d0:#2f5d8a; --d1:#a86f00; --d2:#1f7a4d; --map-lo:#d9dfcf; --map-hi:#a08a6a; --map-ink:#27303b;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1318; --panel:#181e26; --fg:#e4e8ee; --muted:#97a2b0; --line:#29323d;
  --signal:#f2b33d; --signal-soft:#382b10; --limit:#f08783; --limit-soft:#3a1d1c; --track:#8ab4e0; --track-soft:#1c2a39;
  --ok:#6fd09c; --ok-soft:#163224; --ghost:#b99ae6; --ghost-soft:#2a2238;
  --d0:#8ab4e0; --d1:#f2b33d; --d2:#6fd09c; --map-lo:#1d2620; --map-hi:#4a3f31; --map-ink:#e4e8ee; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1318; --panel:#181e26; --fg:#e4e8ee; --muted:#97a2b0; --line:#29323d;
  --signal:#f2b33d; --signal-soft:#382b10; --limit:#f08783; --limit-soft:#3a1d1c; --track:#8ab4e0; --track-soft:#1c2a39;
  --ok:#6fd09c; --ok-soft:#163224; --ghost:#b99ae6; --ghost-soft:#2a2238;
  --d0:#8ab4e0; --d1:#f2b33d; --d2:#6fd09c; --map-lo:#1d2620; --map-hi:#4a3f31; --map-ink:#e4e8ee; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;justify-content:space-between}
h1{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;margin:0;letter-spacing:.01em}
h2{font-family:var(--display);font-weight:600;font-size:25px;line-height:1.1;margin:0;letter-spacing:.01em;text-wrap:balance}
h3{font-size:15px;margin:0;font-weight:600}
p{margin:0;max-width:72ch}
.muted{color:var(--muted)} .note{font-size:13px;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
select{max-width:100%;text-overflow:ellipsis}
button,select{font:inherit;font-size:14px;padding:7px 12px;border-radius:5px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
button[aria-pressed="true"]{border-color:var(--signal);background:var(--signal-soft)}
button.primary{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
button:disabled{opacity:.45;cursor:default}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px 14px}
.card b{font-family:var(--display);font-size:22px;font-weight:600}
.card .flag{font-family:var(--mono);font-size:12px;color:var(--muted)}
.code{font-family:var(--mono);font-size:13px;background:var(--track-soft);border-radius:6px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;margin:0}
.rej{border-left:3px solid var(--limit);background:var(--limit-soft);padding:8px 12px;border-radius:0 6px 6px 0;font-size:14px}
/* внутри пульта свои цвета: светлая плашка на тёмной панели делала текст нечитаемым */
.console .rej{background:#3a1b1a;color:#ffd9d6;border-left-color:#f08783}
.console .warn{background:#3a2e14;color:#ffe8bd;border-left-color:#f2b33d}
.console #msg .rej{margin-top:8px;animation:rejIn .18s ease-out}
@keyframes rejIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.console .order[disabled]{opacity:.45;cursor:not-allowed}
/* длинные разделы свёрнуты: страница не простыня, раскрывает тот, кому надо */
.fold summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fold summary::-webkit-details-marker{display:none}
.fold summary h2{margin:0}
.fold summary::before{content:"+";font-weight:700;opacity:.65;width:14px;display:inline-block}
.fold[open] summary::before{content:"\2212"}
.fold summary:hover h2{text-decoration:underline}
.foldHint{font-size:13px;opacity:.7}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:12px 0 16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;border-radius:8px 8px 0 0;white-space:nowrap;color:var(--muted);font-weight:600;border-bottom:2px solid transparent}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--signal);background:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:0 0 16px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:20px;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted);line-height:1.35}
.tile.plus b{color:var(--ok)} .tile.minus b{color:var(--limit)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:4px 16px;margin:0 0 12px;padding:0;list-style:none}
.facts li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dotted var(--line);padding:5px 0;font-size:14px}
.facts li span{color:var(--muted);text-align:right}
@media (max-width:560px){.facts li{flex-direction:column;gap:2px}.facts li span{text-align:left}}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:0 0 16px}
.step{border:1px solid var(--line);border-radius:10px;padding:12px}
.step .flag{display:block;margin-bottom:6px}
.step b{display:block;margin-bottom:4px}
.step p{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.fold[open] .foldHint{display:none}
.ok{border-left:3px solid var(--ok);background:var(--ok-soft);padding:8px 12px;border-radius:0 6px 6px 0;font-size:14px}
.warn{border-left:3px solid var(--signal);background:var(--signal-soft);padding:8px 12px;border-radius:0 6px 6px 0;font-size:14px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:13px}
td.n,th.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr.me td{background:var(--signal-soft);font-weight:600}
tr.gh td:first-child{color:var(--ghost);font-weight:600}
.big{font-family:var(--display);font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stars{font-family:var(--display);font-size:40px;letter-spacing:.08em;color:var(--signal);line-height:1}
.stars .off{color:var(--line)}
.big small{font-size:19px;color:var(--muted);font-weight:500}
/* игра */
.game{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr);grid-template-areas:"map side" "info side";gap:14px;align-items:start}
.gmap{grid-area:map}.side{grid-area:side}.ginfo{grid-area:info}
@media (max-width:860px){.game{grid-template-columns:1fr;grid-template-areas:"map" "side" "info"}}
.mapbox{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
#mapTip{position:absolute;pointer-events:none;max-width:260px;padding:8px 10px;border-radius:8px;font-size:13px;line-height:1.4;background:rgba(16,20,26,.94);color:#eef2f7;border:1px solid rgba(255,255,255,.14);box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:3}
#mapTip b{color:#fff}
canvas.map{display:block;width:100%;height:auto;touch-action:manipulation}
.topbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.clock{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:3px;background:var(--track-soft);color:var(--muted);white-space:nowrap}
.chip.hot{background:var(--limit-soft);color:var(--limit);font-weight:600}
.chip.gh{background:var(--ghost-soft);color:var(--ghost);font-weight:600}
.chip.okc{background:var(--ok-soft);color:var(--ok);font-weight:600}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.drones{display:grid;grid-template-columns:1fr;gap:6px}
.drone{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);text-align:left;width:100%}
.drone.sel{border-color:var(--signal);background:var(--signal-soft)}
.drone .num{width:26px;height:26px;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px;grid-row:span 2}
.drone .st{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drone .sub{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;border-radius:4px;background:var(--track-soft);overflow:hidden;width:80px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.low{background:var(--limit)} .bar i.mid{background:var(--signal)}
.orders{display:flex;flex-direction:column;gap:4px;max-height:300px;overflow:auto}
.order{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);text-align:left;width:100%;font-size:14px}
.order.pick{border-color:var(--signal);background:var(--signal-soft)}
.order .tag{font-family:var(--mono);font-size:12px;color:var(--muted)}
.order .due{font-family:var(--mono);font-size:12px;white-space:nowrap}
.order .due.late{color:var(--limit);font-weight:600}
.order:disabled{opacity:1;cursor:default}
.est{font-size:14px}
.est b{font-family:var(--mono)}
.log{font-family:var(--mono);font-size:12px;color:var(--muted);max-height:180px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.hint{font-size:14px;border:1px dashed var(--line);border-radius:6px;padding:8px 10px}
details summary{cursor:pointer;font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}

/* ---------- Пульт диспетчера: экран смены выглядит как железо ---------- */
.console{
  --c-ink:#e3eaf2; --c-dim:#8d99a8; --screen:#0c1015; --led:#ffb13d; --led-g:#5ad28e; --led-r:#ff6f61;
  background:linear-gradient(#222933,#171d25 55%,#121720);
  border:1px solid #090c10; border-radius:12px; color:var(--c-ink);
  box-shadow:inset 0 1px 0 #3b4552, 0 14px 30px rgba(0,0,0,.38); padding:14px; gap:12px;
}
.console{position:relative}
.console::before, .console::after{content:""; position:absolute; width:7px; height:7px; border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #5d6876, #2a323c 60%, #141a21);
  box-shadow:0 1px 0 #3f4a58, inset 0 -1px 1px rgba(0,0,0,.6); pointer-events:none}
.console::before{left:7px; top:7px; box-shadow:0 1px 0 #3f4a58, inset 0 -1px 1px rgba(0,0,0,.6),
  calc(100% + 14px) 0 0 #2a323c}
.console::after{right:7px; bottom:7px; box-shadow:0 1px 0 #3f4a58, inset 0 -1px 1px rgba(0,0,0,.6),
  calc(-100% - 14px) 0 0 #2a323c}
.console h3, .console .eng{color:var(--c-dim); font-family:var(--display); font-size:12px; font-weight:600;
  letter-spacing:.12em; text-transform:uppercase}
.console .note{color:var(--c-dim)}
.console .topbar{align-items:center; border-bottom:1px solid #0a0e13; box-shadow:0 1px 0 #333d49; padding-bottom:10px}
.console .clock{font-family:var(--mono); font-size:30px; font-weight:600; letter-spacing:.04em; color:#ffd79a;
  text-shadow:0 0 14px rgba(255,177,61,.45); background:var(--screen); border:1px solid #000; border-radius:6px;
  padding:3px 12px; box-shadow:inset 0 0 20px rgba(0,0,0,.85)}
/* клавиши */
.console button, .console select{font-family:var(--display); letter-spacing:.08em; text-transform:uppercase;
  font-size:12px; font-weight:600; color:var(--c-ink); border:1px solid #090c10; border-radius:7px;
  background:linear-gradient(#2c343f,#1e242c); box-shadow:inset 0 1px 0 #47525f, 0 2px 0 #090c10, 0 3px 7px rgba(0,0,0,.35);
  padding:9px 13px}
.console select{text-transform:none; font-family:var(--mono); letter-spacing:0; padding:7px 10px}
.console button:hover{border-color:#5b6775}
.console button:active{transform:translateY(1px); box-shadow:inset 0 2px 5px rgba(0,0,0,.55)}
.console button[aria-pressed="true"], .console button[aria-checked="true"]{
  background:linear-gradient(#3b2a11,#2a1d0b); border-color:#7a5416; color:#ffd79a;
  box-shadow:inset 0 0 0 1px #8a5f1a, 0 0 14px rgba(255,177,61,.28), 0 2px 0 #090c10}
.console button.primary{background:linear-gradient(#8e2b22,#6a1c16); border-color:#3d0f0b; color:#ffe6e2;
  box-shadow:inset 0 1px 0 #c2574a, 0 2px 0 #2a0a07, 0 0 18px rgba(255,110,90,.25); font-size:13px; padding:11px 18px}
.console button.primary:hover{background:linear-gradient(#a3342a,#7a241c)}
.console button:disabled{opacity:.4}
/* приборная рейка */
.rail{display:flex; flex-wrap:wrap; gap:10px; align-items:stretch}
.gauge{background:var(--screen); border:1px solid #000; border-radius:9px; padding:8px 10px;
  box-shadow:inset 0 0 22px rgba(0,0,0,.8); display:flex; gap:9px; align-items:center; min-width:0}
.gauge .lbl{display:block; color:var(--c-dim); font-family:var(--display); font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; margin-bottom:1px}
.gauge .val{display:block; font-family:var(--mono); font-size:19px; font-weight:600; color:#cfe3ff; line-height:1.15}
.gauge .val .sub{display:inline; font-size:12px}
.gauge .val.amber{color:#ffd79a} .gauge .val.green{color:#9ef0c0} .gauge .val.red{color:#ffb1a8}
.gauge .sub{display:block; font-family:var(--mono); font-size:11px; color:var(--c-dim)}
.gauge > div{min-width:0}
.gauge svg{display:block; flex:none}
.console .chips{display:none}
/* отсеки дронов */
.console .drone{background:linear-gradient(#262e38,#1b212a); border:1px solid #0a0e13; border-radius:9px;
  box-shadow:inset 0 1px 0 #3f4a58, 0 2px 6px rgba(0,0,0,.3)}
.console .drone.sel{border-color:#8a5f1a; box-shadow:inset 0 0 0 1px #8a5f1a, 0 0 16px rgba(255,177,61,.2)}
.console .drone .num{position:relative; box-shadow:inset 0 0 0 1px rgba(255,255,255,.25); font-family:var(--display); letter-spacing:.04em}
.console .drone[data-mode] .num::after{content:""; position:absolute; right:-3px; bottom:-3px; width:7px; height:7px;
  border-radius:50%; border:1px solid #0a0e13}
.console .drone[data-mode="dock"] .num::after{background:#5ad28e; box-shadow:0 0 7px #5ad28e}
.console .drone[data-mode="air"] .num::after{background:#ffb13d; box-shadow:0 0 7px #ffb13d}
.console .drone[data-mode="pad"] .num::after{background:#8ab4e0; box-shadow:0 0 7px #8ab4e0}
.console .drone[data-mode="forced"] .num::after, .console .drone[data-mode="lost"] .num::after{background:#ff6f61; box-shadow:0 0 8px #ff6f61}
.console .drone .st{font-family:var(--display); letter-spacing:.06em; text-transform:uppercase; font-size:12px}
.console .drone .sub{font-family:var(--mono); font-size:11px; color:var(--c-dim)}
.console .bar{background:#080b0e; border:1px solid #000; border-radius:3px; overflow:hidden; box-shadow:inset 0 1px 3px rgba(0,0,0,.8)}
.console .bar i{background:linear-gradient(90deg,#3fc47f,#9ef0c0);
  -webkit-mask:repeating-linear-gradient(90deg,#000 0 5px,transparent 5px 7px);
  mask:repeating-linear-gradient(90deg,#000 0 5px,transparent 5px 7px)}
.console .bar i.mid{background:linear-gradient(90deg,#e09a2c,#ffd79a)}
.console .bar i.low{background:linear-gradient(90deg,#d6564a,#ffb1a8)}
/* рычаг высоты */
.lever{background:var(--screen); border:1px solid #000; border-radius:9px; padding:6px; display:grid; gap:4px;
  box-shadow:inset 0 0 22px rgba(0,0,0,.8)}
.lever button{padding:7px 10px; font-family:var(--mono); letter-spacing:0; text-transform:none; font-size:13px;
  text-align:left; display:flex; justify-content:space-between; gap:8px; align-items:center}
.lever button::after{content:""; width:16px; height:4px; border-radius:2px; background:#2a323c; flex:none}
.lever button[aria-checked="true"]::after{background:#ffb13d; box-shadow:0 0 8px rgba(255,177,61,.8)}
/* сегментный переключатель площадок */
.seg{display:flex; flex-wrap:wrap; gap:4px; background:var(--screen); border:1px solid #000; border-radius:9px;
  padding:5px; box-shadow:inset 0 0 22px rgba(0,0,0,.8)}
.seg button{padding:6px 9px; font-family:var(--mono); letter-spacing:0; text-transform:none; font-size:12px}
.deskrow{display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap}
.deskcol{display:flex; flex-direction:column; gap:5px; min-width:0}
/* экраны: карта, оценка, журнал */
.console .mapbox{position:relative; border:1px solid #000; border-radius:10px; background:var(--screen); padding:6px;
  box-shadow:inset 0 0 26px rgba(0,0,0,.75), 0 1px 0 #39424e}
.console .mapbox::after{content:""; position:absolute; inset:6px; border-radius:6px; pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);
  box-shadow:inset 0 0 70px rgba(0,0,0,.5)}
.console .map{filter:saturate(1.08) contrast(1.04)}
.console .est, .console .log, .console .hint{background:var(--screen); border:1px solid #000; border-radius:9px;
  box-shadow:inset 0 0 20px rgba(0,0,0,.75); color:var(--c-ink)}
.console .est{font-family:var(--mono); padding:9px 11px}
.console .hint{padding:9px 11px; font-size:13px; color:#c6d2e0}
.console .log{padding:8px 10px}
.console #sendBox{background:linear-gradient(#232b35,#1a2029); border:1px solid #0a0e13;
  box-shadow:inset 0 1px 0 #3f4a58, 0 2px 8px rgba(0,0,0,.3); border-radius:10px}
.console .order{background:linear-gradient(#262e38,#1b212a); border:1px solid #0a0e13; color:var(--c-ink);
  text-transform:none; font-family:var(--sans); letter-spacing:0; font-weight:400}
.console .order.pick{border-color:#8a5f1a; box-shadow:inset 0 0 0 1px #8a5f1a}
.console .order .tag{color:var(--c-dim); font-family:var(--mono)}
.console .legend{color:var(--c-dim)}
@keyframes alarmPulse{0%{box-shadow:inset 0 0 0 2px rgba(255,111,97,.9), inset 0 0 60px rgba(255,111,97,.35), 0 14px 30px rgba(0,0,0,.38)}
  100%{box-shadow:inset 0 1px 0 #3b4552, 0 14px 30px rgba(0,0,0,.38)}}
.console.alarm{animation:alarmPulse .9s ease-out}
@media (prefers-reduced-motion: reduce){.console.alarm{animation:none}}

<div class="wrap">
<header>
  <div style="display:flex;flex-direction:column;gap:6px">
    <div class="note mono" id="eyebrow"></div>
    <h1 id="h1"></h1>
    <p id="sitedef" class="note" hidden style="max-width:760px;margin:6px 0 0"></p>
  </div>
  <div class="row">
    <button id="langBtn" type="button"></button>
  </div>
</header>

<section class="panel" id="intro">
  <p id="introP"></p>
  <p class="note" id="introN"></p>
</section>

<details class="panel fold" id="drills" open>
  <summary><h2 id="drH"></h2><span class="foldHint" id="drHint"></span></summary>
  <p class="note" id="drN"></p>
  <div class="grid3" id="drillCards"></div>
</details>

<!-- выбор смены -->
<section class="panel" id="pick">
  <h2 id="pickH"></h2>
  <div class="grid3" id="cities"></div>
  <div class="row">
    <label class="note" for="daySel" id="dayL"></label>
    <select id="daySel"></select>
    <span class="note" id="dayInfo"></span>
  </div>
  <div class="warn" id="noflyNote" hidden></div>
  <div class="tbl"><table id="rivalsT"></table></div>
  <div class="row">
    <button class="primary" id="startBtn" type="button"></button>
    <button id="watchBtn" type="button"></button>
  </div>
</section>

<!-- смена -->
<section id="play" hidden>
  <div class="panel console">
    <div class="topbar">
      <div class="row" style="gap:14px;align-items:baseline">
        <div class="clock" id="clock">13:00:00</div>
        <div class="note" id="where"></div>
      </div>
      <div class="row" id="speeds"></div>
      <button type="button" id="sndBtn" aria-pressed="false"></button>
    </div>
    <div class="chips" id="stats"></div>
    <div class="rail" id="rail"></div>
    <div class="warn" id="drillGoal" hidden></div>
    <div class="game">
      <div class="gmap" style="display:flex;flex-direction:column;gap:8px;min-width:0">
        <div class="mapbox"><canvas class="map" id="map" width="900" height="700"></canvas><div id="mapTip" hidden></div></div>
        <div class="legend" id="legend"></div>
        <div class="row">
          <label class="note" for="ghostSel" id="ghostL"></label>
          <select id="ghostSel"></select>
          <span class="chip gh" id="ghostInfo" hidden></span>
        </div>
      </div>
      <div class="side">
        <div class="hint" id="hint"></div>
        <div>
          <h3 id="dronesH"></h3>
          <div class="drones" id="drones"></div>
        </div>
        <div>
          <h3 id="ordersH"></h3>
          <div class="orders" id="orders"></div>
        </div>
        <div class="panel" id="sendBox" style="padding:12px">
          <div class="deskrow">
            <div class="deskcol">
              <span class="eng" id="altL"></span>
              <div class="lever" id="altLever" role="radiogroup" aria-labelledby="altL"></div>
              <label class="sr-only" for="altSel" id="altLsr"></label>
              <select id="altSel" class="sr-only"><option>30</option><option selected>60</option><option>100</option><option>120</option></select>
            </div>
            <div class="deskcol">
              <span class="eng" id="speedL"></span>
              <div class="row">
                <button type="button" id="ecoBtn" aria-pressed="true"></button>
                <button type="button" id="fastBtn" aria-pressed="false"></button>
              </div>
              <span class="eng" id="padL0"></span>
              <div class="seg" id="padSeg0" role="radiogroup" aria-labelledby="padL0"></div>
              <label class="sr-only" for="padSel0" id="padL0sr"></label>
              <select id="padSel0" class="sr-only"></select>
              <span class="eng" id="padL"></span>
              <div class="seg" id="padSeg" role="radiogroup" aria-labelledby="padL"></div>
              <label class="sr-only" for="padSel" id="padLsr"></label>
              <select id="padSel" class="sr-only"></select>
            </div>
          </div>
          <div class="est" id="est"></div>
          <div class="row">
            <button class="primary" type="button" id="sendBtn"></button>
            <button type="button" id="clearBtn"></button>
          </div>
          <div id="msg"></div>
        </div>
      </div>
      <div class="ginfo" style="display:flex;flex-direction:column;gap:8px;min-width:0">
        <details open>
          <summary id="fcH"></summary>
          <div class="tbl"><table id="fcT"></table></div>
        </details>
        <h3 id="logH"></h3>
        <div class="log" id="log"></div>
      </div>
    </div>
  </div>
</section>

<!-- итог -->
<section class="panel" id="drillRes" hidden>
  <h2 id="drResH"></h2>
  <div class="stars" id="drStars"></div>
  <p id="drResT"></p>
  <div id="drResA"></div>
  <div class="row">
    <button type="button" id="drAgain"></button>
    <button class="primary" type="button" id="drNext"></button>
    <button type="button" id="drToShift"></button>
  </div>
</section>

<section class="panel" id="result" hidden>
  <h2 id="resH"></h2>
  <div class="big" id="resScore"></div>
  <div class="tbl"><table id="resParts"></table></div>
  <h3 id="resCmpH"></h3>
  <div class="tbl"><table id="resCmp"></table></div>
  <div id="resWhy"></div>
  <div class="row">
    <button class="primary" type="button" id="againBtn"></button>
    <button type="button" id="otherBtn"></button>
  </div>
</section>

<section class="panel" id="ref">
  <h2 id="refH"></h2>
  <p class="note" id="refN"></p>
  <div class="tabs" role="tablist" id="refTabs">
    <button type="button" role="tab" data-t="rules" id="tabRules" aria-selected="true"></button>
    <button type="button" role="tab" data-t="how" id="tabHow" aria-selected="false"></button>
    <button type="button" role="tab" data-t="src" id="tabSrc" aria-selected="false"></button>
  </div>
  <div class="pane" id="rulesB" role="tabpanel"></div>
  <div class="pane" id="howB" role="tabpanel" hidden></div>
  <div class="pane note" id="srcB" role="tabpanel" hidden></div>
</section>
</div>

var trail = [[], [], []], trailT = -1;

var speed = 30, paused = true, lastTs = 0, acc = 0, pauseOnNew = true, seenOrders = 0;
var selDrone = 0, picked = [], spd = "eco";
var logLines = [], lastEv = 0;
var terrainImg = {}, view = null;

function world(key) {
  var W = JSON.parse(JSON.stringify(DATA.worlds[key]));
  W.map.terrain = DATA.terrain[W.city];

}
function key() { return city + "_" + seed; }
function gameWorld() {
  var W = world(key());

}

  h += "<h3>" + tr("Дрон", "The drone") + "</h3>";
  h += '<ul class="facts">' +
    "<li>" + tr("пустой", "empty") + "<span>65 " + tr("кг", "kg") + "</span></li>" +
    "<li>" + tr("груз", "load") + "<span>" + tr("до 40 кг", "up to 40 kg") + "</span></li>" +
    "<li>" + tr("батарея", "battery") + "<span>3 969 " + tr("Вт·ч", "Wh") + "</span></li>" +

function avgs() {
  var A = {};
  Object.keys(DATA.rivals).forEach(function (k) {
    var c = k.split("_")[0], R = DATA.rivals[k];
    RIVALS.forEach(function (w) { A[w] = A[w] || {}; (A[w][c] = A[w][c] || []).push(R[w].score); });
  });

function setGhost(w) {
  ghostWho = w; GH = null; ghI = 0;

    while (GH.t < G.t) ghStep(R);
  }
  var o = '<option value="">' + tr("никто", "nobody") + "</option>";

function ghStep(R) {
  var n = Math.round(GH.t);
  while (ghI < R.decisions.length && R.decisions[ghI][0] <= n) { GH.decide(R.decisions[ghI][1]); ghI++; }
  if (!GH.done()) GH.step();
}

  if ($("pnBtn")) $("pnBtn").onclick = function () { pauseOnNew = !pauseOnNew; speedUI(); };
}

/* ---------- след дрона ---------- */
function trailStep() {
  if (G.t - trailT < 10 && trailT >= 0) return;      // точка раз в 10 секунд смены
  trailT = G.t;
  for (var k = 0; k < G.drones.length; k++) {
    var d = G.drones[k];
    if (d.mode !== "air") continue;
    var w = G.wind(d.alt), prev = trail[k][trail[k].length - 1];
    var sp = Math.sqrt(w[0] * w[0] + w[1] * w[1]);
    // Сам ветер за смену почти не поворачивает (в данных ERA5 это 4 смены из 30, и на слабом ветре),
    // а меняется он относительно курса: туда попутный, обратно встречный. Метку ставим на это.
    var same = prev && prev.t > G.t - 60;
    var dx = same ? d.x - prev.x : 0, dy = same ? d.y - prev.y : 0, dist = Math.sqrt(dx * dx + dy * dy);
    var along = dist > 1 ? (w[0] * dx + w[1] * dy) / dist : 0;   // + попутный, - встречный
    // сравниваем с последним ненулевым: на выгрузке дрон висит, и там along = 0
    var last = same ? (Math.abs(along) > 0.8 ? prev.lastAlong : prev.lastAlong) : 0;
    var mark = "";
    if (same && last > 0.8 && along < -0.8) mark = "head";        // попутный сменился встречным
    else if (same && last < -0.8 && along > 0.8) mark = "tail";   // и наоборот
    else if (same && prev.soc >= 0.2 && d.soc < 0.2) mark = "low";      // заряд перешёл 20 %
    trail[k].push({ x: d.x, y: d.y, soc: d.soc, t: G.t, u: w[0], v: w[1], sp: sp,
                    along: along, lastAlong: Math.abs(along) > 0.8 ? along : (same ? prev.lastAlong : 0),
                    gs: d.gs || 0, turn: mark !== "", mark: mark });
    if (trail[k].length > 900) trail[k].shift();
  }
}

/* ---------- шаг ---------- */
function oneStep() {
  if (watch) {
    var R = DATA.rivals[key()][watch];
    while (wI < R.decisions.length && R.decisions[wI][0] <= steps) { G.decide(R.decisions[wI][1]); wI++; }
  }
  G.step(); steps++;
  trailStep();
  if (GH) ghStep(DATA.rivals[key()][ghostWho]);
  var ev = G.events;
  for (; lastEv < ev.length; lastEv++) evLog(ev[lastEv]);
  var vis = 0;
  for (var i = 0; i < G.orders.length; i++) if (G.orders[i].t <= G.t) vis++;
  if (vis > seenOrders) {
    for (var j = seenOrders; j < vis; j++) {
      var o = G.orders[j], p = G.pts[o.point];
      addLog(S.clock(G.t) + " " + tr("новый заказ ", "new order ") + o.id + ": " + (LANG === "ru" ? p.ru : p.en) + ", " + nf(o.kg, 1) + tr(" кг", " kg"));
    }
    seenOrders = vis;
    if (pauseOnNew && !watch) { paused = true; speedUI(); return false; }
  }
  return true;
}
function evLog(e) {
  var t = S.clock(e[0]), d = tr("дрон ", "drone ") + (e[2] + 1), s = "";
  if (e[1] === "takeoff") s = d + tr(" взлетел", " took off");
  else if (e[1] === "deliver") s = d + tr(" доставил заказ ", " delivered order ") + e[3];
  else if (e[1] === "pad") s = d + tr(" сел на площадку ", " landed on pad ") + ptName(e[3]);
  else if (e[1] === "dock") { s = d + tr(" вернулся на склад с зарядом ", " is back at the depot with ") + nf(G.drones[e[2]].soc * 100) + " %"; retSoc[e[2]] = G.drones[e[2]].soc; }
  else if (e[1] === "forced") s = d + tr(": вынужденная посадка, −250", ": forced landing, −250");
  else if (e[1] === "lost") s = d + tr(": потерян, −600", ": lost, −600");
  addLog(t + " " + s, e[1] === "forced" || e[1] === "lost");
}
function ptName(id) { var p = G.pts[id]; return LANG === "ru" ? p.ru : p.en; }
function addLog(s, bad) { logLines.unshift([s, bad]); if (logLines.length > 60) logLines.pop(); }

function loop(ts) {
  if (!lastTs) lastTs = ts;
  var dt = Math.min(0.1, (ts - lastTs) / 1000); lastTs = ts;
  if (G && !paused && !$("play").hidden) {
    acc += dt * speed;
    var n = 0;
    while (acc >= 1 && n < 400) {
      acc -= 1; n++;
      if (isDone()) break;
      if (!oneStep()) { acc = 0; break; }
    }
    if (isDone()) { finish(); }
    render();
  } else acc = 0;
  requestAnimationFrame(loop);
}

/* ---------- оценка рейса по прогнозу ---------- */
function estimate(route, alt, sp) {
  var D = S.D, hr = G.hour(), cap = D.battery_wh * hr.cap, va = S.SPEEDS[sp];
  var wv = G.wind(alt, false), out = [];
  [1.0, 1.18].forEach(function (k) {
    var u = wv[0] * k, v = wv[1] * k, soc = 1.0, minSoc = 1.0, tsec = 0, load = route.filter(function (t) { return t[0] === "o"; }).map(function (t) { return G.orders[+t.slice(1)].kg; });
    var kg = load.reduce(function (a, b) { return a + b; }, 0), stuck = false, padSoc = [];
    var pts = [G.M.depot].concat(route.map(function (t) { return G.target(t); })).concat([G.M.depot]);
    function ph(z) { var m = D.empty_kg + kg; return D.hover_c * m * Math.sqrt(Math.sqrt(m)) * G.dens(z); }
    function use(P, s) { soc -= P * s / 3600 / cap; tsec += s; }
    use(ph(G.M.depot.z + alt / 2) * D.climb_k, alt / D.climb_ms);
    for (var i = 0; i < pts.length - 1; i++) {
      var a = pts[i], b = pts[i + 1], dx = b.x - a.x, dy = b.y - a.y, dist = Math.sqrt(dx * dx + dy * dy);
      var ex = dist ? dx / dist : 0, ey = dist ? dy / dist : 0, wa = u * ex + v * ey, wc = -u * ey + v * ex;
      var gs = wc * wc < va * va ? Math.sqrt(va * va - wc * wc) + wa : wa;
      var z = (a.z + b.z) / 2 + alt, uu = va / 15;
      if (gs <= 0.3) { stuck = true; break; }
      use(ph(z) * (1 + S.CRUISE_A * uu + S.CRUISE_B * uu * uu), dist / gs);
      var tok = i + 1 < pts.length - 1 ? route[i] : "depot";
      if (tok === "depot" || tok[0] === "p") {
        use(ph(b.z + alt / 2) * D.descend_k, alt / D.climb_ms);
        minSoc = Math.min(minSoc, soc);
        if (tok[0] === "p") { padSoc.push(soc); soc = 1.0; use(ph(b.z + alt / 2) * D.climb_k, alt / D.climb_ms); tsec += D.swap_pad_s; }
      } else {
        var dd = alt - 20;
        use(ph(b.z + 20 + dd / 2) * D.descend_k, dd / D.climb_ms);
        use(ph(b.z + 20), D.service_s);
        kg -= G.orders[+tok.slice(1)].kg;
        use(ph(b.z + 20 + dd / 2) * D.climb_k, dd / D.climb_ms);
        minSoc = Math.min(minSoc, soc);
      }
    }
    out.push({ soc: Math.min(minSoc, soc), stuck: stuck, min: tsec / 60 });
  });
  return out;
}

function roseSvg(u, v) {

  if (sp >= 0.5) { from = Math.atan2(-u, -v) * 180 / Math.PI; if (from < 0) from += 360; }

      '" y2="' + (26 - 22 * c).toFixed(1) + '" stroke="#3b4653" stroke-width="' + (k % 3 === 0 ? 2 : 1) + '"/>';

  [[0, -14], [14, 0], [0, 14], [-14, 0]].forEach(function (d, i) {
    dirs += '<text x="' + (26 + d[0]) + '" y="' + (26 + d[1] + 3.5) + '" fill="#6d7a8a" font-size="8" font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle">' + let4[i] + "</text>";
