<style>
:root{--ink:#1f2a33;--soft:#5b6873;--card:rgba(255,254,250,.88);--line:rgba(31,42,51,.10);--gold:#C57E33;--mono:"JetBrains Mono",ui-monospace,monospace;--ok:#2f8a55;--bad:#c0473a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font:400 15px/1.5 "DM Sans",system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#cfe7f3 0%,#e8f1e2 60%,#e3edd6 100%)}
button,textarea{font-family:inherit}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ui{position:fixed;z-index:5}
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(31,42,51,.10)}
.panel{left:16px;top:16px;bottom:16px;width:min(380px,calc(100% - 32px));padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.brand a{font-weight:700;font-size:14px;color:var(--ink);text-decoration:none}.brand a b{color:var(--gold)}
h1{font-size:26px;line-height:1.1;margin:2px 0 4px;letter-spacing:-.01em}
.sub{margin:0;color:var(--soft);font-size:13.5px}
.levels{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 11px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .mini{color:#e8a43a;font-size:11px}.chip.on .mini{color:#ffd36b}
.story{margin:0;font-size:14px}
.goals{margin:0;padding-left:18px;font-size:13px;color:var(--soft)}
.label{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--soft);display:flex;justify-content:space-between;align-items:center}
.label button{font:500 12px "DM Sans",sans-serif;text-transform:none;letter-spacing:0;border:0;background:none;color:var(--gold);cursor:pointer;padding:0}
textarea{width:100%;min-height:118px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fffdf8;color:var(--ink);font:400 13px/1.65 var(--mono)}
textarea:focus{outline:2px solid #f2c14e;outline-offset:1px}
.help{font-size:12.5px;color:var(--soft);background:rgba(242,193,78,.12);border-radius:10px;padding:8px 10px}
.help code{font:400 12px var(--mono);color:var(--ink)}
.problems{font-size:13px;color:var(--bad);background:rgba(192,71,58,.08);border-radius:10px;padding:8px 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.p{background:#3fbf73;border-color:#36ad66;color:#fff;font-size:15px;padding:11px 18px;box-shadow:0 4px 0 #2e9a5a}
.btn.p:active{transform:translateY(2px);box-shadow:0 2px 0 #2e9a5a}
.btn[disabled]{opacity:.65;cursor:default}
.budget{font:600 12px var(--mono);color:var(--ink);text-transform:none;letter-spacing:0}
.crosses{display:flex;gap:6px;flex-wrap:wrap}
.cx{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:#fff;font:700 15px "DM Sans",sans-serif;cursor:pointer;display:grid;place-items:center;position:relative;color:var(--ink)}
.cx small{position:absolute;bottom:2px;font:600 9px var(--mono);color:var(--soft)}
.cx.light{background:#eafaf0;border-color:#3fbf73}.cx.stop{background:#fff0ee;border-color:#e57565}.cx.main{background:#fff7dc;border-color:#e8b93a}
.cx.on{box-shadow:0 0 0 3px var(--ink)}
.cx.jam{animation:jam 1s infinite}
@keyframes jam{50%{transform:scale(1.08);background:#ffd9d3}}
.cross-card{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff;display:grid;gap:8px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card-head .fine{font-size:12px;color:var(--soft);text-align:right}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts:empty{display:none}
.opt{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.opt.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt[disabled]{opacity:.4;cursor:not-allowed}
.toggle{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:#3fbf73}
.toggle.amb{background:#fff1f1;border:1px solid #f3c3c3;border-radius:12px;padding:8px 10px;font-weight:600}
.adv summary{cursor:pointer;font-size:13px;color:var(--soft)}
.hintText{font-size:13px;background:#fff7dc;border-radius:10px;padding:8px 10px;margin:0}
.live{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.live div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 8px;text-align:center}
.live b{display:block;font-size:20px;line-height:1.1}
.live span{font-size:11px;color:var(--soft)}
.clock{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.clock i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3fd17a,#f2c14e,#ff7a59);border-radius:99px}
.result{background:#fffdf3;border:1px solid rgba(242,193,78,.6);border-radius:14px;padding:12px}
.result h3{margin:0 0 4px;font-size:16px}
.stars{font-size:30px;letter-spacing:4px;color:#d9d3c4;line-height:1}
.stars .on{color:#f2b53a;text-shadow:0 2px 0 #d48f17}
.result p{margin:4px 0 0;font-size:13px}
.verdict{font-size:13px;margin-top:8px!important;padding:8px 10px;border-radius:10px;background:rgba(63,191,115,.10)}
.verdict.bad{background:rgba(192,71,58,.08);color:var(--bad)}
.verdict .mono{font:400 11.5px var(--mono);color:var(--soft);display:block;margin-top:4px}
table.m{width:100%;border-collapse:collapse;font-size:14px}
table.m th,table.m td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.m th{font:600 11px var(--mono);color:var(--soft);text-transform:uppercase;letter-spacing:.06em}
table.m td.r{font:400 12px/1.5 var(--mono);color:var(--soft);white-space:pre-wrap}
table.m .st{color:#f2b53a;letter-spacing:1px}
table.m button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
.tools{top:16px;right:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.seg{display:inline-flex;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:2px}
.seg button{border:0;background:transparent;color:var(--soft);padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.how{inset:0;display:grid;place-items:center;background:rgba(20,30,40,.35);padding:16px}
.how[hidden]{display:none}
.how .card{max-width:560px;padding:22px 24px;max-height:calc(100% - 32px);overflow:auto}
.how h2{margin:0 0 10px}
.btn.why{background:#fff7dc;border-color:#f2c14e}
.toast{left:50%;transform:translateX(-50%);bottom:24px;padding:10px 16px;font-size:14px}
.toast[hidden]{display:none}
[hidden]{display:none!important}
@media (max-width:760px){
  .panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:52%;padding:12px;gap:8px}
  h1{font-size:20px}.sub{display:none}
  .tools{top:8px;right:8px;left:8px;justify-content:flex-end}
  textarea{min-height:84px}
}

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
// ---- traffic_core.js
// The "traffic" language and its handler: a little city of crossings, simulated step by step.
// The player decides what stands at every crossing and how the lights work; the handler checks it and runs rush hour.
// Deterministic: the same rules on the same level give the same day, car by car (seeded random, fixed step).
//
//   # a comment
//   A: light, north-south 12, east-west 8   a traffic light with a fixed plan, green to each street in seconds
//   A: light, longest queue, min 5, max 25  a light that gives green to the street with the longer queue
//   A: light, offset 4                      the light starts its plan 4 s later (green waves)
//   B: main north-south                     no light: the north-south street has the right of way
//   C: stop                                 no light: everyone stops, then goes in the order they came
//   D: box                                  a box junction: nobody drives in unless they can drive out
//   ambulance first                         lights turn green for an ambulance; signs let it through
// A city has only so many traffic lights. Russian words work too: «светофор», «главная север-юг», «стоп»,
// «вафельная разметка», «пропускать скорую», «самая длинная очередь», «сдвиг», «все».

const DT = 0.1;
const CAR = 1.9;
const VMAX = 7.5;
const ACC = 5.5, BRAKE = 11;
const SPACING = 15;
const BOX = 2.7;
const YELLOW = 2;
const MIN_GREEN = 3, MAX_GREEN = 40, MAX_CYCLE = 70;
const AMB_SEE = 30;          // a light sees an ambulance this far away
const HEADINGS = { N: [0, -1], S: [0, 1], E: [1, 0], W: [-1, 0] };
const AXIS = { N: "ns", S: "ns", E: "ew", W: "ew" };
const LEFT = { N: "W", W: "S", S: "E", E: "N" }, RIGHT = { N: "E", E: "S", S: "W", W: "N" };

const LEVELS = {
  district: {
    name: ["Our district", "Наш район"],
    story: ["Six crossings and only two traffic lights. Right now every crossing is a stop: everyone stops and waits their turn, and the district stands.", "Шесть перекрёстков и всего два светофора. Сейчас на каждом перекрёстке «стоп»: все останавливаются и ждут очереди, и район стоит."],
    hint: ["Put the two lights where the most cars cross. On the others, give one street the right of way. And look where cars drive into a crossing and get stuck in it.", "Поставь два светофора туда, где больше всего машин. На остальных дай одной улице главную. И посмотри, где машины въезжают на перекрёсток и застревают на нём."],
    cols: 3, rows: 2, seconds: 150, seed: 41, lights: 2,
    start: {},
    flows: { W: 0.42, E: 0.34, N: 0.2, S: 0.2 },
    turns: { straight: 0.7, right: 0.17, left: 0.13 },
    ambulances: [],
    goals: { delivered: 270, wait: 17, stuck: 140 },
    ducks: [{ at: 70, link: "B" + "S" }],
  },
  ambulance: {
    name: ["The ambulance", "Скорая"],
    story: ["Nine crossings, three lights. Every forty seconds an ambulance drives in from the west and has to cross the whole city along the middle street.", "Девять перекрёстков, три светофора. Каждые сорок секунд с запада въезжает скорая, и ей надо пересечь весь город по средней улице."],
    hint: ["The ambulance drives straight along the middle row: D, E, F. Let it through, and keep that street moving even when no ambulance is in sight.", "Скорая едет прямо по среднему ряду: D, E, F. Пропускай её и держи эту улицу свободной, даже когда скорой не видно."],
    cols: 3, rows: 3, seconds: 160, seed: 53, lights: 3,
    start: { A: "light", C: "light", I: "light" },
    flows: { W: 0.3, E: 0.26, N: 0.2, S: 0.2 },
    turns: { straight: 0.7, right: 0.17, left: 0.13 },
    ambulances: [{ at: 20, gate: "W1" }, { at: 60, gate: "W1" }, { at: 100, gate: "W1" }, { at: 140, gate: "W1" }],
    goals: { delivered: 330, wait: 15, ambulance: 14 },
    ducks: [],
  },
  gridlock: {
    name: ["The jam of the century", "Пробка века"],
    story: ["Twelve crossings, four lights, Friday evening. Drivers drive into every crossing they can and block it for everyone else. Untangle the city.", "Двенадцать перекрёстков, четыре светофора, вечер пятницы. Водители въезжают на любой перекрёсток и запирают его для всех остальных. Распутай город."],
    hint: ["A box junction stops cars from driving into a crossing they cannot leave. Start with the crossings where everything stands, then think about the lights.", "Вафельная разметка не даёт въехать на перекрёсток, с которого не выехать. Начни с перекрёстков, где стоит всё, а потом думай о светофорах."],
    cols: 4, rows: 3, seconds: 170, seed: 67, lights: 4,
    start: { F: "light", G: "light" },
    flows: { W: 0.26, E: 0.26, N: 0.2, S: 0.2 },
    burst: { from: 50, to: 110, gates: ["N1", "N2"], rate: 0.25 },
    turns: { straight: 0.66, right: 0.18, left: 0.16 },
    ambulances: [{ at: 40, gate: "W1" }, { at: 120, gate: "N2" }],
    goals: { delivered: 390, wait: 15, ambulance: 30 },
    ducks: [{ at: 90, link: "J" + "E" }],
  },
};

// ---------------------------------------------------------------- random numbers every device draws the same way
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rnd1 = x => Math.floor(x * 10 + 0.5) / 10;
const rnd0 = x => Math.floor(x + 0.5);

// ---------------------------------------------------------------- the language
const crossNames = level => {
  const out = [];
  for (let j = 0; j < level.rows; j++) for (let i = 0; i < level.cols; i++) out.push(String.fromCharCode(65 + j * level.cols + i));
  return out;
};
const lightNames = crossNames;
const W_NS = ["north-south", "ns", "север-юг", "сю"], W_EW = ["east-west", "ew", "запад-восток", "восток-запад", "зв"];
const W_LONGEST = ["longest queue", "самая длинная очередь", "длинная очередь"];
const W_LIGHT = ["light", "светофор"], W_STOP = ["stop", "стоп"];
const W_MAIN = ["main", "главная"];
const W_BOX = ["box", "вафля", "вафельная разметка"], W_NOBOX = ["no box", "без вафли", "без разметки"];
const W_AMB = ["ambulance first", "пропускать скорую", "скорая первая"];
const PLAN_KEYS = ["ns", "ew", "longest", "min", "max", "offset"];
const isNum = s => /^-?[0-9]{1,4}$/.test(s);

function defaultCross() { return { type: "stop", mode: "fixed", ns: 15, ew: 15, min: 5, max: 25, offset: 0, box: false }; }

function parse(text, level) {
  const names = crossNames(level);
  const cross = {}, problems = [];
  for (const n of names) cross[n] = Object.assign(defaultCross(), { type: (level.start || {})[n] || "stop" });
  let ambulanceFirst = false;
  String(text || "").split("\n").forEach((raw, i) => {
    const line = raw.split("#")[0].trim().toLowerCase();
    if (!line) return;
    const at = line.indexOf(":");
    if (at < 0) {
      if (W_AMB.includes(line.split(" ").filter(Boolean).join(" "))) { ambulanceFirst = true; return; }
      problems.push(`line ${i + 1}: a rule is "<crossing>: <what stands there>", for example "A: light, north-south 12, east-west 8", or "ambulance first"`);
      return;
    }
    const who = line.slice(0, at).trim(), what = line.slice(at + 1).trim();
    const everyone = who === "all" || who === "все";
    const targets = everyone ? names : names.filter(n => n.toLowerCase() === who);
    if (!targets.length) { problems.push(`line ${i + 1}: there is no crossing "${who.toUpperCase()}" here; the crossings are ${names.join(", ")}`); return; }
    const parts = what.split(",").map(s => s.trim()).filter(Boolean);
    const upd = {};
    let bad = null;
    for (const p of parts) {
      const words = p.split(" ").filter(Boolean), joined = words.join(" ");
      if (W_LIGHT.includes(joined)) { upd.type = "light"; continue; }
      if (W_STOP.includes(joined)) { upd.type = "stop"; continue; }
      if (W_BOX.includes(joined)) { upd.box = true; continue; }
      if (W_NOBOX.includes(joined)) { upd.box = false; continue; }
      if (W_LONGEST.includes(joined)) { upd.mode = "longest"; upd.longest = true; continue; }
      if (W_MAIN.includes(words[0]) && words.length > 1) {
        const rest = words.slice(1).join(" ");
        if (W_NS.includes(rest)) { upd.type = "main-ns"; continue; }
        if (W_EW.includes(rest)) { upd.type = "main-ew"; continue; }
        bad = `"${p}": the main street is north-south or east-west`; break;
      }
      const last = words[words.length - 1], head = words.slice(0, -1).join(" ");
      if (!isNum(last)) { bad = `"${p}" is not something a crossing can have; use light, main north-south, main east-west, stop, box, or a plan for a light`; break; }
      const num = parseInt(last, 10);
      if (W_NS.includes(head) || W_EW.includes(head)) {
        if (num < MIN_GREEN) { bad = `green for ${num} s is too short: a car needs ${MIN_GREEN} s just to start`; break; }
        if (num > MAX_GREEN) { bad = `green for ${num} s is too long: the other street would wait more than ${MAX_GREEN} s`; break; }
        upd[W_NS.includes(head) ? "ns" : "ew"] = num; upd.mode = upd.mode || "fixed"; continue;
      }
      if (head === "offset" || head === "сдвиг") { if (num < 0 || num > 60) { bad = `offset ${num} s: an offset is between 0 and 60 s`; break; } upd.offset = num; continue; }
      if (head === "min" || head === "мин") { if (num < MIN_GREEN || num > MAX_GREEN) { bad = `min ${num} s: it must be between ${MIN_GREEN} and ${MAX_GREEN}`; break; } upd.min = num; continue; }
      if (head === "max" || head === "макс") { if (num < MIN_GREEN || num > MAX_GREEN) { bad = `max ${num} s: it must be between ${MIN_GREEN} and ${MAX_GREEN}`; break; } upd.max = num; continue; }
      bad = `"${p}" is not something a crossing can have; use light, main north-south, main east-west, stop, box, or a plan for a light`; break;
    }
    if (bad) { problems.push(`line ${i + 1}: ${bad}`); return; }
    if ((upd.ns === undefined) !== (upd.ew === undefined)) {
      problems.push(`line ${i + 1}: a plan gives green to both streets; "${upd.ns === undefined ? "north-south" : "east-west"}" is missing, and that street would never move`); return;
    }
    const hasPlan = PLAN_KEYS.some(k => upd[k] !== undefined);
    for (const n of targets) {
      const c = cross[n];
      const type = upd.type || c.type;
      if (hasPlan && type !== "light") { problems.push(`line ${i + 1}: crossing ${n} has no traffic light, so it cannot have a plan of greens; write "${n}: light, ..."`); return; }
      for (const k of ["type", "mode", "ns", "ew", "min", "max", "offset", "box"]) if (upd[k] !== undefined) c[k] = upd[k];
      if (upd.ns !== undefined && !upd.longest) c.mode = "fixed";
      if (c.min > c.max) { problems.push(`line ${i + 1}: min ${c.min} s is longer than max ${c.max} s`); return; }
      if (c.type === "light" && c.mode === "fixed" && c.ns + c.ew + 2 * YELLOW > MAX_CYCLE) { problems.push(`line ${i + 1}: a cycle of ${c.ns + c.ew + 2 * YELLOW} s at ${n} is longer than ${MAX_CYCLE} s; walkers would wait too long`); return; }
    }
  });
  const lit = names.filter(n => cross[n].type === "light");
  if (lit.length > level.lights) problems.push(`the city has only ${level.lights} traffic lights, but the rules put lights on ${lit.length} crossings: ${lit.join(", ")}`);
  return { cross, ambulanceFirst, problems };
}

// the rules written out from a city plan (what the buttons write)
function writeRules(level, cross, ambulanceFirst) {
  const lines = ["# " + "the rules of the city"];
  for (const n of crossNames(level)) {
    const c = cross[n], parts = [];
    if (c.type === "light") {
      parts.push("light");
      if (c.mode === "longest") parts.push("longest queue", "min " + c.min, "max " + c.max);
      else parts.push("north-south " + c.ns, "east-west " + c.ew);
      if (c.offset) parts.push("offset " + c.offset);
    } else if (c.type === "main-ns") parts.push("main north-south");
    else if (c.type === "main-ew") parts.push("main east-west");
    else parts.push("stop");
    if (c.box) parts.push("box");
    lines.push(n + ": " + parts.join(", "));
  }
  if (ambulanceFirst) lines.push("ambulance first");
  return lines.join("\n") + "\n";
}

// ---------------------------------------------------------------- the city: crossings, links, gates
function buildCity(level) {
  const nodes = [], links = {}, gates = [];
  const names = crossNames(level);
  for (let j = 0; j < level.rows; j++) for (let i = 0; i < level.cols; i++) nodes.push({ i, j, name: names[j * level.cols + i], x: i * SPACING, z: j * SPACING });
  const node = (i, j) => nodes.find(n => n.i === i && n.j === j);
  const len = SPACING - 2 * BOX, stub = SPACING - BOX;
  for (const n of nodes) {
    for (const h of "NSEW") {
      const [dx, dz] = HEADINGS[h];
      const nb = node(n.i + dx, n.j + dz);
      links[`${n.name}${h}`] = { id: `${n.name}${h}`, h, from: n.name, to: nb ? nb.name : null, x0: n.x + dx * BOX, z0: n.z + dz * BOX, len: nb ? len : stub, cars: [], gate: false, queue: 0 };
      const back = { N: "S", S: "N", E: "W", W: "E" }[h];
      const [bx, bz] = HEADINGS[back];
      if (!node(n.i + bx, n.j + bz)) {
        const gid = { S: "N" + n.i, N: "S" + n.i, E: "W" + n.j, W: "E" + n.j }[h];
        const id = `in-${n.name}${h}`;
        links[id] = { id, h, from: null, to: n.name, x0: n.x + bx * SPACING, z0: n.z + bz * SPACING, len: stub, cars: [], gate: true, gateId: gid, queue: 0 };
        gates.push({ id: gid, link: id, side: gid[0] });
      }
    }
  }
  return { nodes, links, gates, names };
}
const linkPoint = (lk, s) => {
  const [dx, dz] = HEADINGS[lk.h];
  return { x: lk.x0 + dx * s - dz * 1.15, z: lk.z0 + dz * s + dx * 1.15 };
};

// ---------------------------------------------------------------- one rush hour
function simulate(levelKey, rulesText, opts = {}) {
  const level = LEVELS[levelKey];
  const { cross, ambulanceFirst, problems } = parse(rulesText, level);
  if (problems.length) return { problems };
  const city = buildCity(level);
  const R = rng(level.seed), V = rng(level.seed + 999);
  const linkList = Object.values(city.links);
  const nodes = {};
  for (const n of city.nodes) {
    const c = cross[n.name];
    Object.assign(n, { cfg: c, phase: "ns", yellow: 0, t: -c.offset, green: c.mode === "fixed" ? c.ns : c.min, box: [] });
    nodes[n.name] = n;
  }
  const inLinks = {};
  for (const n of city.nodes) inLinks[n.name] = { N: null, S: null, E: null, W: null };
  for (const lk of linkList) if (lk.to && !inLinks[lk.to][lk.h]) inLinks[lk.to][lk.h] = lk;
  const cars = [];
  let nextId = 1, t = 0;
  const stats = { delivered: 0, spawned: 0, waitSum: 0, tripSum: 0, maxQueue: 0, gateWaiting: 0, honks: 0, doors: 0 };
  const pending = Object.fromEntries(city.gates.map(g => [g.id, []]));
  const ambPending = Object.fromEntries(city.gates.map(g => [g.id, []]));
  const ambs = (level.ambulances || []).map(a => ({ at: a.at, gate: a.gate, done: false, car: null }));
  const ducks = (level.ducks || []).map(d => ({ at: d.at, link: d.link, until: d.at + 4.5 }));
  const record = opts.record !== false;
  const COLORS = ["#ef8a6f", "#f2c14e", "#7cc4a0", "#7fb2e5", "#c39be0", "#f39fb5", "#5fc6c9", "#ffb36b"];
  const steps = Math.floor(level.seconds / DT + 0.5);
  const frames = [];

  const queueAt = (n, axis) => {
    let q = 0;
    for (const h of axis === "ns" ? "NS" : "EW") {
      const lk = inLinks[n.name][h];
      if (lk) for (const c of lk.cars) if (c.v < 0.5 && lk.len - c.s < 14) q++;
    }
    return q;
  };
  const roomAt = lk => !lk.cars.length || lk.cars[lk.cars.length - 1].s > CAR * 1.15;
  const ambAxis = n => {
    for (const h of "NSEW") {
      const lk = inLinks[n.name][h];
      if (!lk) continue;
      for (const c of lk.cars) if (c.amb && lk.len - c.s < AMB_SEE) return AXIS[h];
    }
    return null;
  };
  const canEnter = (n, c, h, outLk) => {
    for (const b of n.box) { if (b.from === h) return false; if (AXIS[b.from] !== AXIS[h]) return false; }
    if (n.cfg.box && !roomAt(outLk)) return false;
    const amb = c.amb && ambulanceFirst;
    const type = n.cfg.type;
    if (type === "light") return amb || (!n.yellow && n.phase === AXIS[h]);
    if (amb) return true;
    if (type === "main-ns" || type === "main-ew") {
      const main = type === "main-ns" ? "ns" : "ew";
      if (AXIS[h] === main) return true;
      for (const mh of main === "ns" ? "NS" : "EW") {
        const lk = inLinks[n.name][mh];
        if (!lk || !lk.cars.length) continue;
        const f = lk.cars[0];
        if (lk.len - f.s < 7 && (f.v > 0.5 || lk.len - f.s < 1.2)) return false;
      }
      return true;
    }
    // stop: stop first, then go in the order of arrival
    if (c.arrive < 0) return false;
    for (const hh of "NSEW") {
      const lk = inLinks[n.name][hh];
      if (!lk || !lk.cars.length || lk.cars[0] === c) continue;
      const f = lk.cars[0];
      if (f.arrive >= 0 && f.arrive < c.arrive) return false;
    }
    return n.box.length === 0;
  };

  for (let step = 0; step < steps; step++) {
    t = step * DT;
    // traffic lights
    for (const n of city.nodes) {
      const p = n.cfg;
      if (p.type !== "light") continue;
      n.t += DT;
      if (n.t < 0) continue;
      if (n.yellow > 0) {
        n.yellow -= DT;
        if (n.yellow <= 1e-9) { n.yellow = 0; n.phase = n.phase === "ns" ? "ew" : "ns"; n.t = 0; n.green = p.mode === "fixed" ? p[n.phase] : p.min; }
        continue;
      }
      const amb = ambulanceFirst ? ambAxis(n) : null;
      if (amb) { if (n.phase !== amb) n.yellow = YELLOW; continue; }
      if (p.mode === "fixed") { if (n.t >= n.green - 1e-9) n.yellow = YELLOW; }
      else {
        const mine = queueAt(n, n.phase), other = queueAt(n, n.phase === "ns" ? "ew" : "ns");
        if (n.t >= p.max - 1e-9 || (n.t >= p.min - 1e-9 && other > mine)) n.yellow = YELLOW;
      }
    }
    // ambulances get called
    for (const a of ambs) if (!a.called && t >= a.at) { a.called = true; ambPending[a.gate].push(a); }
    // gates
    for (const g of city.gates) {
      let rate = level.flows[g.side] || 0;
      if (level.burst && t >= level.burst.from && t < level.burst.to && level.burst.gates.includes(g.id)) rate += level.burst.rate;
      if (R() < rate * DT) pending[g.id].push(t);
      const lk = city.links[g.link];
      if (roomAt(lk) && !(lk.cars.length && lk.cars[lk.cars.length - 1].s < CAR * 1.6)) {
        if (ambPending[g.id].length) {
          const a = ambPending[g.id].shift();
          const c = { id: nextId++, link: lk.id, s: 0, v: VMAX * 0.7, born: a.at, wait: t - a.at, color: "#ffffff", kind: "amb", amb: true, box: null, still: 0, turn: null, gone: -1, arrive: -1 };
          a.car = c; lk.cars.push(c); cars.push(c);
        } else if (pending[g.id].length) {
          const wanted = pending[g.id].shift();
          const color = COLORS[Math.floor(R() * COLORS.length)];
          const kind = R() < 0.12 ? "van" : (R() < 0.1 ? "bus" : "car");
          const c = { id: nextId++, link: lk.id, s: 0, v: VMAX * 0.7, born: wanted, wait: t - wanted, color, kind, amb: false, box: null, still: 0, turn: null, gone: -1, arrive: -1 };
          lk.cars.push(c); cars.push(c); stats.spawned++;
        }
      }
      stats.gateWaiting += pending[g.id].length * DT;
    }
    // cars on links
    for (const lk of linkList) {
      const n = lk.to ? nodes[lk.to] : null;
      let k = 0;
      while (k < lk.cars.length) {
        const c = lk.cars[k];
        let gap = 1e9;
        if (k > 0) gap = lk.cars[k - 1].s - c.s - CAR;
        for (const d of ducks) if (d.link === lk.id && t >= d.at && t < d.until && c.s < lk.len * 0.5) gap = Math.min(gap, lk.len * 0.5 - 1.2 - c.s);
        const toEnd = lk.len - c.s;
        if (n) {
          if (!c.turn) {
            if (c.amb) c.turn = "straight";
            else { const r = R(), tr = level.turns; c.turn = r < tr.straight ? "straight" : (r < tr.straight + tr.right ? "right" : "left"); }
          }
          const out = c.turn === "straight" ? lk.h : (c.turn === "right" ? RIGHT[lk.h] : LEFT[lk.h]);
          if (k === 0 && c.arrive < 0 && toEnd < 0.6 && c.v < 0.3) c.arrive = t;
          const may = k === 0 && canEnter(n, c, lk.h, city.links[n.name + out]);
          if (!may) gap = Math.min(gap, toEnd - 0.15);
          if (may && toEnd < 0.35) {
            lk.cars.shift();
            c.box = { node: n.name, from: lk.h, to: out, turn: c.turn, p: 0, dur: c.turn === "left" ? 1.3 : (c.turn === "right" ? 0.75 : 0.95) };
            n.box.push(c.box); c.link = null; c.turn = null; c.arrive = -1;
            continue;
          }
        } else if (toEnd <= 0) {
          lk.cars.shift();
          c.gone = t;
          if (!c.amb) { stats.delivered++; stats.tripSum += t - c.born; stats.waitSum += c.wait; }
          continue;
        }
        const target = Math.max(0, Math.min(VMAX, (gap - 0.25) * 1.9));
        c.v += Math.max(-BRAKE * DT, Math.min(ACC * DT, target - c.v));
        if (c.v < 0) c.v = 0;
        c.s += c.v * DT;
        if (c.v < 0.4) { c.wait += DT; c.still += DT; } else c.still = 0;
        k++;
      }
    }
    // cars inside crossings: they leave only when there is room behind the crossing
    for (const n of city.nodes) {
      let k = 0;
      while (k < n.box.length) {
        const b = n.box[k];
        if (b.p < 1) b.p = Math.min(1, b.p + DT / b.dur);
        const lk = city.links[n.name + b.to];
        if (b.p >= 1 && roomAt(lk)) {
          let c = null;
          for (const x of cars) if (x.box === b) { c = x; break; }
          n.box.splice(k, 1);
          c.box = null; c.link = lk.id; c.s = 0.05; c.v = Math.max(c.v, 3);
          lk.cars.push(c);
          lk.cars.sort((a, b2) => b2.s - a.s);
          continue;
        }
        if (b.p >= 1) { const c = cars.find(x => x.box === b); c.wait += DT; c.still += DT; c.v = 0; }
        k++;
      }
    }
    for (const lk of linkList) {
      if (!lk.to) continue;
      let q = 0;
      for (const c of lk.cars) if (c.v < 0.5) q++;
      if (lk.gate) q += pending[lk.gateId].length;
      lk.queue = q;
      if (q > stats.maxQueue) stats.maxQueue = q;
    }
    if (record && step % 2 === 0) {
      for (const c of cars) {
        if (c.gone >= 0 || c.amb) continue;
        if (c.still > 3 && !c.honked && V() < 0.02) { c.honked = t; stats.honks++; }
        if (c.still > 9 && !c.door && c.link) { c.door = t; stats.doors++; }
        if ((c.still < 0.5 || !c.link) && c.door && t - c.door > 2) c.door = 0;
        if (c.honked && t - c.honked > 1.2) c.honked = 0;
      }
      frames.push(snapshot(t, city, cars, nodes, ducks, cross));
    }
  }
  let leftWait = 0, left = 0;
  for (const c of cars) if (c.gone < 0 && !c.amb) { leftWait += c.wait; left++; }
  for (const g of city.gates) for (const w of pending[g.id]) { leftWait += t - w; left++; }
  let ambSum = 0, ambN = 0, ambWorst = 0;
  for (const a of ambs) {
    const time = a.car && a.car.gone >= 0 ? a.car.gone - a.at : t - a.at;
    if (a.at < t) { ambSum += time; ambN++; if (time > ambWorst) ambWorst = time; }
  }
  const delivered = stats.delivered;
  const result = {
    delivered, spawned: stats.spawned,
    avgWait: delivered + left ? rnd1((stats.waitSum + leftWait) / (delivered + left)) : 0,
    stuck: left,
    avgTrip: delivered ? rnd1(stats.tripSum / delivered) : 0,
    maxQueue: stats.maxQueue, gateWait: rnd0(stats.gateWaiting),
    ambulances: ambN, ambulance: ambN ? rnd1(ambSum / ambN) : 0, ambulanceWorst: rnd1(ambWorst),
    honks: stats.honks, doors: stats.doors,
  };
  result.stars = stars(level, result);
  result.sha = fingerprint(result);
  return { problems: [], result, frames, city, cross, ambulanceFirst };
}

function stars(level, r) {
  const g = level.goals;
  return (r.delivered >= g.delivered ? 1 : 0) + (r.avgWait <= g.wait ? 1 : 0) + (level.ambulances && level.ambulances.length ? (r.ambulance <= g.ambulance ? 1 : 0) : (r.stuck <= g.stuck ? 1 : 0));
}

function snapshot(t, city, cars, nodes, ducks, cross) {
  const out = { t, cars: [], lights: {}, ducks: [], delivered: 0, standing: 0 };
  for (const c of cars) {
    if (c.gone >= 0) { if (!c.amb) out.delivered++; continue; }
    let x, z, h;
    if (c.link) {
      const lk = city.links[c.link];
      const p = linkPoint(lk, c.s); x = p.x; z = p.z; h = lk.h;
      if (c.v < 0.5) out.standing++;
    } else if (c.box) {
      const n = nodes[c.box.node];
      const a = HEADINGS[c.box.from], b = HEADINGS[c.box.to];
      const start = { x: n.x - a[0] * BOX - a[1] * 1.15, z: n.z - a[1] * BOX + a[0] * 1.15 };
      const end = { x: n.x + b[0] * BOX - b[1] * 1.15, z: n.z + b[1] * BOX + b[0] * 1.15 };
      const p = c.box.p, span = (Math.abs(end.x - start.x) + Math.abs(end.z - start.z)) * 0.5;
      const ctrl = c.box.turn === "straight" ? { x: (start.x + end.x) / 2, z: (start.z + end.z) / 2 } : { x: start.x + a[0] * span, z: start.z + a[1] * span };
      x = (1 - p) * (1 - p) * start.x + 2 * (1 - p) * p * ctrl.x + p * p * end.x;
      z = (1 - p) * (1 - p) * start.z + 2 * (1 - p) * p * ctrl.z + p * p * end.z;
      h = p < 0.5 ? c.box.from : c.box.to;
      if (p >= 1) out.standing++;
    } else continue;
    out.cars.push({ id: c.id, x: +x.toFixed(2), z: +z.toFixed(2), h, v: +c.v.toFixed(2), color: c.color, kind: c.kind, door: c.door ? 1 : 0, honk: c.honked ? 1 : 0, box: c.box ? { from: c.box.from, to: c.box.to, p: +c.box.p.toFixed(2) } : null });
  }
  for (const n of city.nodes) {
    const q = h => { const lk = Object.values(city.links).find(l => l.to === n.name && l.h === h); return lk ? (lk.queue || 0) : 0; };
    out.lights[n.name] = { type: cross[n.name].type, phase: n.phase, yellow: n.yellow > 0, q: { N: q("N"), S: q("S"), E: q("E"), W: q("W") }, jam: n.box.some(b => b.p >= 1) };
  }
  for (const d of ducks) if (t >= d.at && t < d.until) out.ducks.push({ link: d.link, p: (t - d.at) / (d.until - d.at) });
  return out;
}

function fingerprint(r) {
  const s = [r.delivered, r.spawned, r.avgWait, r.avgTrip, r.maxQueue, r.gateWait, r.ambulance, r.stuck].join("|");
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  return (h >>> 0).toString(16).padStart(8, "0");
}

// ---- app.js

// ---------------------------------------------------------------- words
const T = {
  title: ["Rush hour", "Час пик"],
  sub: ["The city is jammed. Decide what stands at every crossing and get everyone home.", "Город стоит в пробках. Реши, что стоит на каждом перекрёстке, и развези всех по домам."],
  city: ["Your city", "Твой город"], budget: ["lights: {u} of {n}", "светофоров: {u} из {n}"],

  how_body: ["<p><b>Extella</b> is an environment where software is written as short rules in small languages, and a handler checks those rules and carries them out. Usually that means dull things: reconciling invoices, checking contracts, running a machine on a shop floor. We wanted to show the same idea in a way you can touch in a minute.</p><p>Here, your choices — a light, a main road, a stop, a box junction, letting the ambulance through — are a program in a small language called <b>traffic</b>. Open «Rules as text» and you will see it. The handler checks the program first: it will not accept a one-second green or one light too many, and it tells you why in words. Then it runs rush hour by your rules, car by car.</p><p>The same rules always give the same day. So Extella's server can replay your rush hour with its own handler and confirm the result: only confirmed results enter the table of mayors. We compared the browser and the server on 450 sets of rules, from mistakes to whole city plans: not a single difference.</p><p>The same approach works for the rules of a warehouse, an accounting team or a machine: rules short enough for the people who run the process, a strict check before anything runs, and the same result wherever it runs.</p>",

function loadRules(key) {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("l") === key && h.get("r")) { try { return decodeURIComponent(escape(atob(h.get("r").replace(/-/g, "+").replace(/_/g, "/")))); } catch (e) {} }
  try { return localStorage.getItem("traffic_rules_" + key); } catch (e) { return null; }
}
function start(real = true) {
  const text = $("rules").value;
  const out = simulate(levelKey, text);
  if (out.problems.length) {
    const box = $("problems"); box.hidden = false;
    box.innerHTML = "<b>" + esc(t("problems")) + "</b><br>" + out.problems.slice(0, 4).map(esc).join("<br>");
    return;
  }
  $("problems").hidden = true;
  for (const [, g] of cars) carGroup.remove(g); cars.clear();
  run = { frames: out.frames, result: out.result, time: 0, real, done: false };
  $("result").hidden = true;
  if (real) { $("runBtn").disabled = true; $("runBtn").textContent = t("running"); $("runBtn").classList.add("p"); saveRules(); }
}
function finish() {
  run.done = true;
  if (!run.real) { run.time = 0; return; }   // the preview loops
  const r = run.result;
  $("runBtn").disabled = false; $("runBtn").textContent = t("again"); $("runBtn").classList.remove("p");   // one main action: now it is "confirm"
  $("stars").innerHTML = [0, 1, 2].map(i => `<span class="${i < r.stars ? "on" : ""}">★</span>`).join("");
  $("rLine").textContent = t("r_line", { d: r.delivered, w: r.avgWait, q: r.maxQueue }) + ((level.ambulances || []).length ? " · " + t("r_amb", { a: r.ambulance }) : "");
  $("rMore").textContent = t("r_more", { h: r.honks, o: r.doors }) + (r.stars === 3 ? " · " + t("stars3") : (r.stars === 0 ? " · " + t("stars0") : ""));
  $("result").hidden = false; $("verdict").hidden = true;
  $("result").scrollIntoView({ behavior: "smooth", block: "nearest" });
  try { const best = +(localStorage.getItem("traffic_best_" + levelKey) || 0); if (r.stars > best) localStorage.setItem("traffic_best_" + levelKey, r.stars); } catch (e) {}
  drawLevels();
}
function shareLink() {
  const enc = btoa(unescape(encodeURIComponent($("rules").value))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  return location.origin + location.pathname + "#l=" + levelKey + "&r=" + enc;
}

// ---------------------------------------------------------------- the server: the same rules, replayed by the handler on a device
const API = "/api/blocks/traffic/";
const SESSION = (() => { try { let s = localStorage.getItem("traffic_session"); if (!s) { s = "m" + Math.random().toString(36).slice(2, 12); localStorage.setItem("traffic_session", s); } return s; } catch (e) { return "anon"; } })();
const ADJ = [["Brave", "Смелый"], ["Calm", "Спокойный"], ["Clever", "Хитрый"], ["Sleepy", "Сонный"], ["Rosy", "Румяный"], ["Quick", "Шустрый"], ["Kind", "Добрый"], ["Fluffy", "Пушистый"], ["Merry", "Весёлый"], ["Wise", "Мудрый"], ["Tiny", "Маленький"], ["Bold", "Отважный"]];
const ANIMAL = [["Duck", "Утёнок"], ["Hedgehog", "Ёж"], ["Fox", "Лис"], ["Badger", "Барсук"], ["Owl", "Филин"], ["Beaver", "Бобр"], ["Marmot", "Сурок"], ["Raccoon", "Енот"], ["Pigeon", "Голубь"], ["Bear", "Медведь"], ["Hare", "Заяц"], ["Goose", "Гусь"]];
const mayorName = m => (lang === "ru" ? "Мэр " : "Mayor ") + L(ADJ[m.a % 12]) + " " + L(ANIMAL[m.b % 12]) + " " + m.n;
// the server keeps rules in lower case; light names read better as capitals
const showRules = s => String(s).split("\n").map(l => { const at = l.indexOf(":"); return at > 0 ? l.slice(0, at).toUpperCase() + l.slice(at) : l; }).join("\n");
$("verifyBtn").onclick = async () => {
  const b = $("verifyBtn"), v = $("verdict"), was = b.textContent;
  b.disabled = true; b.textContent = t("verifying"); v.hidden = true; v.className = "verdict";
  const mine = run && run.result;
  try {
    const r = await fetch(API + "score", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ level: levelKey, rules: $("rules").value, session: SESSION }) }).then(x => x.json());
    if (r.status === "success" && r.result) {
      const same = mine && r.result.sha === mine.sha;
      v.innerHTML = esc(same ? t("v_same", { s: r.result.stars, r: r.rank, n: r.of }) : t("v_diff")) + '<span class="mono">' + esc(t("v_meta", { a: mine ? mine.sha : "?", b: r.result.sha, h: (r.handler_version || "") + " " + (r.handler_sha || ""), d: r.device || "?", sec: r.seconds })) + "</span>";
      if (!same) v.className = "verdict bad";
    } else {
      v.className = "verdict bad";
      v.innerHTML = esc(r.reason || t("v_bad")) + "<br>" + (r.problems || []).map(esc).join("<br>");
    }
  } catch (e) { v.className = "verdict bad"; v.textContent = t("v_err"); }
  finally { b.disabled = false; b.textContent = was; v.hidden = false; v.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
};
$("mayorsBtn").onclick = async () => {
  $("mayors").hidden = false; $("mayorsLead").textContent = L(LEVELS[levelKey].name) + " · " + t("mayors_lead");
  const box = $("mayorsTable"); box.innerHTML = '<p class="sub" style="display:block">…</p>';
  try {
    const r = await fetch(API + "mayors?level=" + levelKey).then(x => x.json());
    const rows = r.mayors || [];
    if (!rows.length) { box.innerHTML = '<p class="sub" style="display:block">' + esc(t("mayors_empty")) + "</p>"; return; }
    box.innerHTML = '<table class="m"><thead><tr><th>#</th><th>' + esc(t("m_who")) + "</th><th>" + esc(t("m_stars")) + "</th><th>" + esc(t("m_wait")) + "</th><th>" + esc(t("m_home")) + "</th><th>" + esc(t("m_rules")) + "</th><th></th></tr></thead><tbody>" +
      rows.map((m, i) => `<tr><td>${i + 1}</td><td>${esc(mayorName(m.mayor))}</td><td class="st">${"★".repeat(m.stars)}</td><td>${esc(m.avgWait)} ${lang === "ru" ? "с" : "s"}</td><td>${esc(m.delivered)}</td><td class="r">${esc(showRules(m.rules))}</td><td><button type="button" data-k="${i}">${esc(t("m_open"))}</button></td></tr>`).join("") + "</tbody></table>";
    box.querySelectorAll("button[data-k]").forEach(btn => btn.onclick = () => { $("rules").value = showRules(rows[+btn.dataset.k].rules); $("mayors").hidden = true; saveRules(); start(false); });
  } catch (e) { box.innerHTML = '<p class="sub" style="display:block">' + esc(t("v_err")) + "</p>"; }
};
$("mayorsClose").onclick = () => { $("mayors").hidden = true; };

// ---------------------------------------------------------------- the panel
function drawLevels() {
  const box = $("levels"); box.innerHTML = "";
  for (const k of Object.keys(LEVELS)) {
    let best = 0; try { best = +(localStorage.getItem("traffic_best_" + k) || 0); } catch (e) {}
    const b = document.createElement("button"); b.type = "button"; b.dataset.level = k; b.className = "chip" + (k === levelKey ? " on" : "");
    b.innerHTML = esc(L(LEVELS[k].name)) + (best ? ' <span class="mini">' + "★".repeat(best) + "</span>" : "");
    b.onclick = () => setLevel(k);
    box.appendChild(b);
  }
}
function words() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(e => { e.textContent = t(e.dataset.i); });
  $("help").innerHTML = t("help"); $("howBody").innerHTML = t("how_body");
  document.querySelectorAll("[data-lang]").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  bubbles(); drawLevels();
}
$("runBtn").onclick = () => start(true);
$("hintBtn").onclick = () => { $("hintText").hidden = !$("hintText").hidden; };
$("resetBtn").onclick = () => { state = { cross: startCross(), amb: false }; applyState(); };
$("boxToggle").onchange = () => { state.cross[selected].box = $("boxToggle").checked; applyState(); };
$("ambToggle").onchange = () => { state.amb = $("ambToggle").checked; applyState(); };
$("helpBtn").onclick = () => { $("help").hidden = !$("help").hidden; };
$("howBtn").onclick = () => { $("how").hidden = false; };
$("howClose").onclick = () => { $("how").hidden = true; };
$("shareBtn").onclick = async () => { const u = shareLink(); try { await navigator.clipboard.writeText(u); toast(t("copied")); } catch (e) { prompt("", u); } };
$("rules").addEventListener("input", () => {
  clearTimeout($("rules").tm);
  $("rules").tm = setTimeout(() => {
    const p = parse($("rules").value, level);
    const box = $("problems"); box.hidden = !p.problems.length;
    if (p.problems.length) { box.innerHTML = "<b>" + esc(t("problems")) + "</b><br>" + p.problems.slice(0, 4).map(esc).join("<br>"); return; }
    state = { cross: p.cross, amb: p.ambulanceFirst };
    saveRules(); makeCrossings(); renderPanel(); start(false);
  }, 350);
});
// choosing a crossing by clicking it in the city
{
  let down = null;
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  canvas.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY }; });
  canvas.addEventListener("pointerup", e => {
    if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) { down = null; return; }
    down = null;
    const r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const o = ray.ray.origin, d = ray.ray.direction;
    if (d.y >= 0) return;
    const s = -o.y / d.y, x = o.x + d.x * s, z = o.z + d.z * s;
    let best = null, bd = 1e9;
    for (const n of city.nodes) { const dd = Math.hypot(n.x - x, n.z - z); if (dd < bd) { bd = dd; best = n; } }
    if (best && bd < BOX + 4) select(best.name);
  });
}
document.querySelectorAll("[data-speed]").forEach(b => b.onclick = () => { speed = +b.dataset.speed; document.querySelectorAll("[data-speed]").forEach(x => x.classList.toggle("on", x === b)); });
document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { lang = b.dataset.lang; try { localStorage.setItem("robot_lang", lang); } catch (e) {} words(); setLevel(levelKey, $("rules").value); });
function toast(s) { const el = $("toast"); el.textContent = s; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2600); }

// ---------------------------------------------------------------- loop
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  // the city is drawn beside the panel, not under it
  const p = document.querySelector(".panel").getBoundingClientRect();
  if (w > 760) camera.setViewOffset(w, h, -Math.round((p.right) / 2), 0, w, h);
  else camera.setViewOffset(w, h, 0, Math.round((h - p.top) / 2), w, h);
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", () => { resize(); });
let last = performance.now();
function loop() {
  const now = performance.now(), dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (run) {
    if (!run.done) {
      run.time += dt * (run.real ? speed : 1.5);
      const end = run.frames[run.frames.length - 1].t;
      if (run.time >= end) { run.time = end; show(run.time, dt); finish(); }
      else show(run.time, dt);
    } else show(run.time, dt);
    if (!run.real && run.time === 0 && run.done) { run.done = false; }
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
words(); resize();
const startLevel = (() => { const h = new URLSearchParams(location.hash.slice(1)); return LEVELS[h.get("l")] ? h.get("l") : "district"; })();
setLevel(startLevel);
loop();
window.__traffic = { simulate, get run() { return run; }, LEVELS, camera, scene, renderer, controls, THREE, get world() { return world; } };
</script>
